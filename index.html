<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Angry Soviet</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#1a1a1a;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
  canvas{display:block;}
  #hud{position:fixed;top:10px;left:10px;color:#fff;font-size:16px;text-shadow:1px 1px 2px #000;pointer-events:none;line-height:1.35;z-index:6;}
  #hud span{color:#ff5252;font-weight:bold;}
  #hud .vamp{color:#cfd8dc;}
  #weaponBar{position:fixed;bottom:15px;left:15px;color:#eee;font-size:13px;text-shadow:1px 1px 2px #000;pointer-events:none;line-height:1.5;background:rgba(0,0,0,0.55);padding:6px 10px;border-radius:6px;z-index:6;}
  #weaponBar .w{padding:1px 0;opacity:0.45;}
  #weaponBar .w.active{opacity:1;color:#ffd54f;font-weight:bold;}
  #msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:30px;text-align:center;text-shadow:2px 2px 4px #000;pointer-events:none;display:none;z-index:7;}
  #fireBtn{position:fixed;bottom:25px;right:25px;width:100px;height:100px;border-radius:50%;background:#c62828;color:#fff;font-size:16px;font-weight:bold;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:10;}
  #fireBtn:active{background:#8e0000;}
  #joyBase{position:fixed;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.2);touch-action:none;z-index:10;}
  #joyKnob{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);transform:translate(-50%,-50%);pointer-events:none;}
  #weaponBtns{position:fixed;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:10;}
  #weaponBtns button{width:64px;height:52px;border-radius:8px;background:rgba(30,30,30,0.85);color:#fff;font-size:11px;font-weight:bold;border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;text-align:center;padding:0;line-height:1.05;cursor:pointer;}
  #weaponBtns button.active{background:#ff9800;color:#000;border-color:#fff;}
  #weaponBtns button:active{transform:scale(0.95);}
  /* Вспышка от урона */
  #damageFlash{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle, transparent 30%, rgba(200,0,0,0.7) 100%);opacity:0;transition:opacity 0.15s;}
  /* Красный экран от киллов */
  #killScreen{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle, transparent 25%, rgba(255,0,0,0.85) 100%);opacity:0;transition:opacity 0.35s;}
  /* Всплывающая надпись о киллах */
  #killMsg{
    position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(0.5);
    color:#ff2a2a;font-size:56px;font-weight:900;text-align:center;
    text-shadow: 0 0 20px #ff0000, 0 0 40px #8b0000, 4px 4px 0 #000;
    pointer-events:none;z-index:8;opacity:0;
    letter-spacing:3px;font-family:Arial Black, Arial, sans-serif;
    transition: opacity 0.25s, transform 0.3s;
  }
  #killMsg.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }
  #killMsg.small{font-size:38px;color:#ff9800;text-shadow:0 0 15px #ff5722, 3px 3px 0 #000;}
  #killMsg.big{font-size:72px;color:#ff0000;text-shadow:0 0 25px #ff0000, 0 0 50px #8b0000, 5px 5px 0 #000;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="killScreen"></div>
<div id="damageFlash"></div>
<div id="killMsg"></div>
<div id="hud">
  Геев фурриёбов: <span id="score">0</span><br>
  Правачков: <span class="vamp" id="vampScore">0</span><br>
  Оружие: <span id="weapon">Пистолет</span><br>
  HP: <span id="hp">100</span>
</div>
<div id="weaponBar">
  <div class="w active" id="w-pistol">1 · Пистолет</div>
  <div class="w" id="w-shotgun">2 · Дробовик</div>
  <div class="w" id="w-rifle">3 · Автомат</div>
  <div class="w" id="w-rpg">4 · РПГ</div>
</div>
<div id="msg"></div>
<button id="fireBtn">ОГОНЬ</button>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="weaponBtns">
  <button data-w="pistol" class="active">1<br>Пистолет</button>
  <button data-w="shotgun">2<br>Дробовик</button>
  <button data-w="rifle">3<br>Автомат</button>
  <button data-w="rpg">4<br>РПГ</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();
const keys = {};
const mouse = { x: W/2, y: H/2, down: false };
let fireBtnPressed = false;
const damageFlash = document.getElementById('damageFlash');
const killScreen = document.getElementById('killScreen');
const killMsgEl = document.getElementById('killMsg');
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k === '1') switchWeapon('pistol');
  if(k === '2') switchWeapon('shotgun');
  if(k === '3') switchWeapon('rifle');
  if(k === '4') switchWeapon('rpg');
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup',   () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const order = ['pistol','shotgun','rifle','rpg'];
  const i = order.indexOf(player.weapon);
  const dir = e.deltaY > 0 ? 1 : -1;
  switchWeapon(order[(i + dir + order.length) % order.length]);
}, {passive:false});
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('mousedown', e => { e.preventDefault(); fireBtnPressed = true; });
fireBtn.addEventListener('mouseup',   e => { e.preventDefault(); fireBtnPressed = false; });
fireBtn.addEventListener('mouseleave',() => { fireBtnPressed = false; });
fireBtn.addEventListener('touchstart',e => { e.preventDefault(); fireBtnPressed = true; }, {passive:false});
fireBtn.addEventListener('touchend',  e => { e.preventDefault(); fireBtnPressed = false; }, {passive:false});
fireBtn.addEventListener('touchcancel',() => { fireBtnPressed = false; });
const weaponBtns = document.querySelectorAll('#weaponBtns button');
weaponBtns.forEach(btn => {
  btn.addEventListener('click', e => { e.preventDefault(); switchWeapon(btn.dataset.w); });
  btn.addEventListener('touchstart', e => { e.preventDefault(); switchWeapon(btn.dataset.w); }, {passive:false});
});
const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joy = { active:false, dx:0, dy:0, id:null };
const JOY_MAX = 40;
function joyStart(x, y, id){ joy.active = true; joy.id = id; joyMove(x, y); }
function joyMove(x, y){
  if(!joy.active) return;
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = x - cx, dy = y - cy;
  const len = Math.hypot(dx, dy);
  if(len > JOY_MAX){ dx = dx/len*JOY_MAX; dy = dy/len*JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyEnd(){
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyKnob.style.transform = 'translate(-50%,-50%)';
}
joyBase.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyStart(t.clientX, t.clientY, t.identifier); }, {passive:false});
joyBase.addEventListener('touchmove', e => { e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyMove(t.clientX, t.clientY); break; } } }, {passive:false});
joyBase.addEventListener('touchend', e => { e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyEnd(); break; } } }, {passive:false});
joyBase.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); }, {passive:false});
joyBase.addEventListener('mousedown', e => { e.preventDefault(); joyStart(e.clientX, e.clientY, 'mouse'); });
addEventListener('mousemove', e => { if(joy.id === 'mouse') joyMove(e.clientX, e.clientY); });
addEventListener('mouseup',   e => { if(joy.id === 'mouse') joyEnd(); });
const player = {
  x: W/2, y: H/2, r: 16, speed: 3.2,
  hp: 100, maxHp: 100,
  weapon: 'pistol',
  ammo: { pistol: Infinity, shotgun: Infinity, rifle: Infinity, rpg: Infinity },
  fireCooldown: 0,
  aimAngle: 0,
  recoil: 0
};
const WEAPONS = {
  pistol:  { name:'Пистолет', rate:16, speed:16, dmg:2,  spread:0.02,  pellets:1, color:'#ffe082', len:20, kick:2,  shake:3,   shakeDecay:0.75, flash:6,  sound:'#ffd54f' },
  shotgun: { name:'Дробовик', rate:55, speed:14, dmg:2,  spread:0.22,  pellets:9, color:'#ffab91', len:26, kick:9,  shake:14,  shakeDecay:0.82, flash:12, sound:'#ff8a65' },
  rifle:   { name:'Автомат',  rate:5,  speed:20, dmg:2,  spread:0.045, pellets:1, color:'#81d4fa', len:30, kick:1.2,shake:1.8, shakeDecay:0.55, flash:4,  sound:'#4fc3f7' },
  rpg:     { name:'РПГ',      rate:80, speed:10, dmg:99, spread:0.01,  pellets:1, color:'#ff7043', len:30, kick:16, shake:22,  shakeDecay:0.88, flash:18, sound:'#ff5722', explosive:true }
};
function switchWeapon(name){
  if(name === player.weapon) return;
  player.weapon = name;
  updateHUD();
}
let bullets = [];
let zombies = [];
let vampires = [];
let corpses = [];
let vampireCorpses = [];
let bloodStains = [];
let gore = [];
let particles = [];
let explosions = [];
let smoke = [];
let casings = [];
let shockwaves = [];
let pickups = [];
let score = 0;
let vampScore = 0;
let spawnTimer = 0;
let spawnInterval = 90;
let vampSpawnTimer = 0;
let vampSpawnInterval = 240;
let gameOver = false;
let screenShake = 0;
let currentShakeDecay = 0.85;
// ==== СИСТЕМА КИЛЛОВ ПОДРЯД ====
let killStreak = 0;              // текущая серия убийств
let killStreakTimer = 0;         // таймер, чтобы серия сбрасывалась
const KILL_STREAK_TIMEOUT = 150; // кадров (2.5 сек при 60 fps)
let killStreakMsgs = [];         // активные всплывающие надписи
let killScreenIntensity = 0;     // 0..1 -- насколько красный экран
let killScreenTimer = 0;
// Пороговые сообщения
const KILL_MILESTONES = [
  { kills: 3,  text: 'MONSTER KILL',  cls: 'small', color: 0.35, dur: 120 },
  { kills: 10, text: 'KILLING SPREE', cls: '',      color: 0.60, dur: 150 },
  { kills: 20, text: 'RAMPAGE',       cls: 'big',   color: 0.90, dur: 180 }
];
const rand = (a,b) => a + Math.random()*(b-a);
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const BLOOD_BRIGHT = '#ff0000';
const BLOOD_DARK   = '#cc0000';
const BLOOD_CORE   = '#8b0000';
function spawnZombie(){
  const side = Math.floor(Math.random()*4);
  let x, y;
  if(side===0){ x = rand(0,W); y = -30; }
  else if(side===1){ x = W+30; y = rand(0,H); }
  else if(side===2){ x = rand(0,W); y = H+30; }
  else { x = -30; y = rand(0,H); }
  const hp = 1 + Math.floor(score/10);
  const hue = rand(320,350);
  zombies.push({
    x, y, r: 14,
    speed: rand(0.7, 1.4) + score*0.005,
    hp, maxHp: hp,
    bodyColor: `hsl(${hue},80%,${rand(65,78)}%)`,
    earColor:  `hsl(${hue},80%,${rand(55,68)}%)`,
    tailColor: `hsl(${hue},80%,${rand(60,72)}%)`,
    hue,
    earPhase: Math.random()*Math.PI*2,
    tailPhase: Math.random()*Math.PI*2
  });
}
function spawnVampire(){
  const side = Math.floor(Math.random()*4);
  let x, y;
  if(side===0){ x = rand(0,W); y = -40; }
  else if(side===1){ x = W+40; y = rand(0,H); }
  else if(side===2){ x = rand(0,W); y = H+40; }
  else { x = -40; y = rand(0,H); }
  const hp = 12 + Math.floor(score * 0.8);
  vampires.push({
    x, y, r: 16,
    speed: rand(0.9, 1.3) + score*0.003,
    hp, maxHp: hp,
    aimAngle: Math.random()*Math.PI*2
  });
}
function addBloodStain(x, y, size){
  const drops = [];
  const n = 6 + Math.floor(Math.random()*6);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const d = Math.random()*size*1.9;
    drops.push({ x: Math.cos(a)*d, y: Math.sin(a)*d, r: 3 + Math.random()*size*0.7 });
  }
  bloodStains.push({ x, y, drops });
  if(bloodStains.length > 300) bloodStains.shift();
}
function addBloodPool(x, y, size){
  const drops = [];
  const n = 20 + Math.floor(Math.random()*15);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const d = Math.random()*size;
    drops.push({ x: Math.cos(a)*d, y: Math.sin(a)*d, r: 6 + Math.random()*size*0.4 });
  }
  bloodStains.push({ x, y, drops, big: true });
  if(bloodStains.length > 300) bloodStains.shift();
}
function addCorpse(z){
  corpses.push({
    x: z.x, y: z.y, r: z.r,
    angle: Math.atan2(player.y - z.y, player.x - z.x),
    bodyColor: z.bodyColor,
    earColor: z.earColor,
    tailColor: z.tailColor,
    hue: z.hue
  });
  if(corpses.length > 80) corpses.shift();
}
function addVampireCorpse(v){
  vampireCorpses.push({
    x: v.x, y: v.y, r: v.r,
    angle: Math.atan2(player.y - v.y, player.x - v.x)
  });
  if(vampireCorpses.length > 40) vampireCorpses.shift();
}
function spawnGore(x, y, z){
  const pieces = 14 + Math.floor(Math.random()*10);
  const baseHue = z ? (z.hue !== undefined ? z.hue : 0) : 340;
  for(let i=0;i<pieces;i++){
    const a = Math.random()*Math.PI*2;
    const s = rand(3, 9);
    gore.push({
      x, y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      r: rand(3, 7),
      color: `hsl(${baseHue}, ${rand(70,90)}%, ${rand(25,45)}%)`,
      life: 999999, settle: false,
      rot: Math.random()*Math.PI*2,
      rotSpeed: rand(-0.2, 0.2),
      kind: Math.random() < 0.3 ? 'bone' : 'meat'
    });
  }
  addBloodPool(x, y, 55);
}
function spawnPickup(){
  pickups.push({ x: rand(60, W-60), y: rand(60, H-60), r: 14, type: 'health', life: 1200 });
}
function explode(x, y, radius, dmg){
  explosions.push({ x, y, r: 0, maxR: radius, life: 30 });
  shockwaves.push({ x, y, r: 0, maxR: radius * 1.4, life: 20 });
  screenShake = Math.max(screenShake, 26);
  currentShakeDecay = 0.88;
  for(let i=zombies.length-1;i>=0;i--){
    const z = zombies[i];
    if(dist(z, {x,y}) < radius + z.r){
      spawnGore(z.x, z.y, z);
      zombies.splice(i,1);
      score++;
      document.getElementById('score').textContent = score;
      registerKill();
    }
  }
  for(let i=vampires.length-1;i>=0;i--){
    const v = vampires[i];
    if(dist(v, {x,y}) < radius + v.r){
      v.hp -= dmg;
      if(v.hp <= 0){
        spawnGore(v.x, v.y, {hue: 0});
        addBloodPool(v.x, v.y, 60);
        vampires.splice(i,1);
        vampScore++;
        document.getElementById('vampScore').textContent = vampScore;
        registerKill();
      }
    }
  }
  for(let i=0;i<50;i++){
    const a = Math.random()*Math.PI*2;
    const s = rand(3,14);
    particles.push({
      x, y,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:30, color: i%3===0 ? BLOOD_BRIGHT : (i%3===1 ? '#ff9800' : '#ffeb3b')
    });
  }
  for(let i=0;i<15;i++){
    const a = Math.random()*Math.PI*2;
    const s = rand(1,3);
    smoke.push({
      x, y,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      r: rand(8,16), life: 60, maxLife: 60
    });
  }
}
// ==== РЕГИСТРАЦИЯ КИЛЛА (для серии) ====
function registerKill(){
  killStreak++;
  killStreakTimer = KILL_STREAK_TIMEOUT;
  // Проверяем пороги
  for(const m of KILL_MILESTONES){
    if(killStreak === m.kills){
      showKillMessage(m.text, m.cls, m.color, m.dur);
      break;
    }
  }
}
function showKillMessage(text, cls, intensity, dur){
  // показываем надпись
  killMsgEl.textContent = text;
  killMsgEl.className = '';
  if(cls) killMsgEl.classList.add(cls);
  // перезапуск анимации
  void killMsgEl.offsetWidth;
  killMsgEl.classList.add('show');
  // красный экран
  killScreenIntensity = Math.max(killScreenIntensity, intensity);
  killScreenTimer = dur;
  // прячем надпись через некоторое время
  setTimeout(() => {
    killMsgEl.classList.remove('show');
  }, 1400);
}
function shoot(){
  const w = WEAPONS[player.weapon];
  const angle = player.aimAngle;
  const offsetX = Math.cos(angle)*w.len;
  const offsetY = Math.sin(angle)*w.len;
  if(w.explosive){
    bullets.push({
      x: player.x + offsetX, y: player.y + offsetY,
      vx: Math.cos(angle)*w.speed, vy: Math.sin(angle)*w.speed,
      r: 5, dmg: w.dmg, color: w.color, life: 120,
      explosive: true, blastR: 70, rocket: true
    });
  } else {
    for(let i=0;i<w.pellets;i++){
      const a = angle + rand(-w.spread, w.spread);
      bullets.push({
        x: player.x + offsetX, y: player.y + offsetY,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        r: 2.5, dmg: w.dmg, color: w.color, life: 60
      });
    }
  }
  for(let i=0;i<5;i++){
    const a = angle + rand(-0.3,0.3);
    smoke.push({
      x: player.x + offsetX, y: player.y + offsetY,
      vx: Math.cos(a)*rand(1,3) + rand(-0.5,0.5), vy: Math.sin(a)*rand(1,3) + rand(-0.5,0.5),
      r: rand(5,10), life: 30, maxLife: 30
    });
  }
  for(let i=0;i<w.flash;i++){
    const a = angle + rand(-0.6,0.6);
    particles.push({
      x: player.x + offsetX, y: player.y + offsetY,
      vx: Math.cos(a)*rand(4,9), vy: Math.sin(a)*rand(4,9),
      life: 8, color: w.sound
    });
  }
  const perpA = angle + Math.PI/2;
  casings.push({
    x: player.x + Math.cos(angle)*6 + Math.cos(perpA)*8,
    y: player.y + Math.sin(angle)*6 + Math.sin(perpA)*8,
    vx: Math.cos(perpA)*rand(3,5) + rand(-1,1),
    vy: Math.sin(perpA)*rand(3,5) + rand(-1,1),
    rot: Math.random()*Math.PI*2,
    rotSpeed: rand(-0.3,0.3),
    life: 200
  });
  player.recoil = w.kick;
  if(screenShake < w.shake) screenShake = w.shake;
  currentShakeDecay = w.shakeDecay;
}
function findNearestTarget(){
  let best = null, bestD = Infinity;
  for(const z of zombies){
    const d = dist(z, player);
    if(d < bestD){ bestD = d; best = z; }
  }
  for(const v of vampires){
    const d = dist(v, player);
    if(d < bestD){ bestD = d; best = v; }
  }
  return best;
}
function flashDamage(){
  damageFlash.style.opacity = 0.9;
  setTimeout(() => { damageFlash.style.opacity = 0; }, 120);
}
function update(){
  if(gameOver) return;
  let dx=0, dy=0;
  if(keys['w']||keys['ц']||keys['arrowup'])    dy -= 1;
  if(keys['s']||keys['ы']||keys['arrowdown'])  dy += 1;
  if(keys['a']||keys['ф']||keys['arrowleft'])  dx -= 1;
  if(keys['d']||keys['в']||keys['arrowright']) dx += 1;
  dx += joy.dx; dy += joy.dy;
  const dl = Math.hypot(dx,dy);
  if(dl > 0.05){
    const k = Math.min(dl, 1);
    player.x += dx/dl*player.speed*k;
    player.y += dy/dl*player.speed*k;
  }
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));
  const target = findNearestTarget();
  let want = target
    ? Math.atan2(target.y - player.y, target.x - player.x)
    : Math.atan2(mouse.y - player.y, mouse.x - player.x);
  let diff = want - player.aimAngle;
  while(diff >  Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  player.aimAngle += diff * 0.3;
  if(player.recoil > 0) player.recoil *= 0.7;
  if(player.recoil < 0.1) player.recoil = 0;
  if(player.fireCooldown > 0) player.fireCooldown--;
  if((mouse.down || fireBtnPressed) && player.fireCooldown <= 0){
    shoot();
    player.fireCooldown = WEAPONS[player.weapon].rate;
  }
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if(b.rocket && Math.random() < 0.8){
      smoke.push({
        x: b.x, y: b.y,
        vx: rand(-0.5,0.5), vy: rand(-0.5,0.5),
        r: rand(4,8), life: 40, maxLife: 40
      });
    }
    if(b.life<=0 || b.x<-20 || b.x>W+20 || b.y<-20 || b.y>H+20){
      if(b.explosive) explode(b.x, b.y, b.blastR, b.dmg);
      bullets.splice(i,1); continue;
    }
    let hit = false;
    for(let j=zombies.length-1;j>=0;j--){
      const z = zombies[j];
      if(dist(b,z) < b.r + z.r){
        if(b.explosive){ explode(b.x, b.y, b.blastR, b.dmg); }
        else {
          z.hp -= b.dmg;
          for(let k=0;k<8;k++){
            const a = Math.atan2(b.vy, b.vx) + rand(-0.8,0.8);
            const s = rand(2,5);
            particles.push({ x:z.x, y:z.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:18, color: BLOOD_BRIGHT });
          }
          if(z.hp <= 0){
            addBloodStain(z.x, z.y, z.r);
            addCorpse(z);
            for(let k=0;k<16;k++){
              const a = Math.random()*Math.PI*2;
              const s = rand(2,7);
              particles.push({ x:z.x, y:z.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:30, color: BLOOD_BRIGHT });
            }
            zombies.splice(j,1);
            score++;
            document.getElementById('score').textContent = score;
            registerKill();
          }
        }
        hit = true; break;
      }
    }
    if(hit){ bullets.splice(i,1); continue; }
    for(let j=vampires.length-1;j>=0;j--){
      const v = vampires[j];
      if(dist(b,v) < b.r + v.r){
        if(b.explosive){ explode(b.x, b.y, b.blastR, b.dmg); }
        else {
          v.hp -= b.dmg;
          for(let k=0;k<10;k++){
            const a = Math.atan2(b.vy, b.vx) + rand(-0.9,0.9);
            const s = rand(2,6);
            particles.push({ x:v.x, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:18, color: BLOOD_BRIGHT });
          }
          if(v.hp <= 0){
            addBloodStain(v.x, v.y, v.r + 4);
            addBloodPool(v.x, v.y, 40);
            addVampireCorpse(v);
            for(let k=0;k<20;k++){
              const a = Math.random()*Math.PI*2;
              const s = rand(2,8);
              particles.push({ x:v.x, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:32, color: BLOOD_BRIGHT });
            }
            vampires.splice(j,1);
            vampScore++;
            document.getElementById('vampScore').textContent = vampScore;
            registerKill();
          }
        }
        hit = true; break;
      }
    }
    if(hit) bullets.splice(i,1);
  }
  for(const z of zombies){
    const a = Math.atan2(player.y - z.y, player.x - z.x);
    z.x += Math.cos(a)*z.speed;
    z.y += Math.sin(a)*z.speed;
    z.earPhase  += 0.15;
    z.tailPhase += 0.2;
    if(dist(z,player) < z.r + player.r){
      player.hp -= 0.35;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
      flashDamage();
      if(player.hp <= 0){ endGame(); }
    }
  }
  for(const v of vampires){
    const a = Math.atan2(player.y - v.y, player.x - v.x);
    v.x += Math.cos(a)*v.speed;
    v.y += Math.sin(a)*v.speed;
    let diff = a - v.aimAngle;
    while(diff >  Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    v.aimAngle += diff * 0.2;
    if(dist(v,player) < v.r + player.r){
      player.hp -= 1.2;
      document.getElementById('hp').textContent = Math.max(0, Math.floor(player.hp));
      flashDamage();
      if(player.hp <= 0){ endGame(); }
    }
  }
  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    p.life--;
    if(p.life<=0){ pickups.splice(i,1); continue; }
    if(dist(p,player) < p.r + player.r){
      player.hp = Math.min(player.maxHp, player.hp + 30);
      document.getElementById('hp').textContent = Math.floor(player.hp);
      pickups.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=smoke.length-1;i>=0;i--){
    const s = smoke[i];
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.96; s.vy *= 0.96;
    s.r += 0.4;
    s.life--;
    if(s.life<=0) smoke.splice(i,1);
  }
  for(let i=casings.length-1;i>=0;i--){
    const c = casings[i];
    c.x += c.vx; c.y += c.vy;
    c.vx *= 0.88; c.vy *= 0.88;
    c.rot += c.rotSpeed;
    c.life--;
    if(c.life<=0) casings.splice(i,1);
  }
  for(const g of gore){
    if(g.settle) continue;
    g.x += g.vx; g.y += g.vy;
    g.vx *= 0.9; g.vy *= 0.9;
    g.rot += g.rotSpeed;
    if(Math.hypot(g.vx, g.vy) < 0.2){ g.settle = true; }
  }
  for(let i=explosions.length-1;i>=0;i--){
    const e = explosions[i];
    e.r += e.maxR / 15;
    e.life--;
    if(e.life<=0) explosions.splice(i,1);
  }
  for(let i=shockwaves.length-1;i>=0;i--){
    const s = shockwaves[i];
    s.r += s.maxR / 20;
    s.life--;
    if(s.life<=0) shockwaves.splice(i,1);
  }
  if(screenShake > 0.2) screenShake *= currentShakeDecay;
  else screenShake = 0;
  // ==== ОБНОВЛЕНИЕ КИЛЛ-СТРИКА ====
  if(killStreakTimer > 0){
    killStreakTimer--;
    if(killStreakTimer === 0){
      killStreak = 0;
    }
  }
  // красный экран от серии
  if(killScreenTimer > 0){
    killScreenTimer--;
  } else {
    killScreenIntensity *= 0.95;
    if(killScreenIntensity < 0.02) killScreenIntensity = 0;
  }
  killScreen.style.opacity = killScreenIntensity;
  spawnTimer++;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnZombie();
    if(score > 15 && spawnInterval > 25) spawnInterval -= 0.3;
  }
  vampSpawnTimer++;
  if(vampSpawnTimer >= vampSpawnInterval){
    vampSpawnTimer = 0;
    spawnVampire();
    if(vampSpawnInterval > 90) vampSpawnInterval -= 4;
  }
}
function updateHUD(){
  document.getElementById('weapon').textContent = WEAPONS[player.weapon].name;
  const order = [['pistol','1'],['shotgun','2'],['rifle','3'],['rpg','4']];

    const el = document.getElementById('w-' + k);

function drawCorpse(c){
  const angle = c.angle;
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const backX = Math.cos(angle + Math.PI);
  const backY = Math.sin(angle + Math.PI);
  ctx.strokeStyle = c.tailColor;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c.x - Math.cos(angle)*c.r, c.y - Math.sin(angle)*c.r);
  ctx.quadraticCurveTo(
    c.x - Math.cos(angle)*c.r - backX*10 + perpX*8,
    c.y - Math.sin(angle)*c.r - backY*10 + perpY*8,
    c.x - Math.cos(angle)*c.r - backX*20 + perpX*14,
    c.y - Math.sin(angle)*c.r - backY*20 + perpY*14
  );
  ctx.stroke();
  ctx.fillStyle = c.earColor;
  ctx.beginPath();
  ctx.moveTo(c.x + perpX*7, c.y + perpY*7);
  ctx.lineTo(c.x + perpX*15 + backX*6, c.y + perpY*15 + backY*6);
  ctx.lineTo(c.x + perpX*4 + backX*8, c.y + perpY*4 + backY*8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x - perpX*7, c.y - perpY*7);
  ctx.lineTo(c.x - perpX*15 + backX*6, c.y - perpY*15 + backY*6);
  ctx.lineTo(c.x - perpX*4 + backX*8, c.y - perpY*4 + backY*8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.r*1.1, c.r*0.85, angle, 0, Math.PI*2);
  ctx.fillStyle = c.bodyColor;
  ctx.fill();
  ctx.strokeStyle = '#8e1145';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = '#3e0a25';
  ctx.lineWidth = 1.5;
  const ex1 = c.x - 5, ey1 = c.y - 3;
  const ex2 = c.x + 5, ey2 = c.y - 3;
  ctx.beginPath();
  ctx.moveTo(ex1-2, ey1-2); ctx.lineTo(ex1+2, ey1+2);
  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
}
function drawVampireCorpse(vc){
  const angle = vc.angle;
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  ctx.strokeStyle = '#37474f';
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(vc.x + perpX*8 + cosA*4, vc.y + perpY*8 + sinA*4);
  ctx.lineTo(vc.x + perpX*8 + cosA*24, vc.y + perpY*8 + sinA*24);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(vc.x, vc.y, vc.r*1.1, vc.r*0.85, angle, 0, Math.PI*2);
  ctx.fillStyle = '#e8a48a';
  ctx.fill();
  ctx.strokeStyle = '#a15a44';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = '#3e0a25';
  ctx.lineWidth = 1.5;
  const ex1 = vc.x - 6, ey1 = vc.y - 3;
  const ex2 = vc.x + 6, ey2 = vc.y - 3;
  ctx.beginPath();
  ctx.moveTo(ex1-2, ey1-2); ctx.lineTo(ex1+2, ey1+2);
  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(vc.x, vc.y - 4, vc.r - 2, Math.PI, 0);
  ctx.closePath();
  const g = ctx.createLinearGradient(vc.x, vc.y - vc.r - 4, vc.x, vc.y - 4);
  g.addColorStop(0, '#cfd8dc');
  g.addColorStop(1, '#607d8b');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = '#37474f';
  ctx.lineWidth = 2;
  ctx.stroke();
  drawCross(vc.x, vc.y - 8, 5, '#000000', '#000000');
}
function drawZombie(z){
  const angle = Math.atan2(player.y - z.y, player.x - z.x);
  const tailWave = Math.sin(z.tailPhase) * 10;
  const tailBaseX = z.x - Math.cos(angle) * z.r;
  const tailBaseY = z.y - Math.sin(angle) * z.r;
  const tailMidX  = tailBaseX - Math.cos(angle) * 14 + Math.cos(angle + Math.PI/2) * tailWave * 0.5;
  const tailMidY  = tailBaseY - Math.sin(angle) * 14 + Math.sin(angle + Math.PI/2) * tailWave * 0.5;
  const tailTipX  = tailBaseX - Math.cos(angle) * 26 + Math.cos(angle + Math.PI/2) * tailWave;
  const tailTipY  = tailBaseY - Math.sin(angle) * 26 + Math.sin(angle + Math.PI/2) * tailWave;
  ctx.strokeStyle = z.tailColor;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(tailBaseX, tailBaseY);
  ctx.quadraticCurveTo(tailMidX, tailMidY, tailTipX, tailTipY);
  ctx.stroke();
  ctx.fillStyle = z.tailColor;
  ctx.beginPath(); ctx.arc(tailTipX, tailTipY, 5, 0, Math.PI*2); ctx.fill();
  const earWave = Math.sin(z.earPhase) * 3;
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const backX = Math.cos(angle + Math.PI);
  const backY = Math.sin(angle + Math.PI);
  const e1baseX = z.x + perpX*8 + backX*6;
  const e1baseY = z.y + perpY*8 + backY*6;
  const e1tipX  = e1baseX + perpX*10 + backX*14 + perpX*earWave*0.3;
  const e1tipY  = e1baseY + perpY*10 + backY*14 + perpY*earWave*0.3;
  const e2baseX = z.x - perpX*8 + backX*6;
  const e2baseY = z.y - perpY*8 + backY*6;
  const e2tipX  = e2baseX - perpX*10 + backX*14 - perpX*earWave*0.3;
  const e2tipY  = e2baseY - perpY*10 + backY*14 - perpY*earWave*0.3;
  ctx.fillStyle = z.earColor;
  ctx.beginPath();
  ctx.moveTo(e1baseX + perpX*3, e1baseY + perpY*3);
  ctx.lineTo(e1tipX - perpX*2,  e1tipY - perpY*2);
  ctx.lineTo(e1baseX - perpX*3, e1baseY - perpY*3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(e2baseX - perpX*3, e2baseY - perpY*3);
  ctx.lineTo(e2tipX + perpX*2,  e2tipY + perpY*2);
  ctx.lineTo(e2baseX + perpX*3, e2baseY + perpY*3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(e1baseX, e1baseY); ctx.lineTo(e1tipX, e1tipY);
  ctx.lineTo(e1baseX - perpX*6, e1baseY - perpY*6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e2baseX, e2baseY); ctx.lineTo(e2tipX, e2tipY);
  ctx.lineTo(e2baseX + perpX*6, e2baseY + perpY*6); ctx.stroke();
  ctx.beginPath();
  ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
  ctx.fillStyle = z.bodyColor; ctx.fill();
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 2.5; ctx.stroke();
  const eyeOffsetX = Math.cos(angle) * 4;
  const eyeOffsetY = Math.sin(angle) * 4;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(z.x - 5 + eyeOffsetX*0.3, z.y - 3 + eyeOffsetY*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + eyeOffsetX*0.3, z.y - 3 + eyeOffsetY*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(z.x - 5 + eyeOffsetX, z.y - 3 + eyeOffsetY, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + eyeOffsetX, z.y - 3 + eyeOffsetY, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#880e4f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(z.x, z.y + 5, 4, 0, Math.PI); ctx.stroke();
  if(z.hp < z.maxHp){
    const w = z.r*2;
    ctx.fillStyle = '#000';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w, 4);
    ctx.fillStyle = '#f44336';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w*(z.hp/z.maxHp), 4);
  }
}
function drawCross(cx, cy, size, fill, stroke){
  ctx.fillStyle = fill;
  const w = size * 0.5;
  const h = size * 1.6;
  ctx.fillRect(cx - w/2, cy - h/2, w, h);
  const barY = cy - h*0.15;
  ctx.fillRect(cx - h*0.45, barY - w/2, h*0.9, w);
}
function drawVampire(v){
  const a = v.aimAngle;
  const cosA = Math.cos(a);
  const sinA = Math.sin(a);
  const perpX = Math.cos(a + Math.PI/2);
  const perpY = Math.sin(a + Math.PI/2);
  const sideOffset = -8;
  const gunX = v.x + perpX * sideOffset;
  const gunY = v.y + perpY * sideOffset;
  drawPistol(gunX, gunY, cosA, sinA);
  ctx.beginPath();
  ctx.arc(v.x, v.y, v.r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(v.x-4, v.y-4, 3, v.x, v.y, v.r);
  grad.addColorStop(0, '#ffccbc');
  grad.addColorStop(1, '#e09680');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#a15a44';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  const lookX = cosA * 3;
  const lookY = sinA * 3;
  const eyeY = v.y + 2;
  const eyeR = 5.5;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(v.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(v.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(v.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(v.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.arc(v.x - 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(v.x + 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.arc(v.x, v.y - 5, v.r - 1, Math.PI, 0);
  ctx.closePath();
  const helmGrad = ctx.createLinearGradient(v.x, v.y - v.r - 5, v.x, v.y - 5);
  helmGrad.addColorStop(0, '#cfd8dc');
  helmGrad.addColorStop(1, '#607d8b');
  ctx.fillStyle = helmGrad;
  ctx.fill();
  ctx.strokeStyle = '#37474f';
  ctx.lineWidth = 2;
  ctx.stroke();
  drawCross(v.x, v.y - 9, 5, '#000000', '#000000');
  const skin = '#ffccbc';
  const skinEdge = '#a15a44';
  ctx.fillStyle = skin;
  ctx.strokeStyle = skinEdge;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(gunX + cosA*6, gunY + sinA*6, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(v.x - perpX*(v.r+2), v.y - perpY*(v.r+2), 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  if(v.hp < v.maxHp){
    const w = v.r*2 + 6;
    ctx.fillStyle = '#000';
    ctx.fillRect(v.x-w/2, v.y - v.r - 16, w, 5);
    ctx.fillStyle = '#d32f2f';
    ctx.fillRect(v.x-w/2, v.y - v.r - 16, w*(v.hp/v.maxHp), 5);
  }
}
// ==== РЕАЛИСТИЧНЫЕ СПРАЙТЫ ОРУЖИЯ ====
function drawPistol(x, y, cosA, sinA){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(sinA, cosA));
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(0, -5, 20, 8);
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(0, -5, 20, 2);
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 2, 20, 1);
  ctx.fillStyle = '#111';
  ctx.fillRect(20, -3, 6, 5);
  ctx.fillStyle = '#333';
  ctx.fillRect(20, -3, 6, 1);
  ctx.fillStyle = '#000';
  ctx.fillRect(25, -2, 1, 3);
  ctx.fillStyle = '#888';
  ctx.fillRect(18, -7, 2, 3);
  ctx.fillStyle = '#777';
  ctx.fillRect(1, -7, 2, 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(0, 3);
  ctx.lineTo(-3, 14);
  ctx.lineTo(5, 14);
  ctx.lineTo(7, 3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(-1 + i*1.6, 5);
    ctx.lineTo(-2 + i*1.6, 13);
    ctx.stroke();
  }
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(6, 3, 4, 0, Math.PI);
  ctx.stroke();
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-2, -5, 3, 4);
  ctx.restore();
}
function drawShotgun(x, y, cosA, sinA){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(sinA, cosA));
  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.moveTo(-12, -3);
  ctx.lineTo(-2, -3);
  ctx.lineTo(-2, 5);
  ctx.lineTo(-12, 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(-10, -1); ctx.lineTo(-4, -1);
  ctx.moveTo(-10, 2); ctx.lineTo(-4, 2);
  ctx.stroke();
  ctx.fillStyle = '#37474f';
  ctx.fillRect(-2, -5, 34, 7);
  ctx.fillStyle = '#546e7a';
  ctx.fillRect(-2, -5, 34, 2);
  ctx.fillStyle = '#1c2529';
  ctx.fillRect(-2, 1, 34, 1);
  ctx.fillStyle = '#000';
  ctx.fillRect(31, -4, 2, 5);
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(8, 2, 12, 6);
  ctx.strokeStyle = '#3e2723';
  ctx.lineWidth = 1;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(9 + i*3, 2);
    ctx.lineTo(9 + i*3, 8);
    ctx.stroke();
  }
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 2, 3.5, 0, Math.PI);
  ctx.stroke();
  ctx.fillStyle = '#cfd8dc';
  ctx.fillRect(28, -8, 2, 3);
  ctx.restore();
}
function drawRifleGun(x, y, cosA, sinA){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(sinA, cosA));
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(-12, -3);
  ctx.lineTo(-2, -3);
  ctx.lineTo(-2, 4);
  ctx.lineTo(-12, 5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-2, -5, 28, 8);
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-2, -5, 28, 2);
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(-2, 2, 28, 1);
  ctx.fillStyle = '#111';
  ctx.fillRect(26, -3, 8, 4);
  ctx.fillStyle = '#333';
  ctx.fillRect(26, -3, 8, 1);
  ctx.fillStyle = '#000';
  ctx.fillRect(33, -2, 1, 2);
  ctx.fillStyle = '#3a3a3a';
  ctx.fillRect(12, 3, 12, 4);
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(6, 3);
  ctx.lineTo(6, 16);
  ctx.quadraticCurveTo(8, 20, 14, 18);
  ctx.lineTo(14, 3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 0.8;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(6, 6 + i*3);
    ctx.lineTo(14, 6 + i*3);
    ctx.stroke();
  }
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-2, 3);
  ctx.lineTo(-5, 13);
  ctx.lineTo(2, 13);
  ctx.lineTo(4, 3);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#888';
  ctx.fillRect(24, -7, 2, 3);
  ctx.fillRect(-1, -7, 2, 2);
  ctx.restore();
}
function drawRPG(x, y, cosA, sinA){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.atan2(sinA, cosA));
  ctx.fillStyle = '#2e3b2e';
  ctx.fillRect(0, -7, 24, 14);
  ctx.fillStyle = '#1b241b';
  ctx.fillRect(0, -7, 24, 3);
  ctx.fillStyle = '#4a5c4a';
  ctx.fillRect(0, 4, 24, 2);
  ctx.strokeStyle = '#1b241b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(24, 0);
  ctx.stroke();
  ctx.fillStyle = '#ff5722';
  ctx.beginPath();
  ctx.arc(24, 0, 9, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#bf360c';
  ctx.beginPath();
  ctx.arc(24, 0, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(24, 0, 3, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#1b241b';
  ctx.fillRect(-4, -7, 4, 14);
  ctx.fillStyle = '#0f150f';
  ctx.fillRect(-4, -7, 4, 3);
  ctx.fillStyle = '#1b241b';
  ctx.fillRect(-2, 5, 9, 13);
  ctx.fillStyle = '#3a4a3a';
  ctx.fillRect(-2, 5, 9, 2);
  ctx.strokeStyle = '#0f150f';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(3, 5, 3, 0, Math.PI);
  ctx.stroke();
  ctx.fillStyle = '#555';
  ctx.fillRect(10, -10, 3, 3);
  ctx.restore();
}
function drawPlayer(){
  const a = player.aimAngle;
  const cosA = Math.cos(a);
  const sinA = Math.sin(a);
  const perpX = Math.cos(a + Math.PI/2);
  const perpY = Math.sin(a + Math.PI/2);
  const w = WEAPONS[player.weapon];
  const recoilOffset = player.recoil;
  const sideOffset = -8;
  const gunX = player.x + perpX * sideOffset - cosA * recoilOffset;
  const gunY = player.y + perpY * sideOffset - sinA * recoilOffset;
  if(player.weapon === 'pistol') drawPistol(gunX, gunY, cosA, sinA);
  else if(player.weapon === 'shotgun') drawShotgun(gunX, gunY, cosA, sinA);
  else if(player.weapon === 'rifle') drawRifleGun(gunX, gunY, cosA, sinA);
  else if(player.weapon === 'rpg') drawRPG(gunX, gunY, cosA, sinA);
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(player.x-4, player.y-4, 3, player.x, player.y, player.r);
  grad.addColorStop(0, '#ffccbc');
  grad.addColorStop(1, '#f0a68c');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#b0705a';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  const lookX = cosA * 3;
  const lookY = sinA * 3;
  const eyeY = player.y + 2;
  const eyeR = 5.5;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x + 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.arc(player.x, player.y - 5, player.r - 1, Math.PI, 0);
  ctx.closePath();
  const helmGrad = ctx.createLinearGradient(player.x, player.y - player.r - 5, player.x, player.y - 5);
  helmGrad.addColorStop(0, '#81c784');
  helmGrad.addColorStop(1, '#2e7d32');
  ctx.fillStyle = helmGrad;
  ctx.fill();
  ctx.strokeStyle = '#1b5e20';
  ctx.lineWidth = 2;
  ctx.stroke();
  drawStar(player.x, player.y - 9, 5, '#d32f2f', '#8e0000');
  const skin = '#ffccbc';
  const skinEdge = '#b0705a';
  ctx.fillStyle = skin;
  ctx.strokeStyle = skinEdge;
  ctx.lineWidth = 2;
  if(player.weapon === 'rpg'){
    ctx.beginPath();
    ctx.arc(gunX + cosA * 6, gunY + sinA * 6, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(gunX + cosA * 16, gunY + sinA * 16, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  } else if(player.weapon === 'shotgun'){
    ctx.beginPath();
    ctx.arc(gunX + cosA * 12, gunY + sinA * 12, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(gunX + cosA * 2, gunY + sinA * 2, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  } else if(player.weapon === 'rifle'){
    ctx.beginPath();
    ctx.arc(gunX + cosA * 14, gunY + sinA * 14, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(gunX + cosA * 4, gunY + sinA * 4, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(gunX + cosA * 3, gunY + sinA * 3, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(gunX + cosA * 12, gunY + sinA * 12, 7, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
}
function drawStar(cx, cy, size, fill, stroke){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i * 2*Math.PI/5;
    const a2 = a1 + Math.PI/5;
    const x1 = cx + Math.cos(a1)*size;
    const y1 = cy + Math.sin(a1)*size;
    const x2 = cx + Math.cos(a2)*size*0.45;
    const y2 = cy + Math.sin(a2)*size*0.45;
    if(i===0) ctx.moveTo(x1, y1);
    else ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  if(stroke){
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}
function drawGore(){
  for(const g of gore){
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    if(g.kind === 'bone'){
      ctx.fillStyle = '#f5f0e0';
      ctx.strokeStyle = '#b8ad8c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, g.r*1.1, g.r*0.4, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = g.color;
      ctx.strokeStyle = BLOOD_CORE;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(0, 0, g.r, g.r*0.7, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}
function draw(){
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, Math.max(W,H));
  bgGrad.addColorStop(0, '#262626');
  bgGrad.addColorStop(1, '#0e0e0e');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);
  ctx.save();
  if(screenShake > 0.2){
    ctx.translate(rand(-screenShake, screenShake), rand(-screenShake, screenShake));
  }
  for(const s of bloodStains){
    for(const d of s.drops){
      ctx.beginPath();
      ctx.arc(s.x + d.x, s.y + d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = s.big ? BLOOD_DARK : BLOOD_BRIGHT;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.big ? 12 : 5, 0, Math.PI*2);
    ctx.fillStyle = BLOOD_CORE;
    ctx.fill();
  }
  drawGore();
  for(const c of corpses) drawCorpse(c);
  for(const vc of vampireCorpses) drawVampireCorpse(vc);
  for(const p of pickups){
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = '#66bb6a';
    ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='bold 12px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('+HP', p.x, p.y);
  }
  for(const s of smoke){
    const a = s.life / s.maxLife;
    ctx.globalAlpha = a * 0.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = '#888';
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for(const z of zombies) drawZombie(z);
  for(const v of vampires) drawVampire(v);
  for(const b of bullets){
    if(b.rocket){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = '#333';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(b.x - b.vx*0.8, b.y - b.vy*0.8, 4, 0, Math.PI*2);
      const g = ctx.createRadialGradient(b.x - b.vx*0.8, b.y - b.vy*0.8, 0, b.x - b.vx*0.8, b.y - b.vy*0.8, 6);
      g.addColorStop(0, '#fff59d');
      g.addColorStop(1, 'rgba(255,152,0,0)');
      ctx.fillStyle = g;
      ctx.fill();
    } else {
      ctx.strokeStyle = b.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx*0.6, b.y - b.vy*0.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = '#fff';
      ctx.fill();
    }
  }
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/15);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
    ctx.globalAlpha = 1;
  }
  for(const c of casings){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(-3, -1.5, 6, 3);
    ctx.fillStyle = '#f5d76e';
    ctx.fillRect(-3, -1.5, 6, 1);
    ctx.restore();
  }
  for(const s of shockwaves){
    const t = 1 - s.life/20;
    ctx.globalAlpha = Math.max(0, 1 - t) * 0.6;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for(const e of explosions){
    const t = 1 - e.life/30;
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    g.addColorStop(0, '#fff59d');
    g.addColorStop(0.4, '#ff9800');
    g.addColorStop(0.7, '#e53935');
    g.addColorStop(1, 'rgba(255,87,34,0)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  drawPlayer();
  ctx.restore();
}
function loop(){
  update();
  draw();
  updateHUD();
  requestAnimationFrame(loop);
}
updateHUD();
loop();
</script>
