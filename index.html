<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Angry Soviet</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#1a1a1a;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
canvas{display:block;}
#menu{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow-y:auto;padding:20px 10px;transition:opacity 0.5s;}
#menu.hidden{opacity:0;pointer-events:none;}
#menuCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
#menuContent{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px;max-width:520px;width:100%;}
#menuTitle{font-family:'Arial Black',Arial,sans-serif;font-size:clamp(36px,8vw,90px);font-weight:900;letter-spacing:6px;color:#c10000;text-shadow:0 0 20px #ff0000,0 0 40px #8b0000,0 0 80px #500000,4px 4px 0 #000,-2px -2px 0 #3a0000;margin:0;animation:titlePulse 2.5s ease-in-out infinite;user-select:none;}
@keyframes titlePulse{0%,100%{text-shadow:0 0 20px #ff0000,0 0 40px #8b0000,0 0 80px #500000,4px 4px 0 #000,-2px -2px 0 #3a0000;}50%{text-shadow:0 0 30px #ff2222,0 0 60px #b00000,0 0 100px #700000,4px 4px 0 #000,-2px -2px 0 #3a0000;}}
#playBtn{font-family:'Arial Black',Arial,sans-serif;font-size:clamp(18px,2.6vw,28px);font-weight:900;letter-spacing:4px;padding:16px 55px;color:#fff;background:#8b0000;border:3px solid #ff2a2a;border-radius:10px;cursor:pointer;text-shadow:2px 2px 0 #000;box-shadow:0 0 20px #ff0000,inset 0 0 20px rgba(0,0,0,0.5);transition:transform 0.15s,background 0.15s,box-shadow 0.15s;}
#playBtn:hover{background:#c10000;transform:scale(1.06);box-shadow:0 0 35px #ff2222,inset 0 0 25px rgba(0,0,0,0.6);}
#playBtn:active{transform:scale(0.97);}
#menuStats{position:relative;z-index:2;color:#eee;font-family:Arial,sans-serif;font-size:clamp(13px,1.5vw,17px);text-shadow:1px 1px 3px #000,0 0 10px #500;text-align:center;line-height:1.55;user-select:none;}
#menuStats b{color:#ff5252;font-size:1.15em;}


#settingsPanel,#progressPanel{position:relative;z-index:2;background:rgba(20,0,0,0.78);border:2px solid #5a0000;border-radius:10px;padding:12px 18px;color:#eee;font-family:Arial,sans-serif;font-size:13px;text-shadow:1px 1px 2px #000;width:100%;box-sizing:border-box;text-align:left;box-shadow:0 0 15px rgba(180,0,0,0.35);}
.sTitle{font-family:'Arial Black',Arial,sans-serif;font-size:15px;letter-spacing:3px;color:#ff3a3a;text-align:center;margin-bottom:10px;text-shadow:0 0 8px #ff0000,2px 2px 0 #000;}
.sRow{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;user-select:none;}
.sRow input[type="checkbox"]{width:16px;height:16px;accent-color:#c10000;cursor:pointer;flex-shrink:0;}
.sRow input[type="range"]{flex:1;accent-color:#c10000;cursor:pointer;}
.sRow input[type="range"]:disabled{opacity:0.35;cursor:not-allowed;}
.sRow b{color:#ff5252;min-width:38px;text-align:right;}
.sSection{margin-top:12px;padding-top:8px;border-top:1px solid #3a0000;}
#enemyWarn{display:none;color:#ff4444;font-size:12px;text-align:center;margin-top:6px;font-weight:bold;}
.pRow{display:flex;gap:6px;margin-bottom:6px;}
#progressPanel button{flex:1;font-family:'Arial Black',Arial,sans-serif;font-size:12px;letter-spacing:1px;padding:8px 10px;color:#fff;background:#8b0000;border:2px solid #ff2a2a;border-radius:6px;cursor:pointer;text-shadow:1px 1px 0 #000;transition:transform 0.12s,background 0.12s;}
#progressPanel button:hover:not(:disabled){background:#c10000;transform:scale(1.03);}
#progressPanel button:active:not(:disabled){transform:scale(0.96);}
#progressPanel button:disabled{opacity:0.35;cursor:not-allowed;}
#codeOut{min-height:22px;padding:6px 8px;background:#0a0a0a;color:#7fff7f;border:2px solid #004400;border-radius:6px;font-family:monospace;font-size:11px;word-break:break-all;user-select:all;margin-bottom:6px;display:none;}
#codeOut.show{display:block;}
#codeIn{flex:1;padding:7px 9px;background:#0a0a0a;color:#fff;border:2px solid #5a0000;border-radius:6px;font-size:11px;font-family:monospace;}
#codeIn::placeholder{color:#666;}
#codeMsg{font-size:12px;text-align:center;font-weight:bold;min-height:16px;margin-top:4px;}
#codeMsg.ok{color:#5fff5f;}
#codeMsg.err{color:#ff4444;}


.shopRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:rgba(0,0,0,0.4);border-radius:6px;border:1px solid #3a0000;margin-top:4px;}
.shopInfo{display:flex;flex-direction:column;gap:2px;font-size:12px;}
.shopInfo b{color:#ffcc00;font-size:13px;}
#c4Status{color:#888;font-size:11px;}
#c4Status.owned{color:#5fff5f;font-weight:bold;}
#buyC4{font-family:'Arial Black',Arial,sans-serif;font-size:11px;letter-spacing:1px;padding:7px 10px;color:#fff;background:#8b0000;border:2px solid #ff2a2a;border-radius:6px;cursor:pointer;text-shadow:1px 1px 0 #000;white-space:nowrap;transition:transform 0.12s,background 0.12s;flex:0 0 auto;}
#buyC4:hover:not(:disabled){background:#c10000;transform:scale(1.04);}
#buyC4:active:not(:disabled){transform:scale(0.96);}
#buyC4:disabled{opacity:0.35;cursor:not-allowed;}


#hud{position:fixed;top:10px;left:10px;color:#fff;font-size:16px;text-shadow:1px 1px 2px #000;pointer-events:none;line-height:1.35;z-index:6;}
#hud span{color:#ff5252;font-weight:bold;}
#hud .vamp{color:#cfd8dc;}
#hud .rainbow{color:#e040fb;}
#hud .general{color:#ffffff;}
#c4Indicator{position:fixed;top:10px;right:90px;color:#ffcc00;font-size:14px;font-weight:bold;font-family:Arial Black,Arial,sans-serif;text-shadow:0 0 10px #ff6600,2px 2px 0 #000;pointer-events:none;z-index:11;display:none;letter-spacing:2px;}
#c4Indicator.show{display:block;}
#weaponBar{position:fixed;bottom:15px;left:15px;color:#eee;font-size:13px;text-shadow:1px 1px 2px #000;pointer-events:none;line-height:1.5;background:rgba(0,0,0,0.55);padding:6px 10px;border-radius:6px;z-index:6;}
#weaponBar .w{padding:1px 0;opacity:0.45;}
#weaponBar .w.active{opacity:1;color:#ffd54f;font-weight:bold;}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:30px;text-align:center;text-shadow:2px 2px 4px #000;pointer-events:none;display:none;z-index:7;}
#fireBtn{position:fixed;bottom:25px;right:25px;width:100px;height:100px;border-radius:50%;background:#c62828;color:#fff;font-size:16px;font-weight:bold;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:10;}
#fireBtn:active{background:#8e0000;}
#joyBase{position:fixed;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.2);touch-action:none;z-index:10;}
#joyKnob{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);transform:translate(-50%,-50%);pointer-events:none;}
#weaponBtns{position:fixed;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:10;}
#weaponBtns button{width:64px;height:52px;border-radius:8px;background:rgba(30,30,30,0.85);color:#fff;font-size:11px;font-weight:bold;border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;text-align:center;padding:0;line-height:1.05;cursor:pointer;}
#weaponBtns button.active{background:#ff9800;color:#000;border-color:#fff;}
#weaponBtns button:active{transform:scale(0.95);}
#damageFlash{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle,transparent 30%,rgba(200,0,0,0.7) 100%);opacity:0;transition:opacity 0.15s;}
#killScreen{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle,transparent 25%,rgba(255,0,0,0.85) 100%);opacity:0;transition:opacity 0.35s;}
#killMsg{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(0.5);color:#ff2a2a;font-size:56px;font-weight:900;text-align:center;text-shadow:0 0 20px #ff0000,0 0 40px #8b0000,4px 4px 0 #000;pointer-events:none;z-index:8;opacity:0;letter-spacing:3px;font-family:Arial Black,Arial,sans-serif;transition:opacity 0.25s,transform 0.3s;}
#killMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
#killMsg.small{font-size:38px;color:#ff9800;text-shadow:0 0 15px #ff5722,3px 3px 0 #000;}
#killMsg.big{font-size:72px;color:#ff0000;text-shadow:0 0 25px #ff0000,0 0 50px #8b0000,5px 5px 0 #000;}
#rageScreen{position:fixed;inset:0;pointer-events:none;z-index:9;background:#d10000;opacity:0;transition:opacity 0.3s;}
#rageText{position:fixed;top:50%;left:50%;color:#fff;font-size:130px;font-weight:900;font-family:Arial Black,Arial,sans-serif;text-shadow:0 0 30px #000,0 0 60px #000,6px 6px 0 #000;pointer-events:none;z-index:10;opacity:0;letter-spacing:8px;transition:opacity 0.15s;transform:translate(-50%,-50%) scale(1.3);}
#rageText.show{opacity:1;animation:rageShake 0.08s infinite;}
@keyframes rageShake{0%{transform:translate(-50%,-50%) scale(1.3) rotate(-3deg) translate(-8px,-6px);}25%{transform:translate(-50%,-50%) scale(1.35) rotate(3deg) translate(9px,4px);}50%{transform:translate(-50%,-50%) scale(1.28) rotate(-2deg) translate(-6px,8px);}75%{transform:translate(-50%,-50%) scale(1.33) rotate(2deg) translate(7px,-9px);}100%{transform:translate(-50%,-50%) scale(1.3) rotate(-3deg) translate(-8px,-6px);}}
#rageSides{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:linear-gradient(to right,rgba(200,0,0,0.85) 0%,rgba(200,0,0,0.6) 8%,transparent 22%,transparent 78%,rgba(200,0,0,0.6) 92%,rgba(200,0,0,0.85) 100%);transition:opacity 0.5s;}
#rageTimer{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:bold;font-family:Arial Black,Arial,sans-serif;text-shadow:0 0 10px #ff0000,2px 2px 0 #000;pointer-events:none;z-index:10;opacity:0;letter-spacing:2px;}
</style>
</head>
<body>
<div id="menu">
  <canvas id="menuCanvas"></canvas>
  <div id="menuContent">
    <h1 id="menuTitle">ANGRY SOVIET</h1>
    <button id="playBtn">ИГРАТЬ</button>
    <div id="menuStats"></div>


    <div id="settingsPanel">
      <div class="sTitle">НАСТРОЙКИ</div>
      <label class="sRow"><input type="checkbox" id="optBlood" checked><span>Кровь и расчленёнка</span></label>
      <label class="sRow"><input type="checkbox" id="optMenuSplats" checked><span>Брызги в меню</span></label>
      <label class="sRow"><input type="checkbox" id="optBloodInfinite"><span>Кровь не исчезает</span></label>
      <label class="sRow"><span>Время жизни крови</span><input type="range" id="optBloodLife" min="0.2" max="3" step="0.1" value="1"><b id="bloodLifeVal">1.0x</b></label>


      <div class="sSection">
        <div class="sTitle" style="font-size:13px;margin-bottom:6px;">ВРАГИ (мин. 2)</div>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="zombie" checked><span>Фурри</span></label>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="vampire" checked><span>Правачки</span></label>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="rainbow" checked><span>Геи</span></label>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="general" checked><span>Генералы СС Правачков</span></label>
        <div id="enemyWarn">Нужно минимум 2 типа врагов!</div>
      </div>
    </div>


    <div id="progressPanel">
      <div class="sTitle">ПРОГРЕСС</div>
      <div class="pRow">
        <button id="genCode">СОЗДАТЬ КОД</button>
        <button id="copyCode">СКОПИРОВАТЬ</button>
      </div>
      <div id="codeOut"></div>
      <div class="pRow">
        <input type="text" id="codeIn" placeholder="Вставь код сюда...">
        <button id="applyCode">ПРИМЕНИТЬ</button>
      </div>
      <div id="codeMsg"></div>


      <div class="sSection">
        <div class="sTitle" style="font-size:13px;margin-bottom:6px;">МАГАЗИН</div>
        <div class="shopRow">
          <div class="shopInfo">
            <b>💣 Детонатор C4</b>
            <span id="c4Status">Убийств: 0 / 500</span>
          </div>
          <button id="buyC4">500 убийств</button>
        </div>
      </div>
    </div>
  </div>
</div>


<canvas id="c"></canvas>
<div id="rageSides"></div>
<div id="killScreen"></div>
<div id="damageFlash"></div>
<div id="killMsg"></div>
<div id="rageScreen"></div>
<div id="rageText">RAMPAGE</div>
<div id="rageTimer">RAMPAGE: 60</div>
<div id="hud">
  Фурри: <span id="score">0</span><br>
  Правачков: <span class="vamp" id="vampScore">0</span><br>
  Геев: <span class="rainbow" id="rainbowScore">0</span><br>
  Генералов: <span class="general" id="generalScore">0</span><br>
  Оружие: <span id="weapon">Пистолет</span><br>
  HP: <span id="hp">100</span>
</div>
<div id="c4Indicator">💣 C4</div>
<div id="weaponBar">
  <div class="w active" id="w-pistol">1 · Пистолет</div>
  <div class="w" id="w-shotgun">2 · Дробовик</div>
  <div class="w" id="w-rifle">3 · Автомат</div>
  <div class="w" id="w-rpg">4 · РПГ</div>
</div>
<div id="msg"></div>
<button id="fireBtn">ОГОНЬ</button>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="weaponBtns">
  <button data-w="pistol" class="active">1<br>Пистолет</button>
  <button data-w="shotgun">2<br>Дробовик</button>
  <button data-w="rifle">3<br>Автомат</button>
  <button data-w="rpg">4<br>РПГ</button>
</div>


<script>
// ================== МЕНЮ ==================
const menuEl      = document.getElementById('menu');
const menuCanvas  = document.getElementById('menuCanvas');
const menuCtx     = menuCanvas.getContext('2d');
const playBtn     = document.getElementById('playBtn');
const menuStatsEl = document.getElementById('menuStats');


let sessionScore   = 0;
let sessionVamp    = 0;
let sessionRainbow = 0;
let sessionGeneral = 0;
let sessionKills   = 0;
let sessionBest    = 0;
let gamesPlayed    = 0;


let menuSplats = [];
let menuSplatTimer = 0;


// ================== НАСТРОЙКИ ==================
const settings = {
  blood: true,
  menuSplats: true,
  infiniteBlood: false,
  bloodLife: 1.0,
  enemies: { zombie: true, vampire: true, rainbow: true, general: true }
};


// Постоянный прогресс
let c4Owned = false;                 // детонатор C4 куплен
let purchasedMaxHpBonus = 0;         // бонус макс. HP, купленный в магазине
let pendingC4Pending = false;        // купленный, но ещё не использованный заряд


const optBlood         = document.getElementById('optBlood');
const optMenuSplats    = document.getElementById('optMenuSplats');
const optBloodInfinite = document.getElementById('optBloodInfinite');
const optBloodLife     = document.getElementById('optBloodLife');
const bloodLifeVal     = document.getElementById('bloodLifeVal');
const enemyOpts        = document.querySelectorAll('.enemyOpt');
const enemyWarn        = document.getElementById('enemyWarn');


function applySettingsToUI(){
  optBlood.checked = settings.blood;
  optMenuSplats.checked = settings.menuSplats;
  optBloodInfinite.checked = settings.infiniteBlood;
  optBloodLife.value = settings.bloodLife;
  bloodLifeVal.textContent = settings.bloodLife.toFixed(1) + 'x';
  optBloodLife.disabled = settings.infiniteBlood;
  enemyOpts.forEach(o => o.checked = settings.enemies[o.dataset.e]);
  validateEnemies();
}
function validateEnemies(){
  const count = Object.values(settings.enemies).filter(Boolean).length;
  enemyWarn.style.display = count < 2 ? 'block' : 'none';
  return count >= 2;
}
optBlood.addEventListener('change', () => settings.blood = optBlood.checked);
optMenuSplats.addEventListener('change', () => settings.menuSplats = optMenuSplats.checked);
optBloodInfinite.addEventListener('change', () => {
  settings.infiniteBlood = optBloodInfinite.checked;
  optBloodLife.disabled = settings.infiniteBlood;
});
optBloodLife.addEventListener('input', () => {
  settings.bloodLife = parseFloat(optBloodLife.value);
  bloodLifeVal.textContent = settings.bloodLife.toFixed(1) + 'x';
});
enemyOpts.forEach(o => {
  o.addEventListener('change', () => {
    settings.enemies[o.dataset.e] = o.checked;
    const count = Object.values(settings.enemies).filter(Boolean).length;
    if(count < 2){
      o.checked = true;
      settings.enemies[o.dataset.e] = true;
      enemyWarn.style.display = 'block';
      setTimeout(() => validateEnemies(), 1500);
    } else {
      validateEnemies();
    }
  });
});
applySettingsToUI();


function bloodEnabled(){ return settings.blood; }


// ================== МЕНЮ: ФОН ==================
function menuResize(){
  menuCanvas.width  = innerWidth;
  menuCanvas.height = innerHeight;
}
addEventListener('resize', menuResize);
menuResize();


function spawnMenuSplat(){
  if(!settings.menuSplats) return;
  const x = Math.random() * menuCanvas.width;
  const y = Math.random() * menuCanvas.height;
  const size = 20 + Math.random() * 60;
  const drops = [];
  const n = 8 + Math.floor(Math.random()*10);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const d = Math.random()*size;
    drops.push({ x: Math.cos(a)*d, y: Math.sin(a)*d, r: 2 + Math.random()*size*0.35 });
  }
  const decay = settings.infiniteBlood ? 0 : (0.0006 + Math.random()*0.0012) / settings.bloodLife;
  menuSplats.push({ x, y, drops, life: 1.0, decay });
  if(menuSplats.length > 60) menuSplats.shift();
}


function drawMenuBackground(){
  menuCtx.clearRect(0,0,menuCanvas.width,menuCanvas.height);
  menuCtx.fillStyle = '#000';
  menuCtx.fillRect(0,0,menuCanvas.width,menuCanvas.height);


  const g = menuCtx.createRadialGradient(
    menuCanvas.width/2, menuCanvas.height/2, 80,
    menuCanvas.width/2, menuCanvas.height/2, Math.max(menuCanvas.width, menuCanvas.height)
  );
  g.addColorStop(0, 'rgba(60,0,0,0.35)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  menuCtx.fillStyle = g;
  menuCtx.fillRect(0,0,menuCanvas.width,menuCanvas.height);


  if(!settings.menuSplats) return;


  for(const s of menuSplats){
    for(const d of s.drops){
      menuCtx.beginPath();
      menuCtx.arc(s.x + d.x, s.y + d.y, d.r, 0, Math.PI*2);
      menuCtx.fillStyle = `rgba(180, 0, 0, ${0.55 * s.life})`;
      menuCtx.fill();
    }
    menuCtx.beginPath();
    menuCtx.arc(s.x, s.y, 6, 0, Math.PI*2);
    menuCtx.fillStyle = `rgba(120, 0, 0, ${0.75 * s.life})`;
    menuCtx.fill();
  }
}


function menuLoop(){
  if(!menuEl.classList.contains('hidden')){
    menuSplatTimer++;
    if(menuSplatTimer > 35 + Math.random()*40){
      menuSplatTimer = 0;
      spawnMenuSplat();
    }
    for(let i=menuSplats.length-1;i>=0;i--){
      if(menuSplats[i].decay > 0){
        menuSplats[i].life -= menuSplats[i].decay;
        if(menuSplats[i].life <= 0) menuSplats.splice(i,1);
      }
    }
    drawMenuBackground();
  }
  requestAnimationFrame(menuLoop);
}
menuLoop();


// ================== МАГАЗИН ==================
const buyC4Btn      = document.getElementById('buyC4');
const c4StatusEl    = document.getElementById('c4Status');
const c4IndicatorEl = document.getElementById('c4Indicator');
const C4_PRICE = 500;


function updateShopUI(){
  if(c4Owned){
    c4StatusEl.textContent = '✓ Куплено';
    c4StatusEl.classList.add('owned');
    buyC4Btn.disabled = true;
    buyC4Btn.textContent = 'КУПЛЕНО';
  } else {
    const have = sessionKills;
    c4StatusEl.textContent = `Убийств: ${have} / ${C4_PRICE}`;
    c4StatusEl.classList.remove('owned');
    buyC4Btn.disabled = have < C4_PRICE;
    buyC4Btn.textContent = have < C4_PRICE ? '500 убийств' : 'КУПИТЬ';
  }
}
buyC4Btn.addEventListener('click', () => {
  if(c4Owned) return;
  if(sessionKills < C4_PRICE) return;
  sessionKills -= C4_PRICE;
  c4Owned = true;
  updateMenuStats();
  updateShopUI();
  setCodeMsg('Детонатор C4 куплен!', true);
});


function updateMenuStats(){
  if(gamesPlayed === 0 && !c4Owned){
    menuStatsEl.innerHTML = '';
  } else {
    menuStatsEl.innerHTML =
      `Всего убийств: <b>${sessionKills}</b><br>` +
      `Фурри: ${sessionScore} · Правачки: ${sessionVamp} · ` +
      `Геи: ${sessionRainbow} · Генералы СС: ${sessionGeneral}<br>` +
      `Лучший заход: <b>${sessionBest}</b><br>` +
      `<span style="opacity:0.55;font-size:0.85em;">Заходов: ${gamesPlayed}</span>`;
  }
  updateShopUI();
}


// ================== СИСТЕМА КОДОВ ==================
const genCodeBtn   = document.getElementById('genCode');
const copyCodeBtn  = document.getElementById('copyCode');
const applyCodeBtn = document.getElementById('applyCode');
const codeOutEl    = document.getElementById('codeOut');

function checksum(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36);
}
function makeProgressCode(){
  const data = {
    v: 1,
    s: sessionScore,
    vp: sessionVamp,
    rb: sessionRainbow,
    gn: sessionGeneral,
    k: sessionKills,
    b: sessionBest,
    g: gamesPlayed,
    c4: c4Owned ? 1 : 0,
    hb: purchasedMaxHpBonus
  };
  const json = JSON.stringify(data);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64 + '.' + checksum(b64);
}
function parseProgressCode(code){
  code = (code || '').trim();
  if(!code) return null;
  const parts = code.split('.');
  if(parts.length !== 2) return null;
  if(checksum(parts[0]) !== parts[1]) return null;
  try {
    const json = decodeURIComponent(escape(atob(parts[0])));
    const data = JSON.parse(json);
    if(typeof data !== 'object' || data === null) return null;
    return data;
  } catch(e){ return null; }
}
function setCodeMsg(text, ok){
  codeMsgEl.textContent = text;
  codeMsgEl.className = ok ? 'ok' : 'err';
}
genCodeBtn.addEventListener('click', () => {
  const code = makeProgressCode();
  codeOutEl.textContent = code;
  codeOutEl.classList.add('show');
  setCodeMsg('Код создан. Скопируй его.', true);
});
copyCodeBtn.addEventListener('click', () => {
  const code = codeOutEl.textContent;
  if(!code){ setCodeMsg('Сначала создай код.', false); return; }
  const ta = document.createElement('textarea');
  ta.value = code;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    setCodeMsg('Код скопирован!', true);
  } catch(e){
    setCodeMsg('Выдели вручную.', false);
  }
  document.body.removeChild(ta);
});
applyCodeBtn.addEventListener('click', () => {
  const data = parseProgressCode(codeInEl.value);
  if(!data){ setCodeMsg('Неверный код.', false); return; }
  sessionScore   += data.s  | 0;
  sessionVamp    += data.vp | 0;
  sessionRainbow += data.rb | 0;
  sessionGeneral += data.gn | 0;
  sessionKills   += data.k  | 0;
  if((data.b | 0) > sessionBest) sessionBest = data.b | 0;
  gamesPlayed    += data.g  | 0;
  if(data.c4) c4Owned = true;
  if((data.hb | 0) > purchasedMaxHpBonus) purchasedMaxHpBonus = data.hb | 0;
  updateMenuStats();
  updateShopUI();
  setCodeMsg('Прогресс применён!', true);
  codeInEl.value = '';
});
codeOutEl.addEventListener('click', () => {
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(codeOutEl);
  sel.removeAllRanges();
  sel.addRange(range);
});

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joy = { active:false, dx:0, dy:0, id:null };
const JOY_MAX = 40;
function joyStart(x, y, id){ joy.active = true; joy.id = id; joyMove(x, y); }
function joyMove(x, y){
  if(!joy.active) return;
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = x - cx, dy = y - cy;
  const len = Math.hypot(dx, dy);
  if(len > JOY_MAX){ dx = dx/len*JOY_MAX; dy = dy/len*JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyEnd(){
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyKnob.style.transform = 'translate(-50%,-50%)';
}
joyBase.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyStart(t.clientX, t.clientY, t.identifier); }, {passive:false});
joyBase.addEventListener('touchmove', e => { e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyMove(t.clientX, t.clientY); break; } } }, {passive:false});
joyBase.addEventListener('touchend', e => { e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyEnd(); break; } } }, {passive:false});
joyBase.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); }, {passive:false});
joyBase.addEventListener('mousedown', e => { e.preventDefault(); joyStart(e.clientX, e.clientY, 'mouse'); });
addEventListener('mousemove', e => { if(joy.id === 'mouse') joyMove(e.clientX, e.clientY); });
addEventListener('mouseup',   e => { if(joy.id === 'mouse') joyEnd(); });

function drawHandsAndGun(cx, cy, r, angle, weaponName, opts){
  opts = opts || {};
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);


  const handR = 6;
  const skin = '#ffccbc';
  const skinEdge = '#a15a44';


  const sideOffset = -r * 0.5 - 4;
  const forwardOffset = r * 0.9;
  const anchorX = cx + perpX * sideOffset + cosA * forwardOffset;
  const anchorY = cy + perpY * sideOffset + sinA * forwardOffset;


  const gunBackShift = -6;
  const gunX = anchorX + cosA * gunBackShift;
  const gunY = anchorY + sinA * gunBackShift;


  if(opts.rampageActive){
    drawChainsawAt(gunX, gunY, cosA, sinA, true, opts.stalin);
  } else if(weaponName === 'pistol'){
    drawPistolAt(gunX, gunY, cosA, sinA);
  } else if(weaponName === 'shotgun'){
    drawShotgunAt(gunX, gunY, cosA, sinA);
  } else if(weaponName === 'rifle'){
    drawRifleAt(gunX, gunY, cosA, sinA);
  } else if(weaponName === 'rpg'){
    drawRPGAt(gunX, gunY, cosA, sinA, rpgLoaded, rpgReloadTimer, WEAPONS.rpg.reloadTime);
  }


  const backGripX = anchorX + cosA * 2;
  const backGripY = anchorY + sinA * 2;


  const frontGripDist = (weaponName === 'rpg') ? 18 :
                        (weaponName === 'shotgun') ? 14 :
                        (weaponName === 'rifle') ? 16 : 11;
  const frontGripX = anchorX + cosA * frontGripDist;
  const frontGripY = anchorY + sinA * frontGripDist;


  ctx.fillStyle = skin;
  ctx.strokeStyle = skinEdge;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(backGripX, backGripY, handR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(frontGripX, frontGripY, handR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
}

function drawRPGAt(x, y, cosA, sinA, loaded, reloadTimer, reloadTime){
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(sinA, cosA));
  const pipeH = 6, pipeY = -pipeH/2;
  ctx.fillStyle = '#4e342e'; ctx.fillRect(-8, pipeY, 26, pipeH);
  ctx.fillStyle = '#8d5524'; ctx.fillRect(18, pipeY, 22, pipeH);
  ctx.fillStyle = '#a86d2e'; ctx.fillRect(18, pipeY, 22, 1.5);
  ctx.fillStyle = '#5d3a18'; ctx.fillRect(18, pipeY + pipeH - 1.5, 22, 1.5);
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(40, pipeY - 1, 14, pipeH + 2);
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(16, pipeY - 1, 2, pipeH + 2); ctx.fillRect(40, pipeY - 1, 2, pipeH + 2);
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.moveTo(-8, pipeY); ctx.lineTo(-16, -6); ctx.lineTo(-16, 6); ctx.lineTo(-8, pipeY + pipeH); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(-15, 0, 1.5, 5.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0f0f0f'; ctx.fillRect(24, -10, 3, 6); ctx.fillRect(22, -11, 8, 2); ctx.fillRect(20, -9, 2, 2);
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.moveTo(22, 3); ctx.lineTo(20, 16); ctx.lineTo(27, 16); ctx.lineTo(29, 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#444'; ctx.fillRect(22, 3, 7, 1.5);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 0.7;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(22, 6+i*3); ctx.lineTo(28, 6+i*3); ctx.stroke(); }
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(29, 3, 4, 0, Math.PI); ctx.stroke();
  if(loaded){
    ctx.fillStyle = '#2e7d32'; ctx.fillRect(54, -4, 12, 8);
    ctx.fillStyle = '#43a047'; ctx.fillRect(54, -4, 12, 1.5);
    ctx.fillStyle = '#1b5e20'; ctx.fillRect(54, 2.5, 12, 1.5);
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.moveTo(66, -6); ctx.lineTo(80, -6); ctx.lineTo(94, -2); ctx.lineTo(94, 2); ctx.lineTo(80, 6); ctx.lineTo(66, 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#43a047'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(66, -6); ctx.lineTo(80, -6); ctx.lineTo(94, -2); ctx.stroke();
    ctx.strokeStyle = '#1b5e20';
    ctx.beginPath(); ctx.moveTo(66, -6); ctx.lineTo(66, 6); ctx.stroke();
    ctx.fillStyle = '#43a047';
    ctx.beginPath(); ctx.arc(94, 0, 2.5, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.ellipse(54, 0, 2, 4, 0, 0, Math.PI*2); ctx.fill();
    if(reloadTimer > 0){
      const progress = 1 - reloadTimer / reloadTime;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(18, -20, 24, 4);
      ctx.fillStyle = '#66bb6a'; ctx.fillRect(19, -19, 22 * progress, 2);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.5; ctx.strokeRect(18, -20, 24, 4);
    }
  }
  ctx.restore();
}


function drawChainsawAt(x, y, cosA, sinA, active, stalin){
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(sinA, cosA));
  ctx.fillStyle = stalin ? '#1565c0' : '#c62828'; ctx.fillRect(-8, -10, 20, 20);
  ctx.fillStyle = stalin ? '#0d47a1' : '#8e0000'; ctx.fillRect(-8, -10, 20, 4);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-6, 12); ctx.stroke();
  const barLen = stalin ? 50 : 34;
  ctx.fillStyle = '#424242'; ctx.fillRect(12, -4, barLen, 8);
  ctx.fillStyle = '#616161'; ctx.fillRect(12, -4, barLen, 2);
  const t = active ? (Date.now() / 30) % 2 : 0;
  ctx.fillStyle = '#bdbdbd';
  const teeth = stalin ? 15 : 10;
  for(let i=0;i<teeth;i++){
    const px = 12 + i*3.4 + (active ? (t*1.7) : 0);
    if(px > 12 + barLen) continue;
    ctx.beginPath(); ctx.moveTo(px, -4); ctx.lineTo(px + 2, -7); ctx.lineTo(px + 3.4, -4); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

  });
}

  const hp = 2 + Math.floor(score/8);
  for(let c=0;c<cols;c++){

      const offset = (i - (count-1)/2) * gap;
      if(side===0){ x = W/2 + offset; y = -40 - c*colGap; }
      else if(side===1){ x = W+40 + c*colGap; y = H/2 + offset; }
      else if(side===2){ x = W/2 + offset; y = H+40 + c*colGap; }
      else { x = -40 - c*colGap; y = H/2 + offset; }
      const hue = (c*count + i) * (360/(cols*count));
      rainbowZombies.push({
        x, y, r: 14,
        speed: rand(0.9, 1.2) + score*0.004,
        hp, maxHp: hp, hue,
        bodyColor: `hsl(${hue},90%,65%)`,
        earColor:  `hsl(${hue},90%,55%)`,
        rainbowPhase: Math.random()*Math.PI*2
      });
    }
  }
}

  bloodStains.push({ x, y, drops, age: 0, life: settings.infiniteBlood ? Infinity : 60*30*settings.bloodLife });

  for(let i=zombies.length-1;i>=0;i--){

function shoot(){
  const w = WEAPONS[player.weapon];
  const angle = player.aimAngle;


  if(w.explosive){
    if(!rpgLoaded) return;
    rpgLoaded = false;
    rpgReloadTimer = w.reloadTime;
    const muzzleDist = 60;
    bullets.push({
      x: player.x + Math.cos(angle)*muzzleDist,
      y: player.y + Math.sin(angle)*muzzleDist,
      vx: Math.cos(angle)*w.speed, vy: Math.sin(angle)*w.speed,
      r: 5, dmg: w.dmg, color: w.color, life: 120,
      explosive: true, blastR: 130, rocket: true
    });
    for(let i=0;i<10;i++){
      const a = angle + rand(-0.5,0.5);
      smoke.push({
        x: player.x + Math.cos(angle)*50, y: player.y + Math.sin(angle)*50,
        vx: Math.cos(a)*rand(2,5), vy: Math.sin(a)*rand(2,5),
        r: rand(6,12), life: 45, maxLife: 45
      });
    }
  } else {
    const offsetX = Math.cos(angle)*w.len;
    const offsetY = Math.sin(angle)*w.len;
    for(let i=0;i<w.pellets;i++){
      const a = angle + rand(-w.spread, w.spread);
      bullets.push({
        x: player.x + offsetX, y: player.y + offsetY,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        r: 2.5, dmg: w.dmg, color: w.color, life: 60
      });
    }
  }
  for(let i=0;i<5;i++){
    const a = angle + rand(-0.3,0.3);
    smoke.push({
      x: player.x + Math.cos(angle)*w.len, y: player.y + Math.sin(angle)*w.len,
      vx: Math.cos(a)*rand(1,3) + rand(-0.5,0.5), vy: Math.sin(a)*rand(1,3) + rand(-0.5,0.5),
      r: rand(5,10), life: 30, maxLife: 30
    });
  }
  for(let i=0;i<w.flash;i++){
    const a = angle + rand(-0.6,0.6);
    particles.push({
      x: player.x + Math.cos(angle)*w.len, y: player.y + Math.sin(angle)*w.len,
      vx: Math.cos(a)*rand(4,9), vy: Math.sin(a)*rand(4,9),
      life: 8, color: w.sound
    });
  }
  const perpA = angle + Math.PI/2;
  casings.push({
    x: player.x + Math.cos(angle)*6 + Math.cos(perpA)*8,
    y: player.y + Math.sin(angle)*6 + Math.sin(perpA)*8,
    vx: Math.cos(perpA)*rand(3,5) + rand(-1,1),
    vy: Math.sin(perpA)*rand(3,5) + rand(-1,1),
    rot: Math.random()*Math.PI*2, rotSpeed: rand(-0.3,0.3), life: 200
  });
  player.recoil = w.kick;
  if(screenShake < w.shake) screenShake = w.shake;
  currentShakeDecay = w.shakeDecay;
}


function findNearestTarget(){
  let best = null, bestD = Infinity;
  const all = [].concat(zombies, vampires, rainbowZombies, vampireGenerals);
  for(const z of all){
    const d = dist(z, player);
    if(d < bestD){ bestD = d; best = z; }
  }
  return best;
}

}


function damagePlayer(amount){

function specAttack(radius){
  for(let i=zombies.length-1;i>=0;i--){
    const z = zombies[i];
    if(dist(z, player) < radius + z.r){
      bloodExplosion(z.x, z.y); addCorpse(z); zombies.splice(i,1);
      score++; totalKills++;
      document.getElementById('score').textContent = score;
      registerKill();
    }
  }
  for(let i=vampires.length-1;i>=0;i--){
    const v = vampires[i];
    if(dist(v, player) < radius + v.r){
      bloodExplosion(v.x, v.y); addVampireCorpse(v); vampires.splice(i,1);
      vampScore++; totalKills++;
      document.getElementById('vampScore').textContent = vampScore;
      registerKill();
    }
  }
  for(let i=rainbowZombies.length-1;i>=0;i--){
    const z = rainbowZombies[i];
    if(dist(z, player) < radius + z.r){
      bloodExplosion(z.x, z.y); addRainbowCorpse(z); rainbowZombies.splice(i,1);
      rainbowScore++; totalKills++;
      document.getElementById('rainbowScore').textContent = rainbowScore;
      registerKill();
    }
  }
  for(let i=vampireGenerals.length-1;i>=0;i--){
    const v = vampireGenerals[i];
    if(dist(v, player) < radius + v.r){
      v.hp -= 4;
      bloodExplosion(v.x, v.y);
      if(v.hp <= 0){
        addGeneralCorpse(v); vampireGenerals.splice(i,1);
        generalScore++; totalKills++;
        document.getElementById('generalScore').textContent = generalScore;
        registerKill();
      }
    }
  }
}

function c4Detonate(){
  if(c4Detonated) return;

  // Огромная вспышка и тряска

  shockwaves.push({ x: player.x, y: player.y, r: 0, maxR: Math.max(W,H)*1.5, life: 40 });


  // Убить всех
  for(let i=zombies.length-1;i>=0;i--){
    const z = zombies[i];
    spawnGore(z.x, z.y, z);
    addCorpse(z);
    zombies.splice(i,1);

    registerKill();
  }
  for(let i=vampires.length-1;i>=0;i--){

    bloodExplosion(v.x, v.y);
    addVampireCorpse(v);
    vampires.splice(i,1);
    vampScore++; totalKills++;
    document.getElementById('vampScore').textContent = vampScore;
    registerKill();
  }
  for(let i=rainbowZombies.length-1;i>=0;i--){

    spawnGore(z.x, z.y, z);
    addRainbowCorpse(z);
    rainbowZombies.splice(i,1);
    rainbowScore++; totalKills++;
    document.getElementById('rainbowScore').textContent = rainbowScore;
    registerKill();
  }
  for(let i=vampireGenerals.length-1;i>=0;i--){
    const v = vampireGenerals[i];
    spawnGore(v.x, v.y, {hue:0});
    addBloodPool(v.x, v.y, 80);
    addGeneralCorpse(v);
    vampireGenerals.splice(i,1);
    generalScore++; totalKills++;
    document.getElementById('generalScore').textContent = generalScore;
    registerKill();
  }


  // Визуальная вспышка от центра
  for(let k=0;k<200;k++){
    const a = Math.random()*Math.PI*2;
    const s = rand(3, 18);
    particles.push({
      x: player.x, y: player.y,
      vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 40, color: `hsl(${rand(0,60)}, 100%, ${rand(50,90)}%)`
    });
  }
}


function update(){
  if(gameOver){
    if(c4Detonated && c4ExplosionTimer > 0){
      c4ExplosionTimer--;
    }
    return;
  }


  if(rpgReloadTimer > 0){
    rpgReloadTimer--;
    if(rpgReloadTimer <= 0){ rpgLoaded = true; }
  }


  if(rageIntroActive){
    rageIntroTimer--;
    if(rageIntroTimer <= 0){
      rageIntroActive = false;
      rampageActive = true;
      rampageStalin = rageIntroStalin;
      rampageTimer = RAGE_DURATION;
      rageScreen.style.opacity = 0;
      rageTextEl.classList.remove('show');
      rageSides.style.opacity = 1;
      rageTimerEl.style.opacity = 1;
      if(rampageStalin){
        rageSides.style.background = 'linear-gradient(to right, rgba(0,71,200,0.85) 0%, rgba(0,71,200,0.6) 8%, transparent 22%, transparent 78%, rgba(0,71,200,0.6) 92%, rgba(0,71,200,0.85) 100%)';
        rageTimerEl.style.textShadow = '0 0 10px #0047c8, 2px 2px 0 #000';
        rageTimerEl.textContent = 'РЕЖИМ БОГА СТАЛИНА: 60';
      } else {
        rageSides.style.background = 'linear-gradient(to right, rgba(200,0,0,0.85) 0%, rgba(200,0,0,0.6) 8%, transparent 22%, transparent 78%, rgba(200,0,0,0.6) 92%, rgba(200,0,0,0.85) 100%)';
        rageTimerEl.style.textShadow = '0 0 10px #ff0000, 2px 2px 0 #000';
        rageTimerEl.textContent = 'RAMPAGE: 60';
      }
    }
  } else if(rampageActive){
    rampageTimer--;
    const secs = Math.ceil(rampageTimer / 60);
    if(rampageStalin){
      rageTimerEl.textContent = 'РЕЖИМ БОГА СТАЛИНА: ' + secs;
    } else {
      rageTimerEl.textContent = 'RAMPAGE: ' + secs;
    }
    const radius = rampageStalin ? 100 : 60;
    specAttack(radius);
    if(rampageTimer <= 0){
      rampageActive = false;
      rampageStalin = false;
      rageSides.style.opacity = 0;
      rageTimerEl.style.opacity = 0;
      // МАКС HP РАСТЁТ, HP ВОССТАНАВЛИВАЕТСЯ НА ПОЛНУЮ
      player.maxHp += 100;
      player.hp = player.maxHp;
      document.getElementById('hp').textContent = player.hp;
      nextRageAt = totalKills + 100;
    }
  }


  const speedMult = rampageActive && rampageStalin ? 4 : 1;


  let dx=0, dy=0;
  if(keys['w']||keys['ц']||keys['arrowup'])    dy -= 1;
  if(keys['s']||keys['ы']||keys['arrowdown'])  dy += 1;
  if(keys['a']||keys['ф']||keys['arrowleft'])  dx -= 1;
  if(keys['d']||keys['в']||keys['arrowright']) dx += 1;
  dx += joy.dx; dy += joy.dy;
  const dl = Math.hypot(dx,dy);
  if(dl > 0.05){
    const k = Math.min(dl, 1);
    const spd = player.speed * speedMult;
    player.x += dx/dl*spd*k;
    player.y += dy/dl*spd*k;
  }
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));


  const target = findNearestTarget();
  let want = target
    ? Math.atan2(target.y - player.y, target.x - player.x)
    : Math.atan2(mouse.y - player.y, mouse.x - player.x);
  let diff = want - player.aimAngle;
  while(diff >  Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  player.aimAngle += diff * 0.3;


  if(player.recoil > 0) player.recoil *= 0.7;
  if(player.recoil < 0.1) player.recoil = 0;


  if(player.fireCooldown > 0) player.fireCooldown--;
  if(!rampageActive && (mouse.down || fireBtnPressed) && player.fireCooldown <= 0){
    shoot();
    player.fireCooldown = WEAPONS[player.weapon].rate;
  }


  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;


    if(b.rocket && Math.random() < 0.8){
      smoke.push({ x: b.x, y: b.y, vx: rand(-0.5,0.5), vy: rand(-0.5,0.5), r: rand(4,8), life: 40, maxLife: 40 });
    }


    if(b.life<=0 || b.x<-20 || b.x>W+20 || b.y<-20 || b.y>H+20){
      if(b.explosive) explode(b.x, b.y, b.blastR, b.dmg);
      bullets.splice(i,1); continue;
    }
    let hit = false;


    for(let j=zombies.length-1;j>=0;j--){
      const z = zombies[j];
      if(dist(b,z) < b.r + z.r){
        if(b.explosive){ explode(b.x, b.y, b.blastR, b.dmg); }
        else {
          z.hp -= b.dmg;
          for(let k=0;k<8;k++){
            const a = Math.atan2(b.vy, b.vx) + rand(-0.8,0.8);
            const s = rand(2,5);
            particles.push({ x:z.x, y:z.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:18, color: `hsl(0,100%,${rand(35,65)}%)` });
          }
          if(z.hp <= 0){
            addBloodStain(z.x, z.y, z.r); addCorpse(z);
            for(let k=0;k<16;k++){
              const a = Math.random()*Math.PI*2;
              const s = rand(2,7);
              particles.push({ x:z.x, y:z.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:30, color: `hsl(0,100%,${rand(35,65)}%)` });
            }
            zombies.splice(j,1);
            score++; totalKills++;
            document.getElementById('score').textContent = score;
            registerKill();
          }
        }
        hit = true; break;
      }
    }
    if(hit){ bullets.splice(i,1); continue; }


    for(let j=vampires.length-1;j>=0;j--){
      const v = vampires[j];
      if(dist(b,v) < b.r + v.r){
        if(b.explosive){ explode(b.x, b.y, b.blastR, b.dmg); }
        else {
          v.hp -= b.dmg;
          for(let k=0;k<10;k++){
            const a = Math.atan2(b.vy, b.vx) + rand(-0.9,0.9);
            const s = rand(2,6);
            particles.push({ x:v.x, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:18, color: `hsl(0,100%,${rand(35,65)}%)` });
          }
          if(v.hp <= 0){
            addBloodStain(v.x, v.y, v.r + 4); addBloodPool(v.x, v.y, 40); addVampireCorpse(v);
            for(let k=0;k<20;k++){
              const a = Math.random()*Math.PI*2;
              const s = rand(2,8);
              particles.push({ x:v.x, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:32, color: `hsl(0,100%,${rand(35,65)}%)` });
            }
            vampires.splice(j,1);
            vampScore++; totalKills++;
            document.getElementById('vampScore').textContent = vampScore;
            registerKill();
          }
        }
        hit = true; break;
      }
    }
    if(hit){ bullets.splice(i,1); continue; }


    for(let j=rainbowZombies.length-1;j>=0;j--){
      const z = rainbowZombies[j];
      if(dist(b,z) < b.r + z.r){
        if(b.explosive){ explode(b.x, b.y, b.blastR, b.dmg); }
        else {
          z.hp -= b.dmg;
          for(let k=0;k<8;k++){
            const a = Math.atan2(b.vy, b.vx) + rand(-0.8,0.8);
            const s = rand(2,5);
            particles.push({ x:z.x, y:z.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:18, color: `hsl(0,100%,${rand(35,65)}%)` });
          }
          if(z.hp <= 0){
            addBloodStain(z.x, z.y, z.r); addRainbowCorpse(z);
            for(let k=0;k<16;k++){
              const a = Math.random()*Math.PI*2;
              const s = rand(2,7);
              particles.push({ x:z.x, y:z.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:30, color: `hsl(0,100%,${rand(35,65)}%)` });
            }
            rainbowZombies.splice(j,1);
            rainbowScore++; totalKills++;
            document.getElementById('rainbowScore').textContent = rainbowScore;
            registerKill();
          }
        }
        hit = true; break;
      }
    }
    if(hit){ bullets.splice(i,1); continue; }


    for(let j=vampireGenerals.length-1;j>=0;j--){
      const v = vampireGenerals[j];
      if(dist(b,v) < b.r + v.r){
        if(b.explosive){ explode(b.x, b.y, b.blastR, b.dmg); }
        else {
          v.hp -= b.dmg;
          for(let k=0;k<12;k++){
            const a = Math.atan2(b.vy, b.vx) + rand(-0.9,0.9);
            const s = rand(2,7);
            particles.push({ x:v.x, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:20, color: `hsl(0,100%,${rand(35,65)}%)` });
          }
          if(v.hp <= 0){
            addBloodStain(v.x, v.y, v.r + 6); addBloodPool(v.x, v.y, 70); addGeneralCorpse(v);
            for(let k=0;k<30;k++){
              const a = Math.random()*Math.PI*2;
              const s = rand(2,9);
              particles.push({ x:v.x, y:v.y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:35, color: `hsl(0,100%,${rand(35,65)}%)` });
            }
            vampireGenerals.splice(j,1);
            generalScore++; totalKills++;
            document.getElementById('generalScore').textContent = generalScore;
            registerKill();
          }
        }
        hit = true; break;
      }
    }
    if(hit) bullets.splice(i,1);
  }


  for(let i=enemyBullets.length-1;i>=0;i--){
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if(b.life<=0 || b.x<-20 || b.x>W+20 || b.y<-20 || b.y>H+20){
      enemyBullets.splice(i,1); continue;
    }
    if(dist(b, player) < b.r + player.r){
      enemyBullets.splice(i,1);
      if(!rampageActive) damagePlayer(8);
    }
  }


  for(const z of zombies){
    const a = Math.atan2(player.y - z.y, player.x - z.x);
    z.x += Math.cos(a)*z.speed;
    z.y += Math.sin(a)*z.speed;
    z.earPhase  += 0.15;
    z.tailPhase += 0.2;
    if(dist(z,player) < z.r + player.r){ damagePlayer(0.35); }
  }
  for(const v of vampires){
    const a = Math.atan2(player.y - v.y, player.x - v.x);
    v.x += Math.cos(a)*v.speed;
    v.y += Math.sin(a)*v.speed;
    let diff = a - v.aimAngle;
    while(diff >  Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    v.aimAngle += diff * 0.2;
    if(dist(v,player) < v.r + player.r){ damagePlayer(1.2); }
  }
  for(const z of rainbowZombies){
    const a = Math.atan2(player.y - z.y, player.x - z.x);
    z.x += Math.cos(a)*z.speed;
    z.y += Math.sin(a)*z.speed;
    z.rainbowPhase += 0.15;
  }
  for(let i=0;i<rainbowZombies.length;i++){
    const a = rainbowZombies[i];
    for(let j=i+1;j<rainbowZombies.length;j++){
      const b = rainbowZombies[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = a.r + b.r;
      if(d > 0 && d < minDist){
        const overlap = (minDist - d) * 0.5;
        const nx = dx / d;
        const ny = dy / d;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;
      }
    }
  }
  for(const z of rainbowZombies){
    if(dist(z,player) < z.r + player.r){ damagePlayer(0.5); }
  }


  for(const v of vampireGenerals){
    const a = Math.atan2(player.y - v.y, player.x - v.x);
    v.x += Math.cos(a)*v.speed;
    v.y += Math.sin(a)*v.speed;
    let diff = a - v.aimAngle;
    while(diff >  Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;
    v.aimAngle += diff * v.turnSpeed;


    const aimDelta = Math.abs(((a - v.aimAngle + Math.PI*3) % (Math.PI*2)) - Math.PI);
    if(v.fireCooldown > 0) v.fireCooldown--;
    if(v.fireCooldown <= 0 && aimDelta < 0.35){
      const gunLen = 30;
      enemyBullets.push({
        x: v.x + Math.cos(v.aimAngle)*gunLen,
        y: v.y + Math.sin(v.aimAngle)*gunLen,
        vx: Math.cos(v.aimAngle)*9,
        vy: Math.sin(v.aimAngle)*9,
        r: 4, life: 120, color: '#ffffff'
      });
      for(let k=0;k<6;k++){
        const a2 = v.aimAngle + rand(-0.5,0.5);
        particles.push({
          x: v.x + Math.cos(v.aimAngle)*gunLen,
          y: v.y + Math.sin(v.aimAngle)*gunLen,
          vx: Math.cos(a2)*rand(3,6), vy: Math.sin(a2)*rand(3,6),
          life: 10, color: '#fff59d'
        });
      }
      v.fireCooldown = 100;
    }
    if(dist(v,player) < v.r + player.r){ damagePlayer(2); }
  }


  for(let i=pickups.length-1;i>=0;i--){
    const p = pickups[i];
    p.life--;
    p.bobPhase += 0.08;
    if(p.life<=0){ pickups.splice(i,1); continue; }
    if(dist(p,player) < p.r + player.r){
      player.hp = Math.min(player.maxHp, player.hp + 35);
      document.getElementById('hp').textContent = Math.floor(player.hp);
      for(let k=0;k<20;k++){
        const a = Math.random()*Math.PI*2;
        const s = rand(2, 6);
        particles.push({ x: p.x, y: p.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 20, color: '#ff5252' });
      }
      pickups.splice(i,1);
    }
  }


  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if(p.life<=0) particles.splice(i,1);
  }


  for(let i=gore.length-1;i>=0;i--){
    const g = gore[i];
    if(!g.settle){
      g.x += g.vx; g.y += g.vy;
      g.vx *= 0.9; g.vy *= 0.9;
      g.rot += g.rotSpeed;
      if(Math.hypot(g.vx, g.vy) < 0.2){ g.settle = true; }
    }
    if(!settings.infiniteBlood){
      g.life--;
      if(g.life <= 0){ gore.splice(i,1); }
    }
  }


  for(let i=bloodStains.length-1;i>=0;i--){
    const s = bloodStains[i];
    if(settings.infiniteBlood) continue;
    s.age++;
    if(s.age >= s.life){
      bloodStains.splice(i,1);
    }
  }


  for(let i=smoke.length-1;i>=0;i--){
    const s = smoke[i];
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.96; s.vy *= 0.96;
    s.r += 0.4;
    s.life--;
    if(s.life<=0) smoke.splice(i,1);
  }


  for(let i=casings.length-1;i>=0;i--){
    const c = casings[i];
    c.x += c.vx; c.y += c.vy;
    c.vx *= 0.88; c.vy *= 0.88;
    c.rot += c.rotSpeed;
    c.life--;
    if(c.life<=0) casings.splice(i,1);
  }


  for(let i=explosions.length-1;i>=0;i--){
    const e = explosions[i];
    e.r += e.maxR / 15;
    e.life--;
    if(e.life<=0) explosions.splice(i,1);
  }


  for(let i=shockwaves.length-1;i>=0;i--){
    const s = shockwaves[i];
    s.r += s.maxR / 20;
    s.life--;
    if(s.life<=0) shockwaves.splice(i,1);
  }


  if(screenShake > 0.2) screenShake *= currentShakeDecay;
  else screenShake = 0;


  if(killStreakTimer > 0){
    killStreakTimer--;
    if(killStreakTimer === 0){ killStreak = 0; }
  }
  if(killScreenTimer > 0){
    killScreenTimer--;
  } else {
    killScreenIntensity *= 0.95;
    if(killScreenIntensity < 0.02) killScreenIntensity = 0;
  }
  killScreen.style.opacity = killScreenIntensity;


  spawnTimer++;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnZombie();
    if(score > 15 && spawnInterval > 25) spawnInterval -= 0.3;
  }


  vampSpawnTimer++;
  if(vampSpawnTimer >= vampSpawnInterval){
    vampSpawnTimer = 0;
    spawnVampire();
    if(vampSpawnInterval > 90) vampSpawnInterval -= 4;
  }


  rainbowSpawnTimer++;
  if(rainbowSpawnTimer >= rainbowSpawnInterval){
    rainbowSpawnTimer = 0;
    spawnRainbowWall();
    if(rainbowSpawnInterval > 360) rainbowSpawnInterval -= 10;
  }


  generalSpawnTimer++;
  if(generalSpawnTimer >= generalSpawnInterval){
    generalSpawnTimer = 0;
    spawnVampireGeneral();
    if(generalSpawnInterval > 1800) generalSpawnInterval -= 5;
  }


  pickupSpawnTimer++;
  if(pickupSpawnTimer >= pickupSpawnInterval){
    pickupSpawnTimer = 0;
    spawnPickup();
  }


  if(totalKills > 0 && totalKills % 25 === 0 && Math.random() < 0.02){
    spawnInterval = Math.max(15, spawnInterval - 2);
    vampSpawnInterval = Math.max(50, vampSpawnInterval - 5);
    rainbowSpawnInterval = Math.max(200, rainbowSpawnInterval - 15);
  }


  // ОБНОВЛЕНИЕ ИНДИКАТОРА C4
  if(c4Owned && pendingC4Pending && !c4UsedThisRun){
    c4IndicatorEl.classList.add('show');
  } else {
    c4IndicatorEl.classList.remove('show');
  }
}


function updateHUD(){
  document.getElementById('weapon').textContent = rampageActive
    ? (rampageStalin ? 'ЭЛЕКТРОПИЛА СТАЛИНА' : 'БЕНЗОПИЛА')
    : WEAPONS[player.weapon].name;
  document.getElementById('hp').textContent = Math.floor(player.hp) + '/' + player.maxHp;
  const order = [['pistol','1'],['shotgun','2'],['rifle','3'],['rpg','4']];
  for(const [k, num] of order){
    const el = document.getElementById('w-' + k);
    el.textContent = `${num} · ${WEAPONS[k].name}`;
    el.classList.toggle('active', player.weapon === k && !rampageActive);
  }
  weaponBtns.forEach(b => b.classList.toggle('active', b.dataset.w === player.weapon && !rampageActive));
}


function endGame(){
  gameOver = true;
  const msg = document.getElementById('msg');
  msg.style.display = 'block';
  msg.innerHTML = `ИГРА ОКОНЧЕНА<br>Фурри: ${score}<br>Правачков: ${vampScore}<br>Геев: ${rainbowScore}<br>Генералов: ${generalScore}<br>Всего убито: ${totalKills}`;
  fireBtn.style.display = 'none';
  joyBase.style.display = 'none';
  document.getElementById('weaponBtns').style.display = 'none';
  c4IndicatorEl.classList.remove('show');


  // C4: если куплен и есть в запасе — активируем
  if(c4Owned && pendingC4Pending && !c4UsedThisRun){
    c4UsedThisRun = true;
    pendingC4Pending = false;
    c4Detonate();
  }


  setTimeout(() => { returnToMenu(); }, 700);
}

function drawCorpse(c){
  const angle = c.angle;
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const backX = Math.cos(angle + Math.PI);
  const backY = Math.sin(angle + Math.PI);
  ctx.strokeStyle = c.tailColor;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c.x - Math.cos(angle)*c.r, c.y - Math.sin(angle)*c.r);
  ctx.quadraticCurveTo(
    c.x - Math.cos(angle)*c.r - backX*10 + perpX*8,
    c.y - Math.sin(angle)*c.r - backY*10 + perpY*8,
    c.x - Math.cos(angle)*c.r - backX*20 + perpX*14,
    c.y - Math.sin(angle)*c.r - backY*20 + perpY*14
  );
  ctx.stroke();
  ctx.fillStyle = c.earColor;
  ctx.beginPath();
  ctx.moveTo(c.x + perpX*7, c.y + perpY*7);
  ctx.lineTo(c.x + perpX*15 + backX*6, c.y + perpY*15 + backY*6);
  ctx.lineTo(c.x + perpX*4 + backX*8, c.y + perpY*4 + backY*8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x - perpX*7, c.y - perpY*7);
  ctx.lineTo(c.x - perpX*15 + backX*6, c.y - perpY*15 + backY*6);
  ctx.lineTo(c.x - perpX*4 + backX*8, c.y - perpY*4 + backY*8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.r*1.1, c.r*0.85, angle, 0, Math.PI*2);
  ctx.fillStyle = c.bodyColor; ctx.fill();
  ctx.strokeStyle = '#8e1145'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#3e0a25'; ctx.lineWidth = 1.5;
  const ex1 = c.x - 5, ey1 = c.y - 3;
  const ex2 = c.x + 5, ey2 = c.y - 3;
  ctx.beginPath();
  ctx.moveTo(ex1-2, ey1-2); ctx.lineTo(ex1+2, ey1+2);
  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
}


function drawVampireCorpse(vc){
  const angle = vc.angle;
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  ctx.strokeStyle = '#37474f';
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(vc.x + perpX*8 + cosA*4, vc.y + perpY*8 + sinA*4);
  ctx.lineTo(vc.x + perpX*8 + cosA*24, vc.y + perpY*8 + sinA*24);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(vc.x, vc.y, vc.r*1.1, vc.r*0.85, angle, 0, Math.PI*2);
  ctx.fillStyle = '#e8a48a'; ctx.fill();
  ctx.strokeStyle = '#a15a44'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#3e0a25'; ctx.lineWidth = 1.5;
  const ex1 = vc.x - 6, ey1 = vc.y - 3;
  const ex2 = vc.x + 6, ey2 = vc.y - 3;
  ctx.beginPath();
  ctx.moveTo(ex1-2, ey1-2); ctx.lineTo(ex1+2, ey1+2);
  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(vc.x, vc.y - 4, vc.r - 2, Math.PI, 0);
  ctx.closePath();
  const g = ctx.createLinearGradient(vc.x, vc.y - vc.r - 4, vc.x, vc.y - 4);
  g.addColorStop(0, '#cfd8dc');
  g.addColorStop(1, '#607d8b');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.stroke();
  drawCross(vc.x, vc.y - 8, 5);
}


function drawRainbowCorpse(z){

  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
}


function drawGeneralCorpse(v){

function drawZombie(z){
  const angle = Math.atan2(player.y - z.y, player.x - z.x);
  const tailWave = Math.sin(z.tailPhase) * 10;
  const tailBaseX = z.x - Math.cos(angle) * z.r;
  const tailBaseY = z.y - Math.sin(angle) * z.r;
  const tailMidX  = tailBaseX - Math.cos(angle) * 14 + Math.cos(angle + Math.PI/2) * tailWave * 0.5;
  const tailMidY  = tailBaseY - Math.sin(angle) * 14 + Math.sin(angle + Math.PI/2) * tailWave * 0.5;
  const tailTipX  = tailBaseX - Math.cos(angle) * 26 + Math.cos(angle + Math.PI/2) * tailWave;
  const tailTipY  = tailBaseY - Math.sin(angle) * 26 + Math.sin(angle + Math.PI/2) * tailWave;
  ctx.strokeStyle = z.tailColor;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(tailBaseX, tailBaseY);
  ctx.quadraticCurveTo(tailMidX, tailMidY, tailTipX, tailTipY);
  ctx.stroke();
  ctx.fillStyle = z.tailColor;
  ctx.beginPath(); ctx.arc(tailTipX, tailTipY, 5, 0, Math.PI*2); ctx.fill();


  const earWave = Math.sin(z.earPhase) * 3;
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const backX = Math.cos(angle + Math.PI);
  const backY = Math.sin(angle + Math.PI);
  const e1baseX = z.x + perpX*8 + backX*6;
  const e1baseY = z.y + perpY*8 + backY*6;
  const e1tipX  = e1baseX + perpX*10 + backX*14 + perpX*earWave*0.3;
  const e1tipY  = e1baseY + perpY*10 + backY*14 + perpY*earWave*0.3;
  const e2baseX = z.x - perpX*8 + backX*6;
  const e2baseY = z.y - perpY*8 + backY*6;
  const e2tipX  = e2baseX - perpX*10 + backX*14 - perpX*earWave*0.3;
  const e2tipY  = e2baseY - perpY*10 + backY*14 - perpY*earWave*0.3;
  ctx.fillStyle = z.earColor;
  ctx.beginPath();
  ctx.moveTo(e1baseX + perpX*3, e1baseY + perpY*3);
  ctx.lineTo(e1tipX - perpX*2,  e1tipY - perpY*2);
  ctx.lineTo(e1baseX - perpX*3, e1baseY - perpY*3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(e2baseX - perpX*3, e2baseY - perpY*3);
  ctx.lineTo(e2tipX + perpX*2,  e2tipY + perpY*2);
  ctx.lineTo(e2baseX + perpX*3, e2baseY + perpY*3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(e1baseX, e1baseY); ctx.lineTo(e1tipX, e1tipY);
  ctx.lineTo(e1baseX - perpX*6, e1baseY - perpY*6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e2baseX, e2baseY); ctx.lineTo(e2tipX, e2tipY);
  ctx.lineTo(e2baseX + perpX*6, e2baseY + perpY*6); ctx.stroke();


  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
  ctx.fillStyle = z.bodyColor; ctx.fill();
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 2.5; ctx.stroke();


  const eyeOffsetX = Math.cos(angle) * 4;
  const eyeOffsetY = Math.sin(angle) * 4;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(z.x - 5 + eyeOffsetX*0.3, z.y - 3 + eyeOffsetY*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + eyeOffsetX*0.3, z.y - 3 + eyeOffsetY*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(z.x - 5 + eyeOffsetX, z.y - 3 + eyeOffsetY, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + eyeOffsetX, z.y - 3 + eyeOffsetY, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#880e4f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(z.x, z.y + 5, 4, 0, Math.PI); ctx.stroke();


  if(z.hp < z.maxHp){
    const w = z.r*2;
    ctx.fillStyle = '#000';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w, 4);
    ctx.fillStyle = '#f44336';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w*(z.hp/z.maxHp), 4);
  }
}


function drawRainbowZombie(z){
  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
  ctx.fillStyle = z.bodyColor; ctx.fill();
  const hueShift = (z.rainbowPhase * 40) % 360;
  ctx.strokeStyle = `hsl(${hueShift}, 100%, 60%)`;
  ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(z.x - 6, z.y - 4, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 6, z.y - 4, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(z.x - 6, z.y - 4, 4.5, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(z.x + 6, z.y - 4, 4.5, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(z.x - 6, z.y - 4, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 6, z.y - 4, 2, 0, Math.PI*2); ctx.fill();
  if(z.hp < z.maxHp){
    const w = z.r*2;
    ctx.fillStyle = '#000';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w, 4);

  }
}


function drawCross(cx, cy, size){
  ctx.fillStyle = '#000';
  const w = size * 0.5;
  const h = size * 1.6;
  ctx.fillRect(cx - w/2, cy - h/2, w, h);
  const barY = cy - h*0.15;
  ctx.fillRect(cx - h*0.45, barY - w/2, h*0.9, w);
}


function drawVampire(v){
  const a = v.aimAngle;
  const cosA = Math.cos(a);
  const sinA = Math.sin(a);
  ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(v.x-4, v.y-4, 3, v.x, v.y, v.r);
  grad.addColorStop(0, '#ffccbc');
  grad.addColorStop(1, '#e09680');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#a15a44'; ctx.lineWidth = 2.5; ctx.stroke();


  const lookX = cosA * 3;
  const lookY = sinA * 3;
  const eyeY = v.y + 2;
  const eyeR = 5.5;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(v.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(v.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(v.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(v.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#c62828';
  ctx.beginPath(); ctx.arc(v.x - 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(v.x + 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();


  ctx.beginPath(); ctx.arc(v.x, v.y - 5, v.r - 1, Math.PI, 0); ctx.closePath();
  const helmGrad = ctx.createLinearGradient(v.x, v.y - v.r - 5, v.x, v.y - 5);
  helmGrad.addColorStop(0, '#cfd8dc');
  helmGrad.addColorStop(1, '#607d8b');
  ctx.fillStyle = helmGrad; ctx.fill();
  ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.stroke();
  drawCross(v.x, v.y - 9, 5);
  drawHandsAndGun(v.x, v.y, v.r, a, 'pistol', {});
  if(v.hp < v.maxHp){
    const w = v.r*2 + 6;
    ctx.fillStyle = '#000';
    ctx.fillRect(v.x-w/2, v.y - v.r - 16, w, 5);
    ctx.fillStyle = '#d32f2f';
    ctx.fillRect(v.x-w/2, v.y - v.r - 16, w*(v.hp/v.maxHp), 5);
  }
}

function drawPlayer(){
  const a = player.aimAngle;
  const cosA = Math.cos(a);
  const sinA = Math.sin(a);


  if(rampageActive){
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 12, 0, Math.PI*2);
    const aura = ctx.createRadialGradient(player.x, player.y, player.r*0.5, player.x, player.y, player.r + 12);
    if(rampageStalin){
      aura.addColorStop(0, 'rgba(21,101,192,0.55)');
      aura.addColorStop(1, 'rgba(21,101,192,0)');
    } else {
      aura.addColorStop(0, 'rgba(255,0,0,0.55)');
      aura.addColorStop(1, 'rgba(255,0,0,0)');
    }
    ctx.fillStyle = aura; ctx.fill();
  }


  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(player.x-4, player.y-4, 3, player.x, player.y, player.r);
  grad.addColorStop(0, '#ffccbc');
  grad.addColorStop(1, '#f0a68c');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#b0705a'; ctx.lineWidth = 2.5; ctx.stroke();


  const lookX = cosA * 3;
  const lookY = sinA * 3;
  const eyeY = player.y + 2;
  const eyeR = 5.5;


  const blackSclera = rampageActive && !rampageStalin;
  ctx.fillStyle = blackSclera ? '#000000' : '#ffffff';
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();


  if(rampageActive && rampageStalin){ ctx.fillStyle = '#1565c0'; }
  else if(rampageActive && !rampageStalin){ ctx.fillStyle = '#ff0000'; }
  else { ctx.fillStyle = '#000000'; }
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(player.x + 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();


  ctx.beginPath(); ctx.arc(player.x, player.y - 5, player.r - 1, Math.PI, 0); ctx.closePath();
  const helmGrad = ctx.createLinearGradient(player.x, player.y - player.r - 5, player.x, player.y - 5);
  helmGrad.addColorStop(0, '#81c784');
  helmGrad.addColorStop(1, '#2e7d32');
  ctx.fillStyle = helmGrad; ctx.fill();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();


  const starColor = (rampageActive && rampageStalin) ? '#1565c0' : '#d32f2f';
  const starStroke = (rampageActive && rampageStalin) ? '#0d47a1' : '#8e0000';
  drawStar(player.x, player.y - 9, 5, starColor, starStroke);


  drawHandsAndGun(player.x, player.y, player.r, a, player.weapon, {
    rampageActive: rampageActive,
    stalin: rampageStalin,
    recoil: player.recoil
  });
}


function drawStar(cx, cy, size, fill, stroke){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i * 2*Math.PI/5;
    const a2 = a1 + Math.PI/5;
    const x1 = cx + Math.cos(a1)*size;
    const y1 = cy + Math.sin(a1)*size;
    const x2 = cx + Math.cos(a2)*size*0.45;
    const y2 = cy + Math.sin(a2)*size*0.45;
    if(i===0) ctx.moveTo(x1, y1);
    else ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}


function drawPickup(p){
  const bob = Math.sin(p.bobPhase) * 2;
  const y = p.y + bob;
  ctx.beginPath();
  ctx.arc(p.x, y, p.r + 6, 0, Math.PI*2);
  const glow = ctx.createRadialGradient(p.x, y, p.r*0.5, p.x, y, p.r + 6);
  glow.addColorStop(0, 'rgba(255,255,255,0.4)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(p.x - p.r, y - p.r, p.r*2, p.r*2);
  ctx.strokeStyle = '#bbbbbb'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x - p.r, y - p.r, p.r*2, p.r*2);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(p.x - p.r + 1, y - p.r + 1, p.r*2, p.r*2);
  ctx.fillStyle = '#e53935';
  const crossW = p.r * 0.4;
  const crossL = p.r * 1.3;
  ctx.fillRect(p.x - crossW/2, y - crossL/2, crossW, crossL);
  ctx.fillRect(p.x - crossL/2, y - crossW/2, crossL, crossW);
  ctx.strokeStyle = '#8e0000'; ctx.lineWidth = 1;
  ctx.strokeRect(p.x - crossW/2, y - crossL/2, crossW, crossL);
  ctx.strokeRect(p.x - crossL/2, y - crossW/2, crossL, crossW);
}


function drawGore(){
  if(!bloodEnabled()) return;
  for(const g of gore){
    const alpha = settings.infiniteBlood ? 1 : Math.max(0, Math.min(1, g.life / g.maxLife));
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    if(g.kind === 'bone'){
      ctx.fillStyle = '#e8c4c4';
      ctx.strokeStyle = '#8b0000';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, g.r*1.1, g.r*0.4, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = g.color;
      ctx.strokeStyle = '#4a0000';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, g.r, g.r*0.7, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}


function draw(){
  let bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, Math.max(W,H));
  if(rampageActive && rampageStalin){
    bgGrad.addColorStop(0, '#001a4a');
    bgGrad.addColorStop(1, '#000a1f');
  } else if(rampageActive){
    bgGrad.addColorStop(0, '#3a0000');
    bgGrad.addColorStop(1, '#1a0000');
  } else {
    bgGrad.addColorStop(0, '#262626');
    bgGrad.addColorStop(1, '#0e0e0e');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);


  ctx.save();
  let shake = screenShake;
  if(rampageActive) shake = rampageStalin ? screenShake + 10 : screenShake + 6;
  if(shake > 0.2){ ctx.translate(rand(-shake, shake), rand(-shake, shake)); }


  if(bloodEnabled()){
    for(const s of bloodStains){
      let alpha = 1;
      if(!settings.infiniteBlood && s.life !== Infinity){
        const remaining = s.life - s.age;
        if(remaining < s.life * 0.25){
          alpha = Math.max(0, remaining / (s.life * 0.25));
        }
      }
      ctx.globalAlpha = alpha;
      for(const d of s.drops){
        ctx.beginPath();
        ctx.arc(s.x + d.x, s.y + d.y, d.r, 0, Math.PI*2);
        ctx.fillStyle = s.big ? BLOOD_DARK : BLOOD_BRIGHT;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.big ? 12 : 5, 0, Math.PI*2);
      ctx.fillStyle = BLOOD_CORE;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }


  drawGore();
  for(const c of corpses) drawCorpse(c);
  for(const vc of vampireCorpses) drawVampireCorpse(vc);
  for(const rc of rainbowCorpses) drawRainbowCorpse(rc);
  for(const gc of generalCorpses) drawGeneralCorpse(gc);


  for(const p of pickups) drawPickup(p);


  for(const s of smoke){
    const a = s.life / s.maxLife;
    ctx.globalAlpha = a * 0.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = '#888'; ctx.fill();
    ctx.globalAlpha = 1;
  }


  for(const z of zombies) drawZombie(z);
  for(const v of vampires) drawVampire(v);
  for(const z of rainbowZombies) drawRainbowZombie(z);
  for(const v of vampireGenerals) drawVampireGeneral(v);


  for(const b of bullets){
    if(b.rocket){
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = '#333'; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.vx*0.8, b.y - b.vy*0.8, 4, 0, Math.PI*2);
      const g = ctx.createRadialGradient(b.x - b.vx*0.8, b.y - b.vy*0.8, 0, b.x - b.vx*0.8, b.y - b.vy*0.8, 6);
      g.addColorStop(0, '#fff59d');
      g.addColorStop(1, 'rgba(255,152,0,0)');
      ctx.fillStyle = g; ctx.fill();
    } else {
      ctx.strokeStyle = b.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*0.6, b.y - b.vy*0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
  }


  for(const b of enemyBullets){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = b.color; ctx.fill();
    ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 1.5; ctx.stroke();
  }


  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/15);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
    ctx.globalAlpha = 1;
  }


  for(const c of casings){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(-3, -1.5, 6, 3);
    ctx.fillStyle = '#f5d76e';
    ctx.fillRect(-3, -1.5, 6, 1);
    ctx.restore();
  }


  for(const s of shockwaves){
    const t = 1 - s.life/20;
    ctx.globalAlpha = Math.max(0, 1 - t) * 0.6;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }


  for(const e of explosions){
    const t = 1 - e.life/30;
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    g.addColorStop(0, '#fff59d');
    g.addColorStop(0.4, '#ff9800');
    g.addColorStop(0.7, '#e53935');
    g.addColorStop(1, 'rgba(255,87,34,0)');
    ctx.fillStyle = g; ctx.fill();
    ctx.globalAlpha = 1;
  }


  drawPlayer();


  // C4 индикатор над игроком
  if(c4Owned && pendingC4Pending && !c4UsedThisRun){
    const t = Date.now() / 200;
    const blink = 0.6 + 0.4 * Math.sin(t);
    ctx.globalAlpha = blink;
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffcc00';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText('C4', player.x, player.y - 34);
    ctx.fillText('C4', player.x, player.y - 34);
    ctx.globalAlpha = 1;
  }


  ctx.restore();
}


function loop(){
  update();
  draw();
  updateHUD();
  requestAnimationFrame(loop);
}


updateHUD();
loop();
</script>
</body>
</html>
