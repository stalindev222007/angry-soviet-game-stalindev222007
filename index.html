  ctx.strokeRect(v.x - helmW/2, v.y - v.r - helmH*0.7, helmW, helmH);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(v.x - helmW/2 + 3, v.y - v.r - helmH*0.7 + 3, helmW - 6, 4);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(v.x, v.y - v.r - helmH*0.2, v.r*0.55, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
  drawHandsAndGun(v.x, v.y, v.r, a, 'pistol', {});


  if(v.hp < v.maxHp){
    const w = v.r*2 + 20;
    ctx.fillStyle = '#000';
    ctx.fillRect(v.x-w/2, v.y - v.r - 30, w, 6);
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(v.x-w/2, v.y - v.r - 30, w*(v.hp/v.maxHp), 6);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.strokeRect(v.x-w/2, v.y - v.r - 30, w, 6);
  }
}


function drawPlayer(){
  const a = player.aimAngle;
  const cosA = Math.cos(a);
  const sinA = Math.sin(a);


  if(rampageActive){
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r + 12, 0, Math.PI*2);
    const aura = ctx.createRadialGradient(player.x, player.y, player.r*0.5, player.x, player.y, player.r + 12);
    if(rampageStalin){
      aura.addColorStop(0, 'rgba(21,101,192,0.55)');
      aura.addColorStop(1, 'rgba(21,101,192,0)');
    } else {
      aura.addColorStop(0, 'rgba(255,0,0,0.55)');
      aura.addColorStop(1, 'rgba(255,0,0,0)');
    }
    ctx.fillStyle = aura; ctx.fill();
  }


  ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(player.x-4, player.y-4, 3, player.x, player.y, player.r);
  grad.addColorStop(0, '#ffccbc');
  grad.addColorStop(1, '#f0a68c');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#b0705a'; ctx.lineWidth = 2.5; ctx.stroke();


  const lookX = cosA * 3;
  const lookY = sinA * 3;
  const eyeY = player.y + 2;
  const eyeR = 5.5;


  const blackSclera = rampageActive && !rampageStalin;


  // ЛЕВЫЙ глаз -- обычный
  ctx.fillStyle = blackSclera ? '#000000' : '#ffffff';
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(player.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();


  // ПРАВЫЙ глаз -- КРАСНЫЙ (если куплен лазер)
  if(laserEyeOwned && !player.dead){
    const laserGlow = ctx.createRadialGradient(player.x + 6 + lookX, eyeY + lookY, 0, player.x + 6 + lookX, eyeY + lookY, eyeR + 8);
    laserGlow.addColorStop(0, 'rgba(255,0,0,0.9)');
    laserGlow.addColorStop(0.5, 'rgba(255,0,0,0.4)');
    laserGlow.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = laserGlow;
    ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR + 8, 0, Math.PI*2); ctx.fill();


    ctx.fillStyle = '#ff0000';
    ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8b0000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();


    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.ellipse(player.x + 6 + lookX*1.7, eyeY + lookY*1.7, 1.8, 3, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = blackSclera ? '#000000' : '#ffffff';
    ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(player.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();


    if(player.dead){
      // крестик
    } else {
      if(rampageActive && rampageStalin){ ctx.fillStyle = '#1565c0'; }
      else if(rampageActive && !rampageStalin){ ctx.fillStyle = '#ff0000'; }
      else { ctx.fillStyle = '#000000'; }
      ctx.beginPath(); ctx.arc(player.x + 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
    }
  }


  // Левый зрачок
  if(!player.dead){
    if(blackSclera){
      ctx.fillStyle = '#ff0000';
    } else if(rampageActive && rampageStalin){
      ctx.fillStyle = '#1565c0';
    } else {
      ctx.fillStyle = '#000000';
    }
    ctx.beginPath(); ctx.arc(player.x - 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  }


  if(player.dead){
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    const ecx1 = player.x - 6 + lookX;
    const ecy1 = eyeY + lookY;
    const ecx2 = player.x + 6 + lookX;
    const ecy2 = eyeY + lookY;
    ctx.beginPath();
    ctx.moveTo(ecx1-4, ecy1-4); ctx.lineTo(ecx1+4, ecy1+4);
    ctx.moveTo(ecx1+4, ecy1-4); ctx.lineTo(ecx1-4, ecy1+4);
    ctx.moveTo(ecx2-4, ecy2-4); ctx.lineTo(ecx2+4, ecy2+4);
    ctx.moveTo(ecx2+4, ecy2-4); ctx.lineTo(ecx2-4, ecy2+4);
    ctx.stroke();
  }


  ctx.beginPath(); ctx.arc(player.x, player.y - 5, player.r - 1, Math.PI, 0); ctx.closePath();
  const helmGrad = ctx.createLinearGradient(player.x, player.y - player.r - 5, player.x, player.y - 5);
  helmGrad.addColorStop(0, '#81c784');
  helmGrad.addColorStop(1, '#2e7d32');
  ctx.fillStyle = helmGrad; ctx.fill();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();


  const starColor = (rampageActive && rampageStalin) ? '#1565c0' : '#d32f2f';
  const starStroke = (rampageActive && rampageStalin) ? '#0d47a1' : '#8e0000';
  drawStar(player.x, player.y - 9, 5, starColor, starStroke);


  drawHandsAndGun(player.x, player.y, player.r, a, player.weapon, {
    rampageActive: rampageActive,
    stalin: rampageStalin,
    recoil: player.recoil
  });
}


function drawStar(cx, cy, size, fill, stroke){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i * 2*Math.PI/5;
    const a2 = a1 + Math.PI/5;
    const x1 = cx + Math.cos(a1)*size;
    const y1 = cy + Math.sin(a1)*size;
    const x2 = cx + Math.cos(a2)*size*0.45;
    const y2 = cy + Math.sin(a2)*size*0.45;
    if(i===0) ctx.moveTo(x1, y1);
    else ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}


function drawPickup(p){
  const bob = Math.sin(p.bobPhase) * 2;
  const y = p.y + bob;
  ctx.beginPath();
  ctx.arc(p.x, y, p.r + 6, 0, Math.PI*2);
  const glow = ctx.createRadialGradient(p.x, y, p.r*0.5, p.x, y, p.r + 6);
  glow.addColorStop(0, 'rgba(255,255,255,0.4)');
  glow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glow; ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(p.x - p.r, y - p.r, p.r*2, p.r*2);
  ctx.strokeStyle = '#bbbbbb'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x - p.r, y - p.r, p.r*2, p.r*2);
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(p.x - p.r + 1, y - p.r + 1, p.r*2, p.r*2);
  ctx.fillStyle = '#e53935';
  const crossW = p.r * 0.4;
  const crossL = p.r * 1.3;
  ctx.fillRect(p.x - crossW/2, y - crossL/2, crossW, crossL);
  ctx.fillRect(p.x - crossL/2, y - crossW/2, crossL, crossW);
  ctx.strokeStyle = '#8e0000'; ctx.lineWidth = 1;
  ctx.strokeRect(p.x - crossW/2, y - crossL/2, crossW, crossL);
  ctx.strokeRect(p.x - crossL/2, y - crossW/2, crossL, crossW);
}


function drawGore(){
  if(!bloodEnabled()) return;
  for(const g of gore){
    const alpha = settings.infiniteBlood ? 1 : Math.max(0, Math.min(1, g.life / g.maxLife));
    ctx.globalAlpha = alpha;
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.rot);
    if(g.kind === 'bone'){
      ctx.fillStyle = '#e8c4c4';
      ctx.strokeStyle = '#8b0000';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, g.r*1.1, g.r*0.4, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = g.color;
      ctx.strokeStyle = '#4a0000';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.ellipse(0, 0, g.r, g.r*0.7, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}


function drawLaser(){
  if(!laserActive) return;
  const angle = player.aimAngle;
  const dirX = Math.cos(angle);
  const dirY = Math.sin(angle);


  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const startX = player.x + dirX * player.r * 0.4 + perpX * 6;
  const startY = player.y + dirY * player.r * 0.4 + perpY * 6;
  const endX = player.x + dirX * 3000;
  const endY = player.y + dirY * 3000;


  const t = Date.now() / 40;
  const flicker = 0.9 + Math.sin(t) * 0.1;


  ctx.save();
  ctx.globalCompositeOperation = 'lighter';


  ctx.strokeStyle = `rgba(255, 0, 0, ${0.45 * flicker})`;
  ctx.lineWidth = 22;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(endX, endY);
  ctx.stroke();


  ctx.strokeStyle = `rgba(255, 20, 20, ${0.85 * flicker})`;
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(endX, endY);
  ctx.stroke();


  ctx.strokeStyle = `rgba(255, 180, 180, ${flicker})`;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(endX, endY);
  ctx.stroke();


  ctx.beginPath();
  ctx.arc(startX, startY, 10, 0, Math.PI*2);
  const glowGrad = ctx.createRadialGradient(startX, startY, 2, startX, startY, 10);
  glowGrad.addColorStop(0, '#ffffff');
  glowGrad.addColorStop(0.4, `rgba(255, 40, 40, ${flicker})`);
  glowGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
  ctx.fillStyle = glowGrad;
  ctx.fill();


  ctx.restore();


  if(laserTarget){
    ctx.beginPath();
    ctx.arc(laserTarget.x, laserTarget.y, 14, 0, Math.PI*2);
    const hitGrad = ctx.createRadialGradient(laserTarget.x, laserTarget.y, 2, laserTarget.x, laserTarget.y, 14);
    hitGrad.addColorStop(0, '#ffffff');
    hitGrad.addColorStop(0.4, `rgba(255, 60, 60, ${flicker})`);
    hitGrad.addColorStop(1, 'rgba(255, 0, 0, 0)');
    ctx.fillStyle = hitGrad;
    ctx.fill();
  }
}


function draw(){
  let bgGrad = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, Math.max(W,H));
  if(rampageActive && rampageStalin){
    bgGrad.addColorStop(0, '#001a4a');
    bgGrad.addColorStop(1, '#000a1f');
  } else if(rampageActive){
    bgGrad.addColorStop(0, '#3a0000');
    bgGrad.addColorStop(1, '#1a0000');
  } else {
    bgGrad.addColorStop(0, '#262626');
    bgGrad.addColorStop(1, '#0e0e0e');
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);


  ctx.save();
  let shake = screenShake;
  if(rampageActive) shake = rampageStalin ? screenShake + 10 : screenShake + 6;
  if(shake > 0.2){ ctx.translate(rand(-shake, shake), rand(-shake, shake)); }


  if(bloodEnabled()){
    for(const s of bloodStains){
      let alpha = 1;
      if(!settings.infiniteBlood && s.life !== Infinity){
        const remaining = s.life - s.age;
        if(remaining < s.life * 0.25){
          alpha = Math.max(0, remaining / (s.life * 0.25));
        }
      }
      ctx.globalAlpha = alpha;
      for(const d of s.drops){
        ctx.beginPath();
        ctx.arc(s.x + d.x, s.y + d.y, d.r, 0, Math.PI*2);
        ctx.fillStyle = s.big ? BLOOD_DARK : BLOOD_BRIGHT;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.big ? 12 : 5, 0, Math.PI*2);
      ctx.fillStyle = BLOOD_CORE;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }


  drawGore();
  for(const c of corpses) drawCorpse(c);
  for(const vc of vampireCorpses) drawVampireCorpse(vc);
  for(const rc of rainbowCorpses) drawRainbowCorpse(rc);
  for(const gc of generalCorpses) drawGeneralCorpse(gc);


  for(const p of pickups) drawPickup(p);


  for(const s of smoke){
    const a = s.life / s.maxLife;
    ctx.globalAlpha = a * 0.5;
    if(s.fire){
      ctx.fillStyle = `hsl(${rand(0, 40)}, 100%, 60%)`;
    } else {
      ctx.fillStyle = '#888';
    }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }


  for(const z of zombies) drawZombie(z);
  for(const v of vampires) drawVampire(v);
  for(const z of rainbowZombies) drawRainbowZombie(z);
  for(const v of vampireGenerals) drawVampireGeneral(v);


  for(const s of jucheSoldiers) drawJucheSoldier(s);


  for(const hb of hellBalls){
    const t = hb.life / hb.maxLife;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const grad = ctx.createRadialGradient(hb.x, hb.y, hb.r*0.2, hb.x, hb.y, hb.r);
    grad.addColorStop(0, `rgba(255, 255, 220, ${0.95 * t})`);
    grad.addColorStop(0.4, `rgba(255, 180, 40, ${0.85 * t})`);
    grad.addColorStop(0.75, `rgba(255, 60, 0, ${0.7 * t})`);
    grad.addColorStop(1, 'rgba(180, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(hb.x, hb.y, hb.r, 0, Math.PI*2); ctx.fill();


    ctx.strokeStyle = `rgba(255, 240, 200, ${0.9 * t})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hb.x, hb.y, hb.r * 0.55, 0, Math.PI*2); ctx.stroke();


    ctx.restore();
  }


  for(const b of bullets){
    if(b.rocket){
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = '#333'; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x - b.vx*0.8, b.y - b.vy*0.8, 4, 0, Math.PI*2);
      const g = ctx.createRadialGradient(b.x - b.vx*0.8, b.y - b.vy*0.8, 0, b.x - b.vx*0.8, b.y - b.vy*0.8, 6);
      g.addColorStop(0, '#fff59d');
      g.addColorStop(1, 'rgba(255,152,0,0)');
      ctx.fillStyle = g; ctx.fill();
    } else {
      ctx.strokeStyle = b.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*0.6, b.y - b.vy*0.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fillStyle = '#fff'; ctx.fill();
    }
  }


  for(const b of jucheBullets){
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = '#ffd700';
    ctx.fill();
    ctx.strokeStyle = '#ff2200';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }


  for(const b of enemyBullets){
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = b.color; ctx.fill();
    ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 1.5; ctx.stroke();
  }


  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/15);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
    ctx.globalAlpha = 1;
  }


  for(const c of casings){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(-3, -1.5, 6, 3);
    ctx.fillStyle = '#f5d76e';
    ctx.fillRect(-3, -1.5, 6, 1);
    ctx.restore();
  }


  for(const s of shockwaves){
    const t = 1 - s.life/45;
    ctx.globalAlpha = Math.max(0, 1 - t) * 0.7;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r*0.92, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }


  for(const e of explosions){
    const t = 1 - e.life/30;
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r);
    if(e.fire){
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.3, '#ffcc00');
      g.addColorStop(0.7, '#ff4400');
      g.addColorStop(1, 'rgba(200,0,0,0)');
    } else {
      g.addColorStop(0, '#fff59d');
      g.addColorStop(0.4, '#ff9800');
      g.addColorStop(0.7, '#e53935');
      g.addColorStop(1, 'rgba(255,87,34,0)');
    }
    ctx.fillStyle = g; ctx.fill();
    ctx.globalAlpha = 1;
  }


  drawLaser();


  drawPlayer();


  if(c4Owned && !c4UsedThisRun && !c4Detonated){
    const t = Date.now() / 250;
    const blink = 0.5 + 0.5 * Math.abs(Math.sin(t));
    const dotX = player.x + 24;
    const dotY = player.y - 24;
    ctx.globalAlpha = blink;
    ctx.beginPath();
    ctx.arc(dotX, dotY, 6, 0, Math.PI*2);
    const dotGrad = ctx.createRadialGradient(dotX, dotY, 1, dotX, dotY, 6);
    dotGrad.addColorStop(0, '#ffffff');
    dotGrad.addColorStop(0.5, '#ff2a2a');
    dotGrad.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = dotGrad;
    ctx.fill();
    ctx.globalAlpha = 1;
  }


  ctx.restore();
}


function loop(){
  update();
  draw();
  updateHUD();
  requestAnimationFrame(loop);
}

  document.getElementById('devUnlockAll').addEventListener('click', () => {
    c4Owned = true;
    hellShotgunOwned = true;
    laserEyeOwned = true;
    jucheOwned = true;
    ensureHellSlot();
    updateMenuStats();
    setStatus('Все покупки разблокированы');
  });


  document.getElementById('devUnlockC4').addEventListener('click', () => {
    c4Owned = true;
    updateMenuStats();
    setStatus('C4 куплен');
  });


  document.getElementById('devUnlockHs').addEventListener('click', () => {
    hellShotgunOwned = true;
    ensureHellSlot();
    updateMenuStats();
    setStatus('Адский дробовик куплен');
  });


  document.getElementById('devUnlockLaser').addEventListener('click', () => {
    laserEyeOwned = true;
    updateMenuStats();
    setStatus('Лазер куплен');
  });


  document.getElementById('devUnlockJuche').addEventListener('click', () => {
    jucheOwned = true;
    updateMenuStats();
    setStatus('КНДР куплено');
  });


  let godMode = false;
  const godBtn = document.getElementById('devGod');
  godBtn.addEventListener('click', () => {
    godMode = !godMode;
    window.devGodMode = godMode;
    godBtn.style.background = godMode ? '#00ff88' : 'transparent';
    godBtn.style.color = godMode ? '#000' : '#00ff88';
    setStatus('Бессмертие: ' + (godMode ? 'ВКЛ' : 'выкл'));
  });


  document.getElementById('devMaxRpg').addEventListener('click', () => {
    rpgLoaded = true;
    rpgReloadTimer = 0;
    setStatus('РПГ заряжена');
  });


  document.getElementById('devRampage').addEventListener('click', () => {
    if(rampageActive || rageIntroActive) {
      setStatus('RAMPAGE уже активен');
      return;
    }
    nextRageAt = totalKills;
    startRage();
    setStatus('RAMPAGE запущен');
  });


  document.getElementById('devKillAll').addEventListener('click', () => {
    c4UsedThisRun = false;
    c4Detonated = false;
    c4Detonate();
    setStatus('Все враги уничтожены');
  });


  document.getElementById('devClose').addEventListener('click', () => {
    devPanel.classList.remove('show');
    devToggle.classList.remove('on');
  });
})();


updateHUD();
loop();
</script>
</body>
</html>
