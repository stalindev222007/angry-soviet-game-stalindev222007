<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1,viewport-fit=cover">
<title>Angry Soviet 3D</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;height:100%;width:100%;position:fixed;}
  canvas{display:block;touch-action:none;}
  *{box-sizing:border-box;}
  #lookLayer{position:fixed;inset:0;z-index:4;touch-action:none;pointer-events:none;}
  #joyBase{position:fixed;bottom:20px;left:20px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,80,80,.55);z-index:12;touch-action:none;display:none;box-shadow:0 0 18px rgba(255,60,60,.25);}
  #joyKnob{position:absolute;top:50%;left:50%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,120,120,.75), rgba(255,40,40,.35));border:2px solid rgba(255,140,140,.85);transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 12px rgba(255,60,60,.6);}
  #fireBtnTouch{position:fixed;bottom:22px;right:20px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #e53935, #a01010);color:#fff;font-family:'Arial Black',Arial,sans-serif;font-size:15px;font-weight:900;border:3px solid #fff;z-index:13;display:none;align-items:center;justify-content:center;text-shadow:1px 1px 2px #000;touch-action:none;box-shadow:0 0 22px rgba(255,40,40,.75), inset 0 0 18px rgba(0,0,0,.5);}
  #fireBtnTouch:active{background:radial-gradient(circle at 35% 30%, #ff5252, #c10000);transform:scale(.95);}
  #jumpBtnTouch{position:fixed;bottom:132px;right:36px;width:60px;height:60px;border-radius:50%;background:rgba(60,60,80,.9);color:#fff;font-family:'Arial Black',Arial,sans-serif;font-size:20px;font-weight:900;border:3px solid #fff;z-index:13;display:none;align-items:center;justify-content:center;text-shadow:1px 1px 2px #000;touch-action:none;box-shadow:0 0 12px rgba(0,0,0,.6);}
  #jumpBtnTouch:active{background:#4a4a60;transform:scale(.94);}
  #reloadBtnTouch{position:fixed;bottom:132px;right:110px;width:60px;height:60px;border-radius:50%;background:rgba(80,50,20,.9);color:#ffcc00;font-family:'Arial Black',Arial,sans-serif;font-size:8px;font-weight:900;border:3px solid #ffcc00;z-index:13;display:none;align-items:center;justify-content:center;text-align:center;line-height:1.05;text-shadow:1px 1px 2px #000;touch-action:none;padding:0;box-shadow:0 0 12px rgba(255,180,0,.55);}
  #reloadBtnTouch:active{background:#a06020;transform:scale(.94);}
  #reloadBtnTouch.cooling{opacity:.35;background:rgba(40,40,40,.9);border-color:#666;color:#888;}
  #mobileWeapons{position:fixed;top:10px;right:10px;display:none;flex-direction:row;gap:6px;z-index:12;}
  .mWeapBtn{width:68px;height:54px;border-radius:9px;padding:2px 3px;background:rgba(30,30,30,.9);color:#fff;font-family:'Arial Black',Arial,sans-serif;font-size:8px;font-weight:900;border:2px solid rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;cursor:pointer;touch-action:none;text-shadow:1px 1px 2px #000;letter-spacing:.2px;}
  .mWeapBtn .wNum{font-size:11px;color:#ffcc00;margin-bottom:0;}
  .mWeapBtn .wLabel{font-size:8px;}
  .mWeapBtn .wAmmo{font-size:9px;color:#ff8888;margin-top:1px;font-family:monospace;}
  .mWeapBtn.active{background:linear-gradient(180deg,#ff9800,#d07000);color:#000;border-color:#fff;box-shadow:0 0 15px rgba(255,152,0,.9);}
  .mWeapBtn.active .wNum,.mWeapBtn.active .wAmmo{color:#000;}
  .mWeapBtn.empty .wAmmo{color:#ff2222;}
  .mWeapBtn:active{transform:scale(.96);}
  #menu{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#2a0000 0%,#0a0000 70%,#000 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:16px;overflow-y:auto;}
  #menu.hidden{display:none;}
  #title{font-family:'Arial Black',Arial,sans-serif;font-size:clamp(28px,6vw,58px);font-weight:900;letter-spacing:4px;color:#c10000;text-shadow:0 0 20px #ff0000,0 0 46px #700000,4px 4px 0 #000;margin:0;animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{text-shadow:0 0 20px #ff0000,0 0 46px #700000,4px 4px 0 #000;}50%{text-shadow:0 0 32px #ff2a2a,0 0 70px #900000,4px 4px 0 #000;}}
  #sub{color:#ff8888;font-size:13px;letter-spacing:3px;margin-top:-12px;}
  #playBtn{font-family:'Arial Black',Arial,sans-serif;font-size:20px;font-weight:900;letter-spacing:4px;padding:14px 50px;color:#fff;background:#8b0000;border:3px solid #ff2a2a;border-radius:10px;cursor:pointer;text-shadow:2px 2px 0 #000;box-shadow:0 0 20px #ff0000;transition:transform .15s;}
  #playBtn:hover{transform:scale(1.06);background:#c10000;}
  #controls{color:#ddd;font-size:12px;line-height:1.8;background:rgba(30,0,0,.55);border:1px solid #5a0000;border-radius:10px;padding:12px 18px;max-width:420px;text-align:left;}
  #controls b{color:#ff5252;}
  #hud{position:fixed;top:10px;left:14px;color:#fff;font-size:14px;line-height:1.45;text-shadow:1px 1px 3px #000;z-index:5;pointer-events:none;}
  #hud span{color:#ff5252;font-weight:bold;}
  #hud .rainbow{color:#e040fb;}
  #hpWrap{width:150px;height:12px;background:#1a0000;border:2px solid #5a0000;border-radius:4px;margin-top:3px;overflow:hidden;}
  #hpBar{height:100%;width:100%;background:linear-gradient(90deg,#ff2a2a,#c10000);transition:width .15s;}
  #weaponName{position:fixed;bottom:14px;right:18px;color:#ffcc00;font-size:14px;letter-spacing:2px;text-shadow:1px 1px 3px #000;z-index:5;pointer-events:none;font-weight:bold;text-align:right;}
  #reloadHint{position:fixed;bottom:48px;right:18px;color:#ff5522;font-size:12px;letter-spacing:2px;text-shadow:1px 1px 3px #000;z-index:5;pointer-events:none;font-weight:bold;display:none;animation:blink .8s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  #crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 4px #000;z-index:5;pointer-events:none;}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.7);}
  #crosshair::before{width:14px;height:2px;top:2px;left:-4px;}
  #crosshair::after{width:2px;height:14px;left:2px;top:-4px;}
  #resumeHint{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;color:#fff;font-size:20px;font-family:'Arial Black',Arial,sans-serif;letter-spacing:2px;text-shadow:2px 2px 0 #000;}
  #resumeHint.show{display:flex;}
  #dmgFlash{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(circle,transparent 40%,rgba(200,0,0,.65) 100%);opacity:0;transition:opacity .12s;}
  #gameOver{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;}
  #gameOver.show{display:flex;}
  #goTitle{font-family:'Arial Black',Arial,sans-serif;font-size:40px;color:#ff2a2a;text-shadow:0 0 24px #ff0000,3px 3px 0 #000;letter-spacing:3px;}
  #goStats{color:#eee;font-size:15px;text-align:center;line-height:1.6;}
  #goStats b{color:#ff5252;}
  #restartBtn{font-family:'Arial Black',Arial,sans-serif;font-size:17px;font-weight:900;letter-spacing:3px;padding:12px 36px;color:#fff;background:#8b0000;border:3px solid #ff2a2a;border-radius:8px;cursor:pointer;box-shadow:0 0 16px #ff0000;}
  #restartBtn:hover{background:#c10000;}
</style>
</head>
<body>


<div id="menu">
  <h1 id="title">ANGRY SOVIET 3D</h1>
  <div id="sub">ВЫЖИВИ. ОТСТРЕЛИВАЙСЯ. НЕ УМРИ.</div>
  <button id="playBtn">ИГРАТЬ</button>
  <div id="controls"></div>
</div>


<div id="resumeHint">КЛИКНИ, ЧТОБЫ ПРОДОЛЖИТЬ</div>


<div id="hud" style="display:none;">
  Фурри: <span id="zScore">0</span> &nbsp; Правачков: <span id="vScore">0</span><br>
  Геев: <span class="rainbow" id="rScore">0</span> &nbsp; Генералов СС: <span id="gScore">0</span><br>
  HP: <span id="hpNum">100</span>
  <div id="hpWrap"><div id="hpBar"></div></div>
</div>
<div id="weaponName" style="display:none;">ПИСТОЛЕТ &middot; 12/12</div>
<div id="reloadHint">ПЕРЕЗАРЯДКА...</div>
<div id="crosshair" style="display:none;"></div>
<div id="dmgFlash"></div>


<div id="lookLayer"></div>


<div id="joyBase"><div id="joyKnob"></div></div>
<button id="fireBtnTouch">ОГОНЬ</button>
<button id="jumpBtnTouch">▲</button>
<button id="reloadBtnTouch">ПЕРЕ-<br>ЗАРЯДКА</button>
<div id="mobileWeapons">
  <button class="mWeapBtn" id="mWeapPistol"><span class="wNum">1</span><span class="wLabel">ПМ</span><span class="wAmmo">12/12</span></button>
  <button class="mWeapBtn" id="mWeapShotgun"><span class="wNum">2</span><span class="wLabel">ДРБ</span><span class="wAmmo">6/6</span></button>
  <button class="mWeapBtn" id="mWeapRifle"><span class="wNum">3</span><span class="wLabel">АК</span><span class="wAmmo">30/30</span></button>
  <button class="mWeapBtn" id="mWeapRpg"><span class="wNum">4</span><span class="wLabel">РПГ</span><span class="wAmmo">1/1</span></button>
</div>

  <div id="goTitle">ТЫ ПОГИБ</div>
  <div id="goStats"></div>
  <button id="restartBtn">В МЕНЮ</button>
</div>


<canvas id="c"></canvas>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ANGRY SOVIET 3D -- всегда горизонтальная ориентация на мобиле
   ============================================================ */


const SafeStore = (() => {
  let ok = false;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok = true; } catch(e){ ok = false; }
  return {
    get(k,d){ if(!ok) return d; try { const v = localStorage.getItem(k); return v===null?d:v; } catch(e){ return d; } },
    set(k,v){ if(!ok) return; try { localStorage.setItem(k, String(v)); } catch(e){} }
  };
})();
let bestScore = +(SafeStore.get('as3d_best', 0)) || 0;


const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;


// ============================================================
// ORIENTATION LOCK → LANDSCAPE (настойчивая версия)
// ============================================================
let orientationLocked = false;


async function enterLandscapeFullscreen(){
  if (!isTouchDevice) return;
  const el = document.documentElement;
  // Fullscreen -- только один раз
  try {
    if (el.requestFullscreen) { if (!document.fullscreenElement) await el.requestFullscreen({ navigationUI: 'hide' }); }
    else if (el.webkitRequestFullscreen) { if (!document.webkitFullscreenElement) el.webkitRequestFullscreen(); }
    else if (el.mozRequestFullScreen) { if (!document.mozFullScreenElement) el.mozRequestFullScreen(); }
    else if (el.msRequestFullscreen) { if (!document.msFullscreenElement) el.msRequestFullscreen(); }
  } catch(e) {}
  await tryLockLandscape();
}


async function tryLockLandscape(){
  if (!isTouchDevice) return;
  if (orientationLocked) return;
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
      orientationLocked = true;
    } else if (screen.lockOrientation) {
      orientationLocked = screen.lockOrientation('landscape');
    } else if (screen.mozLockOrientation) {
      orientationLocked = screen.mozLockOrientation('landscape');
    } else if (screen.msLockOrientation) {
      orientationLocked = screen.msLockOrientation('landscape');
    }
  } catch(e) {
    // iOS Safari, некоторые WebView -- не поддерживают
    orientationLocked = false;
  }
}


// Переприменяем при каждом событии -- если юзер повернул телефон, вернём в landscape
addEventListener('orientationchange', () => {
  orientationLocked = false;
  setTimeout(() => { if (gameActive) tryLockLandscape(); }, 200);
});
addEventListener('resize', () => {
  if (!gameActive) return;
  if (innerHeight > innerWidth) tryLockLandscape();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && gameActive) {
    orientationLocked = false;
    setTimeout(tryLockLandscape, 100);
  }
});


// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouchDevice });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouchDevice ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);


const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0505);
scene.fog = new THREE.FogExp2(0x140505, 0.026);


const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
const playerRig = new THREE.Object3D();
playerRig.position.set(0, 1.7, 0);
playerRig.add(camera);
scene.add(playerRig);


function handleResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', handleResize);
addEventListener('orientationchange', () => setTimeout(handleResize, 250));


scene.add(new THREE.AmbientLight(0x776060, 1.8));
const moon = new THREE.DirectionalLight(0xaabbff, 0.5);
moon.position.set(50, 80, -30);
scene.add(moon);
const flashlight = new THREE.PointLight(0xffddaa, 1.5, 30, 2);
camera.add(flashlight);


const MAX_ENEMY_LIGHTS = isTouchDevice ? 3 : 4;
const enemyLightPool = [];
for (let i = 0; i < MAX_ENEMY_LIGHTS; i++) {
  const l = new THREE.PointLight(0xff2266, 0, 5, 2);
  scene.add(l);
  enemyLightPool.push(l);
}


const ARENA = 60;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(ARENA*2, ARENA*2, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x1c1414, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);
const grid = new THREE.GridHelper(ARENA*2, 40, 0x5a0000, 0x2a1010);
grid.position.y = 0.01;
scene.add(grid);


const wallMat = new THREE.MeshStandardMaterial({ color: 0x241010, roughness: 1 });
function addWall(x,z,w,d){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,6,d), wallMat);
  m.position.set(x,3,z); scene.add(m);
}
addWall(0,-ARENA,ARENA*2,2); addWall(0,ARENA,ARENA*2,2);
addWall(-ARENA,0,2,ARENA*2); addWall(ARENA,0,2,ARENA*2);


const rubbleMat = new THREE.MeshStandardMaterial({ color: 0x2c1c1c, roughness: 1 });
for(let i=0;i<26;i++){
  const s = 1 + Math.random()*2.4;
  const box = new THREE.Mesh(new THREE.BoxGeometry(s,s*0.8,s), rubbleMat);
  const a = Math.random()*Math.PI*2, r = 8 + Math.random()*(ARENA-12);
  box.position.set(Math.cos(a)*r, s*0.4, Math.sin(a)*r);
  box.rotation.y = Math.random()*Math.PI;
  scene.add(box);
}


// ---------- Shared GEO / MAT ----------
const GEO = {
  zBody:     new THREE.SphereGeometry(0.55, 16, 14),
  zEar:      new THREE.SphereGeometry(0.16, 10, 8),
  zTail:     new THREE.SphereGeometry(0.095, 8, 6),

  gunBody:   new THREE.BoxGeometry(0.09, 0.14, 0.30),
  gunBarrel: new THREE.CylinderGeometry(0.028, 0.028, 0.20, 8),
  mgBody:    new THREE.BoxGeometry(0.10, 0.16, 0.42),
  mgBarrel:  new THREE.CylinderGeometry(0.035, 0.035, 0.40, 8),
  mgMag:     new THREE.BoxGeometry(0.09, 0.22, 0.14),
  vampProj:  new THREE.SphereGeometry(0.12, 8, 8),
  genProj:   new THREE.SphereGeometry(0.15, 8, 8),
  pickBase:  new THREE.BoxGeometry(0.55, 0.5, 0.1),
  pickC1:    new THREE.BoxGeometry(0.5, 0.15, 0.15),
  pickC2:    new THREE.BoxGeometry(0.15, 0.15, 0.5),
  bloodDrop: new THREE.BoxGeometry(1, 1, 1),
  bullet:    new THREE.BoxGeometry(0.05, 0.05, 0.55),
  pellet:    new THREE.BoxGeometry(0.04, 0.04, 0.30),
  spark:     new THREE.BoxGeometry(0.07, 0.07, 0.07),
  pBody:     new THREE.BoxGeometry(0.08,0.12,0.50),
  pBarrel:   new THREE.CylinderGeometry(0.025,0.025,0.30,10),
  pGrip:     new THREE.BoxGeometry(0.06,0.15,0.09),
  sReceiver: new THREE.BoxGeometry(0.09,0.11,0.32),
  sStock:    new THREE.BoxGeometry(0.08,0.10,0.30),
  sGrip:     new THREE.BoxGeometry(0.06,0.13,0.09),
  sBarrel:   new THREE.CylinderGeometry(0.033,0.033,0.58,10),
  sShell:    new THREE.CylinderGeometry(0.028,0.028,0.085,8),
  sHinge:    new THREE.CylinderGeometry(0.03,0.03,0.10,8),
  akStock:      new THREE.BoxGeometry(0.075, 0.11, 0.28),
  akReceiver:   new THREE.BoxGeometry(0.08, 0.13, 0.32),
  akHandguard:  new THREE.BoxGeometry(0.07, 0.09, 0.22),
  akGasTube:    new THREE.BoxGeometry(0.05, 0.04, 0.20),
  akBarrel:     new THREE.CylinderGeometry(0.017, 0.017, 0.42, 10),
  akFrontSight: new THREE.BoxGeometry(0.012, 0.05, 0.02),
  akRearSight:  new THREE.BoxGeometry(0.06, 0.025, 0.02),
  akGrip:       new THREE.BoxGeometry(0.055, 0.14, 0.075),
  akTriggerGuard: new THREE.BoxGeometry(0.05, 0.012, 0.09),
  akMagSeg:     new THREE.BoxGeometry(0.06, 0.085, 0.10),
  rpgTube:      new THREE.CylinderGeometry(0.048, 0.048, 0.78, 14),
  rpgWood:      new THREE.CylinderGeometry(0.058, 0.058, 0.32, 14),
  rpgVenturi:   new THREE.CylinderGeometry(0.048, 0.095, 0.14, 14),
  rpgFrontRing: new THREE.CylinderGeometry(0.055, 0.055, 0.03, 14),
  rpgGripFront: new THREE.BoxGeometry(0.05, 0.14, 0.06),
  rpgGripRear:  new THREE.BoxGeometry(0.05, 0.12, 0.06),
  rpgTriggerGuard: new THREE.BoxGeometry(0.06, 0.012, 0.09),
  rpgSightRear: new THREE.BoxGeometry(0.035, 0.06, 0.02),
  rpgWarheadTip:   new THREE.ConeGeometry(0.020, 0.10, 12),
  rpgWarheadNose:  new THREE.ConeGeometry(0.075, 0.20, 16),
  rpgWarheadBody:  new THREE.CylinderGeometry(0.075, 0.075, 0.14, 16),
  rpgWarheadFlare: new THREE.CylinderGeometry(0.075, 0.045, 0.06, 16),
  rpgTailTube:     new THREE.CylinderGeometry(0.022, 0.022, 0.30, 12),
  rpgTailTubeEnd:  new THREE.CylinderGeometry(0.024, 0.024, 0.03, 12),
  rpgFin:          new THREE.BoxGeometry(0.05, 0.004, 0.10),
  rpgSmallFin:     new THREE.BoxGeometry(0.03, 0.003, 0.05),
  expSphere: new THREE.SphereGeometry(1, 12, 10),
};


const MAT = {
  eyeWhite:    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.5 }),
  whiteGlow:   new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.5 }),
  pupil:       new THREE.MeshBasicMaterial({ color: 0x000000 }),
  redPupil:    new THREE.MeshBasicMaterial({ color: 0xc62828 }),
  redGlow:     new THREE.MeshBasicMaterial({ color: 0xff0000 }),
  black:       new THREE.MeshBasicMaterial({ color: 0x000000 }),
  zombieMouth: new THREE.MeshBasicMaterial({ color: 0x4a0a2a }),
  vampBody:    new THREE.MeshStandardMaterial({ color: 0x0d47a1, emissive: 0x0a2d68, emissiveIntensity: 0.7, roughness: 0.65 }),
  vampHelm:    new THREE.MeshStandardMaterial({ color: 0x607d8b, emissive: 0x37474f, emissiveIntensity: 0.4, metalness: 0.4, roughness: 0.5 }),
  genBody:     new THREE.MeshStandardMaterial({ color: 0x0d47a1, emissive: 0x0a2d68, emissiveIntensity: 0.8, roughness: 0.6 }),
  genCap:      new THREE.MeshStandardMaterial({ color: 0x0a0a0a, emissive: 0x1a1a1a, emissiveIntensity: 0.35, metalness: 0.55, roughness: 0.45 }),

// ---------- RECOIL ----------
const camRecoil = { pitch: 0, yaw: 0, pitchVel: 0, yawVel: 0 };
const wpnRecoil = { back: 0, up: 0, side: 0 };


function applyRecoilImpulse(w) {
  camRecoil.pitchVel += w.kickPitch;
  camRecoil.yawVel   += (Math.random() - 0.5) * w.kickYaw * 2;
  wpnRecoil.back = Math.max(wpnRecoil.back, w.wpnBack);
  wpnRecoil.up   = Math.max(wpnRecoil.up,   w.wpnUp);
  wpnRecoil.side = (Math.random() - 0.5) * w.wpnSide * 2;
}
function updateRecoil(dt) {
  const stiffness = 130, damping = 20;
  const pAccel = -stiffness * camRecoil.pitch - damping * camRecoil.pitchVel;
  const yAccel = -stiffness * camRecoil.yaw   - damping * camRecoil.yawVel;
  camRecoil.pitchVel += pAccel * dt;
  camRecoil.yawVel   += yAccel * dt;
  camRecoil.pitch    += camRecoil.pitchVel * dt;
  camRecoil.yaw      += camRecoil.yawVel   * dt;
  if (Math.abs(camRecoil.pitch) < 0.0001 && Math.abs(camRecoil.pitchVel) < 0.0001) { camRecoil.pitch = 0; camRecoil.pitchVel = 0; }
  if (Math.abs(camRecoil.yaw) < 0.0001 && Math.abs(camRecoil.yawVel) < 0.0001) { camRecoil.yaw = 0; camRecoil.yawVel = 0; }
  wpnRecoil.back *= Math.exp(-dt * 22);
  wpnRecoil.up   *= Math.exp(-dt * 18);
  wpnRecoil.side *= Math.exp(-dt * 14);
  if (wpnRecoil.back < 0.0005) wpnRecoil.back = 0;
  if (wpnRecoil.up   < 0.0005) wpnRecoil.up   = 0;
  if (Math.abs(wpnRecoil.side) < 0.0005) wpnRecoil.side = 0;
}

// ---------- Reload transforms ----------
function pistolReloadTransform(p){
  let tx=0, ty=0, tz=0, rx=0, ry=0, rz=0;
  const ease = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  if (p < 0.35) {
    const e = ease(p / 0.35);
    tx = -0.22*e; ty = -0.48*e; tz = 0.14*e;
    rx = 0.55*e;  ry = -0.45*e; rz = 0.95*e;
  } else if (p < 0.72) {
    tx = -0.22; ty = -0.48; tz = 0.14;
    rx = 0.55;  ry = -0.45; rz = 0.95;
    ty += Math.sin(p * 60) * 0.008;
  } else {
    const e = ease((p - 0.72) / 0.28);
    tx = -0.22*(1-e); ty = -0.48*(1-e); tz = 0.14*(1-e);
    rx = 0.55*(1-e);  ry = -0.45*(1-e); rz = 0.95*(1-e);
  }
  return { tx, ty, tz, rx, ry, rz };
}
function shotgunReloadTransform(p){
  const ease = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  let pivotRot = 0;
  const shellStates = [];
  const OPEN_END = 0.22, CLOSE_START = 0.78;
  const loadWinStart = OPEN_END, loadWinEnd = CLOSE_START;
  const totalWin = loadWinEnd - loadWinStart;
  const perShellStep = totalWin / SHELL_COUNT;
  const flyDur = perShellStep * 1.15;
  if (p < OPEN_END) {
    pivotRot = -0.95 * ease(p / OPEN_END);
    for (let i = 0; i < SHELL_COUNT; i++) shellStates.push({ state: 'hidden', t: 0 });
  } else if (p < CLOSE_START) {
    pivotRot = -0.95;
    for (let i = 0; i < SHELL_COUNT; i++) {
      const ss = loadWinStart + i * perShellStep;
      const se = ss + flyDur;
      if (p < ss) shellStates.push({ state: 'hidden', t: 0 });
      else if (p < se) shellStates.push({ state: 'flying', t: (p - ss) / flyDur });
      else shellStates.push({ state: 'loaded', t: 1 });
    }
  } else {
    pivotRot = -0.95 * (1 - ease((p - CLOSE_START) / (1 - CLOSE_START)));
    for (let i = 0; i < SHELL_COUNT; i++) shellStates.push({ state: 'loaded', t: 1 });
  }
  return { pivotRot, shellStates };
}
function rifleReloadTransform(p){
  const ease = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  let tilt = 0, magY = 0, magRotX = 0, magVisible = true;
  if (p < 0.12) {
    tilt = 0.28 * ease(p / 0.12);
  } else if (p < 0.32) {
    tilt = 0.28;
    const t = (p - 0.12) / 0.20;
    magY = -0.85 * t;
    magRotX = 1.2 * t;
    magVisible = t < 0.98;
  } else if (p < 0.42) {
    tilt = 0.28; magVisible = false;
  } else if (p < 0.72) {
    tilt = 0.28;
    const t = (p - 0.42) / 0.30;
    const e = t * t;
    magY = -0.85 * (1 - e);
    magRotX = 0;
    magVisible = true;
  } else if (p < 0.82) {
    tilt = 0.28;
    const t = (p - 0.72) / 0.10;
    magY = -0.03 * Math.sin(t * Math.PI);
    magVisible = true;
  } else {
    const e = ease((p - 0.82) / 0.18);
    tilt = 0.28 * (1 - e);
    magVisible = true;
  }
  return { tilt, magY, magRotX, magVisible };
}
function rpgReloadTransform(p){
  const ease = t => t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2;
  const basePos = { x: 0.28, y: -0.24, z: -1.05 };
  const baseRotX = 0;
  const groundPos = { x: 0.28, y: -0.62, z: -0.70 };
  const groundRotX = 1.75;
  let pos = { x: basePos.x, y: basePos.y, z: basePos.z };
  let rotX = baseRotX;
  let rocketState = 'hidden';
  let rocketT = 0;
  const LOWER_END  = 0.30;
  const HIDDEN_END = 0.42;
  const FLY_END    = 0.85;
  if (p < LOWER_END) {
    const e = ease(p / LOWER_END);
    pos.y = basePos.y + (groundPos.y - basePos.y) * e;
    pos.z = basePos.z + (groundPos.z - basePos.z) * e;
    rotX = groundRotX * e;
    rocketState = 'hidden';
  } else if (p < HIDDEN_END) {
    pos.y = groundPos.y; pos.z = groundPos.z;
    rotX = groundRotX;
    rocketState = 'hidden';
  } else if (p < FLY_END) {
    pos.y = groundPos.y; pos.z = groundPos.z;
    rotX = groundRotX;
    rocketState = 'flying';
    rocketT = (p - HIDDEN_END) / (FLY_END - HIDDEN_END);
  } else {
    const e = ease((p - FLY_END) / (1 - FLY_END));
    pos.y = groundPos.y + (basePos.y - groundPos.y) * e;
    pos.z = groundPos.z + (basePos.z - groundPos.z) * e;
    rotX = groundRotX * (1 - e);
    rocketState = 'loaded';
  }
  return { pos, rotX, rocketState, rocketT };
}


function animateWeaponModel(dt){
  pistolGroup.visible = (currentWeapon === 'pistol');
  shotgunGroup.visible = (currentWeapon === 'shotgun');
  rifleGroup.visible = (currentWeapon === 'rifle');
  rpgGroup.visible = (currentWeapon === 'rpg');


  pistolGroup.position.set(0,0,0);
  pistolGroup.rotation.set(0,0,0);
  rifleGroup.position.set(0,0,0);
  rifleGroup.rotation.set(0,0,0);


  if (reloading) {
    const prog = 1 - reloadTimer / reloadDuration;


    if (currentWeapon === 'pistol') {
      const t = pistolReloadTransform(prog);
      pistolGroup.position.set(t.tx, t.ty, t.tz);
      pistolGroup.rotation.set(t.rx, t.ry, t.rz);


    } else if (currentWeapon === 'shotgun') {
      const t = shotgunReloadTransform(prog);
      sBarrelPivot.rotation.x = t.pivotRot;
      for (let i = 0; i < SHELL_COUNT; i++) {
        const sh = sShells[i];
        const st = t.shellStates[i];
        if (st.state === 'hidden') sh.visible = false;
        else if (st.state === 'flying') {
          sh.visible = true;
          const e = 1 - Math.pow(1 - st.t, 3);
          const start = sh.userData.flyStart;
          const end   = sh.userData.loadedPos;
          sh.position.x = start.x + (end.x - start.x) * e;
          sh.position.z = start.z + (end.z - start.z) * e;
          const arcLift = Math.sin(st.t * Math.PI) * 0.10;
          sh.position.y = start.y + (end.y - start.y) * e + arcLift;
        } else {
          sh.visible = true;
          sh.position.copy(sh.userData.loadedPos);
        }
      }


    } else if (currentWeapon === 'rifle') {
      const t = rifleReloadTransform(prog);
      rifleGroup.rotation.x = -t.tilt;
      rifleGroup.position.y = -t.tilt * 0.15;
      akMagGroup.visible = t.magVisible;
      akMagGroup.position.y = -0.42 + t.magY;
      akMagGroup.rotation.x = t.magRotX;


    } else if (currentWeapon === 'rpg') {
      const t = rpgReloadTransform(prog);
      rpgShell.position.set(t.pos.x, t.pos.y, t.pos.z);
      rpgShell.rotation.x = t.rotX;


      if (t.rocketState === 'hidden') {
        rpgRocketGroup.visible = false;
      } else if (t.rocketState === 'flying') {
        rpgRocketGroup.visible = true;
        const e = 1 - Math.pow(1 - t.rocketT, 3);
        const start = rpgRocketGroup.userData.flyStart;
        const end   = rpgRocketGroup.userData.loadedPos;
        rpgRocketGroup.position.set(
          start.x + (end.x - start.x) * e,
          start.y + (end.y - start.y) * e,
          start.z + (end.z - start.z) * e
        );
      } else {
        rpgRocketGroup.visible = true;
        rpgRocketGroup.position.copy(rpgRocketGroup.userData.loadedPos);
      }
    }
  } else {
    sBarrelPivot.rotation.x = 0;
    for (let i = 0; i < SHELL_COUNT; i++) {
      sShells[i].visible = false;
      sShells[i].position.copy(sShells[i].userData.flyStart);
    }
    akMagGroup.visible = true;
    akMagGroup.position.y = -0.42;
    akMagGroup.rotation.x = 0;
    rifleGroup.rotation.x = 0;
    rpgShell.position.set(0.28, -0.24, -1.05);
    rpgShell.rotation.x = 0;
    rpgRocketGroup.visible = (ammo.rpg > 0);
    rpgRocketGroup.position.copy(rpgRocketGroup.userData.loadedPos);
  }
}

function shoot(){
  const w = WEAPONS[currentWeapon];
  applyRecoilImpulse(w);
  muzzleLight.intensity = w.muzzleFlash;
  camera.getWorldDirection(_rayDir);
  const muzzleWorld = getActiveMuzzle();


  if (w.explosive && currentWeapon === 'rpg') {
    rpgLoaded = false;
    rpgRocketGroup.visible = false;


    const projGroup = new THREE.Group();
    const rocketClone = rpgRocketGroup.clone();
    rocketClone.rotation.y = Math.PI;
    projGroup.add(rocketClone);


    projGroup.position.copy(muzzleWorld);
    _tmpQ.setFromUnitVectors(_upZ, _rayDir);
    projGroup.quaternion.copy(_tmpQ);


    scene.add(projGroup);


    bullets.push({
      mesh: projGroup,
      vel: _rayDir.clone().multiplyScalar(w.bulletSpeed),
      life: 4.0,
      prevPos: projGroup.position.clone(),
      damage: 0,
      explosive: true,
      blastRadius: w.blastRadius,
      blastDamage: w.blastDamage,
      isRocket: true
    });


    for (let i = 0; i < 20; i++) {
      const mat = MAT.sparkMats[(Math.random()*MAT.sparkMats.length)|0];
      const m = new THREE.Mesh(GEO.spark, mat);
      m.position.copy(muzzleWorld);
      const v = _tmpV2.copy(_rayDir);
      v.x += (Math.random()-0.5)*0.9;
      v.y += (Math.random()-0.5)*0.9;
      v.z += (Math.random()-0.5)*0.9;
      v.normalize().multiplyScalar(6 + Math.random()*8);
      m.scale.setScalar(1.5);
      scene.add(m);
      sparks.push({ mesh: m, vel: v.clone(), life: 0.35 + Math.random()*0.25 });
    }


    if (isTouchDevice && navigator.vibrate) navigator.vibrate(45);
    return;
  }


  for (let i = 0; i < w.pellets; i++) {
    const dir = new THREE.Vector3().copy(_rayDir);
    if (w.pellets > 1 || w.spread > 0) {
      dir.x += (Math.random() - 0.5) * w.spread * 2;
      dir.y += (Math.random() - 0.5) * w.spread * 2;
      dir.z += (Math.random() - 0.5) * w.spread * 2;
      dir.normalize();
    }
    const b = new THREE.Mesh(w.bulletGeo, w.bulletMat);
    b.position.copy(muzzleWorld);
    b.position.addScaledVector(dir, 0.4);
    _tmpQ.setFromUnitVectors(_upZ, dir);
    b.quaternion.copy(_tmpQ);
    scene.add(b);
    bullets.push({
      mesh: b, vel: dir.clone().multiplyScalar(w.bulletSpeed),
      life: 1.2, prevPos: b.position.clone(),
      damage: w.damage
    });
  }
  spawnMuzzleSparks(muzzleWorld, _rayDir);
  if (isTouchDevice && navigator.vibrate) navigator.vibrate(8);
}

const explosions = [];


function explodeAt(pos, radius, damage){
  const allArrs = [zombies, vampires, rainbows, generals];
  for (const arr of allArrs) {
    for (let i = arr.length - 1; i >= 0; i--) {
      const e = arr[i];
      if (!e.alive) continue;
      const d = e.group.position.distanceTo(pos);
      if (d < radius) {
        const falloff = 1 - d / radius;
        const dmg = damage * falloff;
        _tmpV3.set(0, 1, 0);
        damageEnemy(e, dmg, e.group.position.clone().setY(e.group.position.y + 1), _tmpV3);
      }
    }
  }


  const mesh = new THREE.Mesh(GEO.expSphere, MAT.explosionMid.clone());
  mesh.position.copy(pos);
  mesh.scale.setScalar(0.5);
  scene.add(mesh);


  const light = new THREE.PointLight(0xffaa33, 8, radius * 2, 2);
  light.position.copy(pos);
  scene.add(light);


  explosions.push({ pos: pos.clone(), age: 0, maxAge: 0.55, radius, mesh, light });


  for (let i = 0; i < 30; i++) {
    const mat = MAT.sparkMats[(Math.random()*MAT.sparkMats.length)|0];
    const m = new THREE.Mesh(GEO.spark, mat);
    m.position.copy(pos);
    const a = Math.random()*Math.PI*2;
    const up = Math.random()*Math.PI - Math.PI/2;
    const sp = 8 + Math.random()*10;
    m.scale.setScalar(1.5);
    scene.add(m);
    sparks.push({
      mesh: m,
      vel: new THREE.Vector3(
        Math.cos(a)*Math.cos(up)*sp,
        Math.sin(up)*sp + 3,
        Math.sin(a)*Math.cos(up)*sp
      ),
      life: 0.4 + Math.random()*0.3
    });
  }


  camRecoil.pitchVel += 2.5;
  camRecoil.yawVel += (Math.random() - 0.5) * 1.5;
}


function updateExplosions(dt){
  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.age += dt;
    const t = ex.age / ex.maxAge;
    if (t >= 1) {
      scene.remove(ex.mesh);
      scene.remove(ex.light);
      explosions.splice(i, 1);
      continue;
    }
    const r = ex.radius * (0.6 + t * 0.6);
    ex.mesh.scale.setScalar(r);
    ex.mesh.material.opacity = (1 - t) * 0.85;
    ex.light.intensity = 8 * (1 - t);
  }
}

function spawnEdgePos(){
  const p = playerRig.position;
  let bx = 0, bz = 0, bd = -1;
  for (let i = 0; i < 8; i++) {
    const a = Math.random()*Math.PI*2;
    const r = ARENA - 3;
    const cx = Math.cos(a)*r, cz = Math.sin(a)*r;
    const d = (cx - p.x)*(cx - p.x) + (cz - p.z)*(cz - p.z);
    if (d > bd) { bd = d; bx = cx; bz = cz; }
  }
  return _tmpV1.set(bx, 0, bz);
}

function spawnBloodBurst(worldPos, count, force){
  for(let i = 0; i < count; i++){
    const mat = MAT.bloodMats[(Math.random()*MAT.bloodMats.length)|0];
    const size = 0.04 + Math.random()*0.11;
    const m = new THREE.Mesh(GEO.bloodDrop, mat);
    m.scale.setScalar(size); m.position.copy(worldPos);
    const a = Math.random()*Math.PI*2;
    const up = Math.random()*0.9 - 0.15;
    const speed = force * (0.6 + Math.random()*0.9);
    const dir = _tmpV2.set(
      Math.cos(a)*(1 - Math.abs(up)*0.6),
      up + 0.35,
      Math.sin(a)*(1 - Math.abs(up)*0.6)
    ).normalize();
    scene.add(m);
    bloodDrops.push({ mesh: m, vel: dir.clone().multiplyScalar(speed), life: 4 + Math.random()*2, size, poolChance: 0.45 });
  }
}
function spawnBloodStreamDrop(worldPos){
  const mat = MAT.bloodMats[(Math.random()*MAT.bloodMats.length)|0];
  const size = 0.035 + Math.random()*0.05;
  const m = new THREE.Mesh(GEO.bloodDrop, mat);
  m.scale.setScalar(size); m.position.copy(worldPos);
  const vel = new THREE.Vector3((Math.random()-0.5)*0.8, -0.5 - Math.random()*0.8, (Math.random()-0.5)*0.8);
  scene.add(m);
  bloodDrops.push({ mesh: m, vel, life: 5, size, poolChance: 0.8 });
}
function addBloodPool(x, z, size){
  if (bloodPools.length >= 120) { const old = bloodPools.shift(); scene.remove(old.mesh); }
  const geo = BLOOD_POOL_GEOS[(Math.random()*BLOOD_POOL_GEOS.length)|0];
  const mat = BLOOD_POOL_MATS[(Math.random()*BLOOD_POOL_MATS.length)|0];
  const m = new THREE.Mesh(geo, mat);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = Math.random()*Math.PI*2;
  m.scale.setScalar(size);
  m.position.set(x, 0.018 + Math.random()*0.012, z);
  scene.add(m);
  bloodPools.push({ mesh: m, life: 35 + Math.random()*25, baseScale: size });
}
function updateBlood(dt){
  for (let i = bloodDrops.length - 1; i >= 0; i--) {
    const d = bloodDrops[i];
    d.vel.y -= 20 * dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    d.life -= dt;
    if (d.mesh.position.y <= d.size * 0.5) {
      if (Math.random() < d.poolChance) {
        const px = d.mesh.position.x, pz = d.mesh.position.z;
        if (Math.abs(px) < ARENA - 1 && Math.abs(pz) < ARENA - 1)
          addBloodPool(px, pz, d.size * (5 + Math.random()*6));
      }
      scene.remove(d.mesh); bloodDrops.splice(i, 1); continue;
    }
    if (Math.abs(d.mesh.position.x) > ARENA || Math.abs(d.mesh.position.z) > ARENA || d.life <= 0) {
      scene.remove(d.mesh); bloodDrops.splice(i, 1);
    }
  }
  for (let i = bloodPools.length - 1; i >= 0; i--) {
    const p = bloodPools[i];
    p.life -= dt;
    if (p.life <= 0) { scene.remove(p.mesh); bloodPools.splice(i, 1); }
    else if (p.life < 8) p.mesh.scale.setScalar(p.baseScale * Math.max(0.4, p.life/8));
  }
}


function spawnMuzzleSparks(worldPos, dir){
  for (let i = 0; i < 8; i++) {
    const mat = MAT.sparkMats[(Math.random()*MAT.sparkMats.length)|0];
    const m = new THREE.Mesh(GEO.spark, mat);
    m.position.copy(worldPos);
    const v = _tmpV2.copy(dir);
    v.x += (Math.random()-0.5)*0.55;
    v.y += (Math.random()-0.5)*0.55;
    v.z += (Math.random()-0.5)*0.55;
    v.normalize().multiplyScalar(7 + Math.random()*6);
    scene.add(m);
    sparks.push({ mesh: m, vel: v.clone(), life: 0.14 + Math.random()*0.14 });
  }
}
function updateSparks(dt){

  }
}

const joy = { active: false, id: null, dx: 0, dy: 0 };
const JOY_MAX = 42;
function joyMove(x, y){
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  let dx = x - cx, dy = y - cy;
  const len = Math.hypot(dx, dy);
  if (len > JOY_MAX){ dx = dx/len*JOY_MAX; dy = dy/len*JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyEnd(){ joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0; joyKnob.style.transform = 'translate(-50%,-50%)'; }
joyBase.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); const t = e.changedTouches[0]; joy.active = true; joy.id = t.identifier; joyMove(t.clientX, t.clientY); }, { passive: false });
joyBase.addEventListener('touchmove', e => { e.preventDefault(); e.stopPropagation(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyMove(t.clientX, t.clientY); break; } } }, { passive: false });
joyBase.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyEnd(); break; } } }, { passive: false });
joyBase.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); }, { passive: false });


const aimTouches = new Map();
const AIM_SENS = 0.0058;
lookLayer.addEventListener('touchstart', e => {
  for(const t of e.changedTouches) aimTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
}, { passive: true });

  }
}, { passive: true });

function updateBullets(dt){
  const targets = [];
  for (const z of zombies) if (z.alive) targets.push(z.group);
  for (const v of vampires) if (v.alive) targets.push(v.group);
  for (const r of rainbows) if (r.alive) targets.push(r.group);
  for (const g of generals) if (g.alive) targets.push(g.group);


  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.prevPos.copy(b.mesh.position);
    b.mesh.position.addScaledVector(b.vel, dt);
    b.life -= dt;


    const segX = b.mesh.position.x - b.prevPos.x;
    const segY = b.mesh.position.y - b.prevPos.y;
    const segZ = b.mesh.position.z - b.prevPos.z;
    const segLen = Math.sqrt(segX*segX + segY*segY + segZ*segZ);
    let hit = null;
    if (segLen > 0.0001 && targets.length) {
      _tmpV2.set(segX / segLen, segY / segLen, segZ / segLen);
      raycaster.set(b.prevPos, _tmpV2);
      raycaster.far = segLen;
      const hits = raycaster.intersectObjects(targets, true);
      raycaster.far = Infinity;
      if (hits.length) hit = hits[0];
    }


    if (hit) {
      if (b.explosive) {
        explodeAt(b.mesh.position, b.blastRadius, b.blastDamage);
      } else {
        let root = hit.object;
        while (root.parent && !root.userData.isEnemyRoot) root = root.parent;
        for (const arr of [zombies, vampires, rainbows, generals]) {
          const e = arr.find(x => x.group === root);
          if (e) {
            _tmpV3.copy(b.vel).normalize();
            damageEnemy(e, b.damage, hit.point, _tmpV3);
            break;
          }
        }
      }
      scene.remove(b.mesh); bullets.splice(i, 1); continue;
    }


    const p = b.mesh.position;
    const outOfBounds = (b.life <= 0 || Math.abs(p.x) > ARENA || Math.abs(p.z) > ARENA || p.y > 12);
    const hitGround = (p.y < 0.15);
    if (outOfBounds || hitGround) {
      if (b.explosive && hitGround) {
        explodeAt(p.clone().setY(0.15), b.blastRadius, b.blastDamage);
      } else if (b.explosive && outOfBounds) {
        explodeAt(p.clone(), b.blastRadius, b.blastDamage);
      }
      scene.remove(b.mesh); bullets.splice(i, 1);
    }
  }
}


function damageEnemy(e, dmg, hitPoint, bulletDir){
  e.hp -= dmg;
  spawnBloodBurst(hitPoint, 8, 4 + Math.random()*2);
  for (let i = 0; i < 4; i++) {
    const mat = MAT.bloodMats[(Math.random()*MAT.bloodMats.length)|0];
    const size = 0.05 + Math.random()*0.09;
    const m = new THREE.Mesh(GEO.bloodDrop, mat);
    m.scale.setScalar(size); m.position.copy(hitPoint);
    const v = bulletDir.clone();
    v.x += (Math.random()-0.5)*0.7;
    v.y += (Math.random()-0.2)*0.7;
    v.z += (Math.random()-0.5)*0.7;
    v.normalize().multiplyScalar(6 + Math.random()*5);
    scene.add(m);
    bloodDrops.push({ mesh: m, vel: v, life: 4, size, poolChance: 0.5 });
  }
  if (e.hp <= 0 && e.alive) {
    e.alive = false;
    _tmpV3.copy(e.group.position); _tmpV3.y += 1.1;
    spawnBloodBurst(_tmpV3, 20, 8);
    addBloodPool(e.group.position.x, e.group.position.z, 1.1 + Math.random()*0.7);
    scene.remove(e.group);
    if (e.kind === 'zombie')   { zScore++; document.getElementById('zScore').textContent = zScore; }
    if (e.kind === 'vampire')  { vScore++; document.getElementById('vScore').textContent = vScore; }
    if (e.kind === 'rainbow')  { rScore++; document.getElementById('rScore').textContent = rScore; }
    if (e.kind === 'general')  { gScore++; document.getElementById('gScore').textContent = gScore; }
  } else {
    e.bleedTimer = Math.max(e.bleedTimer, 1.5);
    e.bleedAccum = 0;
    e.woundLocal.set(0, Math.max(0.6, hitPoint.y - e.group.position.y), 0);
  }
}

    `Всего убито: <b>${total}</b>`;
  document.getElementById('gameOver').classList.add('show');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('weaponName').style.display = 'none';
  document.getElementById('crosshair').style.display = 'none';
}


document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('gameOver').classList.remove('show');
  document.getElementById('menu').classList.remove('hidden');
});


function animateEnemyModel(e, time){
  const g = e.group;
  const phase = g.userData.animPhase || 0;
  if (g.userData.earL && g.userData.earR) {
    const wig = Math.sin(time * 3 + phase) * 0.15;
    g.userData.earL.rotation.z = 0.38 + wig;
    g.userData.earR.rotation.z = -0.38 + wig;
  }
  if (g.userData.tailParts) {
    const tp = g.userData.tailParts;
    for (let i = 0; i < tp.length; i++) {
      tp[i].position.x = Math.sin(time * 4 + phase + i * 0.6) * 0.06 * (i + 1);
    }
  }
}


let rainbowHue = 0;
function updateRainbowColor(dt){
  rainbowHue = (rainbowHue + dt * 90) % 360;
  const h = rainbowHue / 360;
  MAT.rainbow.color.setHSL(h, 0.9, 0.6);
  MAT.rainbow.emissive.setHSL(h, 0.9, 0.4);
  MAT.rainbowMouth.color.setHSL(h, 0.9, 0.6);
  MAT.rainbowMouth.emissive.setHSL(h, 0.9, 0.4);
  MAT.rainbowRing.color.setHSL(((rainbowHue + 120) % 360) / 360, 1, 0.55);
}


const clock = new THREE.Clock();
let animTime = 0;


function updatePlayer(dt){
  if (invulnTimer > 0) invulnTimer -= dt;
  if (weaponSwitchCd > 0) weaponSwitchCd -= dt;


  updateRecoil(dt);


  playerRig.rotation.y = yaw + camRecoil.yaw;
  camera.rotation.x    = pitch + camRecoil.pitch;


  const forward = _tmpV1.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = _tmpV2.set(-forward.z, 0, forward.x);
  let mx = 0, mz = 0;
  if (keys['w']||keys['ц']||keys['arrowup'])    { mx += forward.x; mz += forward.z; }
  if (keys['s']||keys['ы']||keys['arrowdown'])  { mx -= forward.x; mz -= forward.z; }
  if (keys['d']||keys['в']||keys['arrowright']) { mx += right.x;   mz += right.z; }
  if (keys['a']||keys['ф']||keys['arrowleft'])  { mx -= right.x;   mz -= right.z; }
  if (joy.active) {
    mx += forward.x * -joy.dy + right.x * joy.dx;
    mz += forward.z * -joy.dy + right.z * joy.dx;
  }
  const moveLen = Math.hypot(mx, mz);
  if (moveLen > 0.001) {
    const k = Math.min(moveLen, 1) / moveLen;
    playerRig.position.x += mx * 5.2 * dt * k;
    playerRig.position.z += mz * 5.2 * dt * k;
  }


  if (keys[' '] && onGround) { velocityY = JUMP_SPEED; onGround = false; }
  velocityY += GRAVITY * dt;
  playerRig.position.y += velocityY * dt;
  if (playerRig.position.y <= 1.7) { playerRig.position.y = 1.7; velocityY = 0; onGround = true; }


  const lim = ARENA - 1.5;
  playerRig.position.x = Math.max(-lim, Math.min(lim, playerRig.position.x));
  playerRig.position.z = Math.max(-lim, Math.min(lim, playerRig.position.z));


  if (moveLen > 0.001 && onGround) weaponBobT += dt * 9;
  const bobY = Math.sin(weaponBobT) * 0.012;
  const bobX = Math.cos(weaponBobT*0.5) * 0.008;


  weaponGroup.position.set(
    bobX + wpnRecoil.side * 0.04,
    bobY - wpnRecoil.up * 0.05,
    wpnRecoil.back
  );
  weaponGroup.rotation.set(wpnRecoil.up, 0, wpnRecoil.side);


  muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt*18);


  if (reloading) {
    reloadTimer -= dt;
    if (reloadTimer <= 0) {
      reloading = false;
      ammo[currentWeapon] = WEAPONS[currentWeapon].maxAmmo;
      if (currentWeapon === 'rpg') rpgLoaded = true;
      updateWeaponHUD();
      document.getElementById('reloadHint').style.display = 'none';
      if (reloadBtnTouch) reloadBtnTouch.classList.remove('cooling');
    }
  }


  fireCooldown -= dt;
  const w = WEAPONS[currentWeapon];
  if (mouseDown && !reloading && (pointerLocked || isTouchDevice) && fireCooldown <= 0) {
    if (ammo[currentWeapon] > 0) {
      shoot();
      ammo[currentWeapon]--;
      updateWeaponHUD();
      fireCooldown = w.fireRate;
      if (ammo[currentWeapon] <= 0) startReload();
    } else {
      startReload();
    }
  }


  animateWeaponModel(dt);
}


function updateEnemies(dt){
  const p = playerRig.position;


  const processEnemy = (e, onAttack, extra) => {
    if (!e.alive) return;
    const pos = e.group.position;
    const dx = p.x - pos.x, dz = p.z - pos.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist > 1.1) {
      const inv = 1 / dist;
      pos.x += dx * inv * e.speed * dt;
      pos.z += dz * inv * e.speed * dt;
      e.group.rotation.y = Math.atan2(dx, dz);
    } else {
      onAttack();
    }
    if (extra) extra(e, dist);
    if (e.bleedTimer > 0) {
      e.bleedTimer -= dt;
      e.bleedAccum += dt;
      e.group.updateMatrixWorld();
      const step = (e.kind === 'general' || e.kind === 'vampire') ? 0.05 : 0.045;
      while (e.bleedAccum > step) {
        e.bleedAccum -= step;
        const wp = _tmpV1.copy(e.woundLocal);
        e.group.localToWorld(wp);
        spawnBloodStreamDrop(wp);
      }
    }
    animateEnemyModel(e, animTime);
  };


  for (const z of zombies)  processEnemy(z, () => damagePlayer(15));
  for (const r of rainbows) processEnemy(r, () => damagePlayer(15));
  for (const v of vampires) processEnemy(v, () => damagePlayer(10), (e, d) => {
    e.fireCd -= dt;
    if (e.fireCd <= 0 && d < 28) { fireVampireBullet(e); e.fireCd = 1.6 + Math.random(); }
  });
  for (const g of generals) processEnemy(g, () => damagePlayer(20), (e, d) => {
    e.fireCd -= dt;
    if (e.fireCd <= 0 && d < 40) { fireGeneralBullet(e); e.fireCd = 1.2 + Math.random()*0.6; }
  });


  zombies = zombies.filter(e => e.alive);
  vampires = vampires.filter(e => e.alive);
  rainbows = rainbows.filter(e => e.alive);
  generals = generals.filter(e => e.alive);


  const stepProj = (arr, dmg) => {
    for (let i = arr.length - 1; i >= 0; i--) {
      const pr = arr[i];
      pr.mesh.position.addScaledVector(pr.vel, dt);
      pr.life -= dt;
      const tgt = _tmpV1.copy(p); tgt.y += 1.4;
      const dd = pr.mesh.position.distanceToSquared(tgt);
      if (dd < 0.64) { damagePlayer(dmg); scene.remove(pr.mesh); arr.splice(i,1); continue; }
      if (pr.life <= 0) { scene.remove(pr.mesh); arr.splice(i,1); }
    }
  };
  stepProj(vampProjectiles, 8);
  stepProj(genProjectiles, 12);
}


function updatePickups(dt){
  const p = playerRig.position;
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    pk.t += dt;
    pk.group.position.y = 1 + Math.sin(pk.t*2)*0.15;
    pk.group.rotation.y += dt*1.2;
    if (pk.group.position.distanceToSquared(p) < 1.96) {
      hp = Math.min(maxHp, hp + 35);
      updateHpUI();
      scene.remove(pk.group);
      pickups.splice(i,1);
    }
  }
}


function updateSpawning(dt){
  zSpawnTimer += dt;
  if (zSpawnTimer >= zSpawnInterval) { zSpawnTimer = 0; spawnZombie(); if (zSpawnInterval > 0.7) zSpawnInterval -= 0.03; }
  vSpawnTimer += dt;
  if (vSpawnTimer >= vSpawnInterval) { vSpawnTimer = 0; spawnVampire(); if (vSpawnInterval > 4) vSpawnInterval -= 0.15; }
  rSpawnTimer += dt;
  if (rSpawnTimer >= rSpawnInterval) { rSpawnTimer = 0; spawnRainbow(); if (rSpawnInterval > 7) rSpawnInterval -= 0.2; }
  gSpawnTimer += dt;
  if (gSpawnTimer >= gSpawnInterval) { gSpawnTimer = 0; spawnGeneral(); if (gSpawnInterval > 18) gSpawnInterval -= 0.5; }
  pickupTimer += dt;
  if (pickupTimer >= pickupInterval) { pickupTimer = 0; spawnPickup(); }
}


function updateEnemyLights(){
  const all = [];
  for (const z of zombies)  all.push(z);
  for (const v of vampires) all.push(v);
  for (const r of rainbows) all.push(r);
  for (const g of generals) all.push(g);
  if (all.length > 1) {
    all.sort((a, b) =>
      a.group.position.distanceToSquared(playerRig.position) -
      b.group.position.distanceToSquared(playerRig.position)
    );
  }
  for (let i = 0; i < MAX_ENEMY_LIGHTS; i++) {
    const l = enemyLightPool[i];
    if (i < all.length) {
      const e = all[i];
      l.position.copy(e.group.position);
      l.position.y += e.glowY;
      l.color.setHex(e.glowColor);
      l.intensity = e.glowIntensity;
      l.distance = e.glowRange;
    } else {
      l.intensity = 0;
    }
  }
}


function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  animTime += dt;
  if (gameActive) {
    updateRainbowColor(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateSparks(dt);
    updateBlood(dt);
    updateExplosions(dt);
    updatePickups(dt);
    updateSpawning(dt);
    updateEnemyLights();
  }
  renderer.render(scene, camera);
}


document.getElementById('hpNum').textContent = hp;
updateWeaponHUD();
animate();
</script>
