<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Angry Soviet</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#1a1a1a;font-family:Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;}
canvas{display:block;}
#menu{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow-y:auto;padding:20px 10px;transition:opacity 0.5s;}
#menu.hidden{opacity:0;pointer-events:none;}
#menuCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
#menuContent{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px;max-width:520px;width:100%;}
#menuTitle{font-family:'Arial Black',Arial,sans-serif;font-size:clamp(24px,9vw,72px);font-weight:900;letter-spacing:clamp(1px,0.6vw,5px);color:#c10000;text-shadow:0 0 20px #ff0000,0 0 40px #8b0000,0 0 80px #500000,4px 4px 0 #000,-2px -2px 0 #3a0000;margin:0;padding:0 10px;text-align:center;line-height:1.1;word-break:keep-all;animation:titlePulse 2.5s ease-in-out infinite;user-select:none;max-width:100%;}
@keyframes titlePulse{0%,100%{text-shadow:0 0 20px #ff0000,0 0 40px #8b0000,0 0 80px #500000,4px 4px 0 #000,-2px -2px 0 #3a0000;}50%{text-shadow:0 0 30px #ff2222,0 0 60px #b00000,0 0 100px #700000,4px 4px 0 #000,-2px -2px 0 #3a0000;}}
#playBtn{font-family:'Arial Black',Arial,sans-serif;font-size:clamp(18px,2.6vw,28px);font-weight:900;letter-spacing:4px;padding:16px 55px;color:#fff;background:#8b0000;border:3px solid #ff2a2a;border-radius:10px;cursor:pointer;text-shadow:2px 2px 0 #000;box-shadow:0 0 20px #ff0000,inset 0 0 20px rgba(0,0,0,0.5);transition:transform 0.15s,background 0.15s,box-shadow 0.15s;}
#playBtn:hover{background:#c10000;transform:scale(1.06);box-shadow:0 0 35px #ff2222,inset 0 0 25px rgba(0,0,0,0.6);}
#playBtn:active{transform:scale(0.97);}
#menuStats{position:relative;z-index:2;color:#eee;font-family:Arial,sans-serif;font-size:clamp(13px,1.5vw,17px);text-shadow:1px 1px 3px #000,0 0 10px #500;text-align:center;line-height:1.55;user-select:none;}
#menuStats b{color:#ff5252;font-size:1.15em;}


#settingsPanel,#progressPanel{position:relative;z-index:2;background:rgba(20,0,0,0.78);border:2px solid #5a0000;border-radius:10px;padding:12px 18px;color:#eee;font-family:Arial,sans-serif;font-size:13px;text-shadow:1px 1px 2px #000;width:100%;box-sizing:border-box;text-align:left;box-shadow:0 0 15px rgba(180,0,0,0.35);}
.sTitle{font-family:'Arial Black',Arial,sans-serif;font-size:15px;letter-spacing:3px;color:#ff3a3a;text-align:center;margin-bottom:10px;text-shadow:0 0 8px #ff0000,2px 2px 0 #000;}
.sRow{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;user-select:none;}
.sRow input[type="checkbox"]{width:16px;height:16px;accent-color:#c10000;cursor:pointer;flex-shrink:0;}
.sRow input[type="range"]{flex:1;accent-color:#c10000;cursor:pointer;}
.sRow input[type="range"]:disabled{opacity:0.35;cursor:not-allowed;}
.sRow b{color:#ff5252;min-width:38px;text-align:right;}
.sSection{margin-top:12px;padding-top:8px;border-top:1px solid #3a0000;}
#enemyWarn{display:none;color:#ff4444;font-size:12px;text-align:center;margin-top:6px;font-weight:bold;}
.pRow{display:flex;gap:6px;margin-bottom:6px;}
#progressPanel button{flex:1;font-family:'Arial Black',Arial,sans-serif;font-size:12px;letter-spacing:1px;padding:8px 10px;color:#fff;background:#8b0000;border:2px solid #ff2a2a;border-radius:6px;cursor:pointer;text-shadow:1px 1px 0 #000;transition:transform 0.12s,background 0.12s;}
#progressPanel button:hover:not(:disabled){background:#c10000;transform:scale(1.03);}
#progressPanel button:active:not(:disabled){transform:scale(0.96);}
#progressPanel button:disabled{opacity:0.35;cursor:not-allowed;}
#codeOut{min-height:22px;padding:6px 8px;background:#0a0a0a;color:#7fff7f;border:2px solid #004400;border-radius:6px;font-family:monospace;font-size:11px;word-break:break-all;user-select:all;margin-bottom:6px;display:none;}
#codeOut.show{display:block;}
#codeIn{flex:1;padding:7px 9px;background:#0a0a0a;color:#fff;border:2px solid #5a0000;border-radius:6px;font-size:11px;font-family:monospace;}
#codeIn::placeholder{color:#666;}
#codeMsg{font-size:12px;text-align:center;font-weight:bold;min-height:16px;margin-top:4px;}
#codeMsg.ok{color:#5fff5f;}
#codeMsg.err{color:#ff4444;}


#shopBtn{font-family:'Arial Black',Arial,sans-serif;font-size:14px;letter-spacing:2px;padding:12px 30px;color:#ffcc00;background:rgba(60,30,0,0.9);border:2px solid #ffcc00;border-radius:8px;cursor:pointer;text-shadow:1px 1px 0 #000;transition:transform 0.12s,background 0.12s;width:100%;}
#shopBtn:hover{background:rgba(120,60,0,0.95);transform:scale(1.03);}
#shopBtn:active{transform:scale(0.97);}


#shopOverlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;}
#shopOverlay.show{display:flex;}
#shopBox{background:linear-gradient(180deg,rgba(30,10,10,0.98),rgba(15,5,5,0.98));border:3px solid #5a0000;border-radius:14px;padding:22px;max-width:540px;width:100%;box-shadow:0 0 40px rgba(200,0,0,0.4);}
#shopHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
#shopHeader h2{font-family:'Arial Black',Arial,sans-serif;font-size:22px;letter-spacing:4px;color:#ff3a3a;margin:0;text-shadow:0 0 10px #ff0000,2px 2px 0 #000;}
#shopClose{background:transparent;border:2px solid #5a0000;border-radius:6px;color:#ff5252;font-size:20px;font-weight:bold;width:36px;height:36px;cursor:pointer;transition:background 0.15s;}
#shopClose:hover{background:rgba(120,0,0,0.4);}
#shopItem{display:flex;gap:16px;align-items:center;min-height:150px;}
#shopSprite{width:130px;height:130px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);border-radius:10px;border:2px solid #3a0000;}
#shopInfo{flex:1;text-align:left;}
#shopItemName{font-family:'Arial Black',Arial,sans-serif;font-size:18px;color:#ffcc00;margin:0 0 6px 0;letter-spacing:2px;}
#shopItemDesc{font-size:13px;color:#ccc;line-height:1.45;margin-bottom:8px;}
#shopItemPrice{font-size:14px;color:#ff5252;font-weight:bold;margin-bottom:10px;}
#shopBuy{font-family:'Arial Black',Arial,sans-serif;font-size:13px;letter-spacing:2px;padding:10px 20px;color:#fff;background:#8b0000;border:2px solid #ff2a2a;border-radius:6px;cursor:pointer;text-shadow:1px 1px 0 #000;transition:transform 0.12s,background 0.12s;}
#shopBuy:hover:not(:disabled){background:#c10000;transform:scale(1.04);}
#shopBuy:active:not(:disabled){transform:scale(0.96);}
#shopBuy:disabled{opacity:0.35;cursor:not-allowed;}
#shopNav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;}
#shopNav button{background:#5a0000;border:2px solid #8b0000;border-radius:6px;color:#fff;font-family:'Arial Black',Arial,sans-serif;font-size:14px;padding:8px 16px;cursor:pointer;transition:background 0.15s;}
#shopNav button:hover:not(:disabled){background:#8b0000;}
#shopNav button:disabled{opacity:0.3;cursor:not-allowed;}
#shopIndex{color:#ccc;font-family:'Arial Black',Arial,sans-serif;font-size:13px;letter-spacing:2px;}


#hud{position:fixed;top:10px;left:10px;color:#fff;font-size:16px;text-shadow:1px 1px 2px #000;pointer-events:none;line-height:1.35;z-index:6;}
#hud span{color:#ff5252;font-weight:bold;}
#hud .vamp{color:#cfd8dc;}
#hud .rainbow{color:#e040fb;}
#hud .general{color:#ffffff;}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:30px;text-align:center;text-shadow:2px 2px 4px #000;pointer-events:none;display:none;z-index:7;}
#fireBtn{position:fixed;bottom:25px;right:25px;width:100px;height:100px;border-radius:50%;background:#c62828;color:#fff;font-size:16px;font-weight:bold;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:10;user-select:none;text-shadow:1px 1px 2px #000;}
#fireBtn:active{background:#8e0000;}
#laserBtn{position:fixed;bottom:140px;right:25px;width:90px;height:90px;border-radius:50%;background:#8b0000;color:#fff;font-size:13px;font-weight:bold;border:3px solid #ff2a2a;cursor:pointer;display:none;align-items:center;justify-content:center;text-align:center;touch-action:none;z-index:10;flex-direction:column;line-height:1.15;box-shadow:0 0 15px rgba(255,0,0,0.5);user-select:none;text-shadow:1px 1px 2px #000;}
#laserBtn.show{display:flex;}
#laserBtn:active{background:#5a0000;}
#laserBtn.cooling{background:#333;border-color:#666;color:#888;box-shadow:none;}
#laserBtn.active{background:#ff2a2a;border-color:#fff;box-shadow:0 0 25px #ff0000;}
#laserBtn .cd{font-size:11px;font-weight:normal;opacity:0.85;display:block;margin-top:2px;}
#jucheBtn{position:fixed;bottom:245px;right:25px;width:90px;height:90px;border-radius:50%;background:#003478;color:#fff;font-size:12px;font-weight:bold;border:3px solid #ffd700;cursor:pointer;display:none;align-items:center;justify-content:center;text-align:center;touch-action:none;z-index:10;flex-direction:column;line-height:1.15;box-shadow:0 0 20px rgba(255,215,0,0.6);user-select:none;text-shadow:1px 1px 2px #000;}
#jucheBtn.show{display:flex;}
#jucheBtn:active{background:#001a3d;}
#jucheBtn.used{background:#222;border-color:#444;color:#555;box-shadow:none;}
#joyBase{position:fixed;bottom:30px;left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);border:2px solid rgba(255,255,255,0.2);touch-action:none;z-index:10;}
#joyKnob{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.3);border:2px solid rgba(255,255,255,0.5);transform:translate(-50%,-50%);pointer-events:none;}
#weaponBtns{position:fixed;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:10;}
#weaponBtns button{width:64px;height:52px;border-radius:8px;background:rgba(30,30,30,0.85);color:#fff;font-size:11px;font-weight:bold;border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;text-align:center;padding:0;line-height:1.05;cursor:pointer;}
#weaponBtns button.active{background:#ff9800;color:#000;border-color:#fff;}
#weaponBtns button:active{transform:scale(0.95);}
#damageFlash{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle,transparent 30%,rgba(200,0,0,0.7) 100%);opacity:0;transition:opacity 0.15s;}
#killScreen{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle,transparent 25%,rgba(255,0,0,0.85) 100%);opacity:0;transition:opacity 0.35s;}
#killMsg{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(0.5);color:#ff2a2a;font-size:56px;font-weight:900;text-align:center;text-shadow:0 0 20px #ff0000,0 0 40px #8b0000,4px 4px 0 #000;pointer-events:none;z-index:8;opacity:0;letter-spacing:3px;font-family:Arial Black,Arial,sans-serif;transition:opacity 0.25s,transform 0.3s;}
#killMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1.15);}
#killMsg.small{font-size:38px;color:#ff9800;text-shadow:0 0 15px #ff5722,3px 3px 0 #000;}
#killMsg.big{font-size:72px;color:#ff0000;text-shadow:0 0 25px #ff0000,0 0 50px #8b0000,5px 5px 0 #000;}
#rageScreen{position:fixed;inset:0;pointer-events:none;z-index:9;background:#d10000;opacity:0;transition:opacity 0.3s;}
#rageText{position:fixed;top:50%;left:50%;color:#fff;font-size:130px;font-weight:900;font-family:Arial Black,Arial,sans-serif;text-shadow:0 0 30px #000,0 0 60px #000,6px 6px 0 #000;pointer-events:none;z-index:10;opacity:0;letter-spacing:8px;transition:opacity 0.15s;transform:translate(-50%,-50%) scale(1.3);}
#rageText.show{opacity:1;animation:rageShake 0.08s infinite;}
@keyframes rageShake{0%{transform:translate(-50%,-50%) scale(1.3) rotate(-3deg) translate(-8px,-6px);}25%{transform:translate(-50%,-50%) scale(1.35) rotate(3deg) translate(9px,4px);}50%{transform:translate(-50%,-50%) scale(1.28) rotate(-2deg) translate(-6px,8px);}75%{transform:translate(-50%,-50%) scale(1.33) rotate(2deg) translate(7px,-9px);}100%{transform:translate(-50%,-50%) scale(1.3) rotate(-3deg) translate(-8px,-6px);}}
#rageSides{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:linear-gradient(to right,rgba(200,0,0,0.85) 0%,rgba(200,0,0,0.6) 8%,transparent 22%,transparent 78%,rgba(200,0,0,0.6) 92%,rgba(200,0,0,0.85) 100%);transition:opacity 0.5s;}
#rageTimer{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:bold;font-family:Arial Black,Arial,sans-serif;text-shadow:0 0 10px #ff0000,2px 2px 0 #000;pointer-events:none;z-index:10;opacity:0;letter-spacing:2px;}


#devToggle{
  position:fixed;top:10px;left:50%;
  transform:translateX(-50%);
  z-index:301;
  padding:6px 14px;
  background:rgba(0,20,10,0.9);
  color:#00ff88;
  border:2px solid #00ff88;
  border-radius:6px;
  font-family:monospace;
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 0 12px rgba(0,255,136,0.5);
  transition:all 0.15s;
  display:none;
}
#devToggle.show{display:block;}
#devToggle:hover{background:#00ff88;color:#000;}
#devToggle.on{background:#00ff88;color:#000;box-shadow:0 0 20px #00ff88;}


#devPanel{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  z-index:300;
  background:rgba(10,10,20,0.95);
  border:2px solid #00ff88;
  border-radius:8px;
  padding:14px 16px;
  color:#00ff88;
  font-family:monospace;
  font-size:12px;
  box-shadow:0 0 20px rgba(0,255,136,0.4);
  display:none;
  min-width:280px;
  max-width:340px;
  user-select:none;
}
#devPanel.show{display:block;}
#devPanel h3{
  margin:0 0 10px 0;
  font-size:14px;
  letter-spacing:2px;
  text-align:center;
  color:#00ff88;
  text-shadow:0 0 8px #00ff88;
  border-bottom:1px solid #00ff8855;
  padding-bottom:6px;
}
.devRow{display:flex;gap:6px;margin-bottom:6px;align-items:center;}
.devRow label{flex:1;font-size:11px;}
.devRow input{
  width:70px;padding:3px 5px;
  background:#000;color:#00ff88;
  border:1px solid #00ff88;
  border-radius:4px;
  font-family:monospace;font-size:11px;
}
.devBtn{
  flex:1;
  padding:6px 8px;
  background:transparent;
  color:#00ff88;
  border:1px solid #00ff88;
  border-radius:4px;
  cursor:pointer;
  font-family:monospace;
  font-size:11px;
  font-weight:bold;
  transition:all 0.12s;
}
.devBtn:hover{background:#00ff88;color:#000;}
.devBtn:active{transform:scale(0.96);}
.devBtn.danger{color:#ff4444;border-color:#ff4444;}
.devBtn.danger:hover{background:#ff4444;color:#000;}
.devSection{
  margin-top:10px;padding-top:8px;
  border-top:1px dashed #00ff8855;
  font-size:11px;
  color:#00ff88;
  opacity:0.85;
}
#devStatus{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid #00ff8855;
  font-size:11px;
  color:#00ff88;
  opacity:0.85;
}


@media (max-width: 480px){
  #menuTitle{
    font-size: clamp(24px, 11vw, 44px);
    letter-spacing: 2px;
    line-height: 1.1;
  }
  #menuContent{
    padding: 8px 6px;
    gap: 14px;
  }
  #settingsPanel, #progressPanel{
    padding: 10px 12px;
    font-size: 12px;
  }
  #playBtn{
    font-size: 18px;
    padding: 14px 40px;
    letter-spacing: 3px;
  }
}
@media (max-width: 360px){
  #menuTitle{
    font-size: clamp(20px, 10vw, 34px);
    letter-spacing: 1px;
  }
}
</style>
</head>
<body>
<div id="menu">
  <canvas id="menuCanvas"></canvas>
  <div id="menuContent">
    <h1 id="menuTitle">ANGRY SOVIET</h1>
    <button id="playBtn">ИГРАТЬ</button>
    <div id="menuStats"></div>


    <div id="settingsPanel">
      <div class="sTitle">НАСТРОЙКИ</div>
      <label class="sRow"><input type="checkbox" id="optBlood" checked><span>Кровь и расчленёнка</span></label>
      <label class="sRow"><input type="checkbox" id="optMenuSplats" checked><span>Брызги в меню</span></label>
      <label class="sRow"><input type="checkbox" id="optBloodInfinite"><span>Кровь не исчезает</span></label>
      <label class="sRow"><span>Время жизни крови</span><input type="range" id="optBloodLife" min="0.2" max="3" step="0.1" value="1"><b id="bloodLifeVal">1.0x</b></label>


      <div class="sSection">
        <div class="sTitle" style="font-size:13px;margin-bottom:6px;">ВРАГИ (мин. 2)</div>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="zombie" checked><span>Фурри</span></label>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="vampire" checked><span>Правачки</span></label>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="rainbow" checked><span>Геи</span></label>
        <label class="sRow"><input type="checkbox" class="enemyOpt" data-e="general" checked><span>Генералы СС </span></label>
        <div id="enemyWarn">Нужно минимум 2 типа врагов!</div>
      </div>


      <div class="sSection">
        <div class="sTitle" style="font-size:13px;margin-bottom:6px;">РЕЖИМЫ</div>
        <label class="sRow"><input type="checkbox" id="optRampage" checked><span>RAMPAGE / Сталин</span></label>
        <label class="sRow"><input type="checkbox" id="optHpGrow" checked><span>Рост макс. HP без режима</span></label>
      </div>
    </div>


    <button id="shopBtn">МАГАЗИН</button>


    <div id="progressPanel">
      <div class="sTitle">ПРОГРЕСС</div>
      <div class="pRow">
        <button id="genCode">СОЗДАТЬ КОД</button>
        <button id="copyCode">СКОПИРОВАТЬ</button>
      </div>
      <div id="codeOut"></div>
      <div class="pRow">
        <input type="text" id="codeIn" placeholder="Вставь код сюда...">
        <button id="applyCode">ПРИМЕНИТЬ</button>
      </div>
      <div id="codeMsg"></div>
    </div>
  </div>
</div>


<div id="shopOverlay">
  <div id="shopBox">
    <div id="shopHeader">
      <h2>МАГАЗИН</h2>
      <button id="shopClose">✕</button>
    </div>
    <div id="shopItem">
      <div id="shopSprite"></div>
      <div id="shopInfo">
        <div id="shopItemName">--</div>
        <div id="shopItemDesc">--</div>
        <div id="shopItemPrice">--</div>
        <button id="shopBuy">КУПИТЬ</button>
      </div>
    </div>
    <div id="shopNav">
      <button id="shopPrev">◀</button>
      <span id="shopIndex">1 / 4</span>
      <button id="shopNext">▶</button>
    </div>
  </div>
</div>


<canvas id="c"></canvas>
<div id="rageSides"></div>
<div id="killScreen"></div>
<div id="damageFlash"></div>
<div id="killMsg"></div>
<div id="rageScreen"></div>
<div id="rageText">RAMPAGE</div>
<div id="rageTimer">RAMPAGE: 60</div>
<div id="hud">
  Фурри: <span id="score">0</span><br>
  Правачков: <span class="vamp" id="vampScore">0</span><br>
  Геев: <span class="rainbow" id="rainbowScore">0</span><br>
  Генералов СС: <span class="general" id="generalScore">0</span><br>
  Оружие: <span id="weapon">Пистолет</span><br>
  HP: <span id="hp">100</span>
</div>
<div id="c4Dot"></div>
<div id="msg"></div>
<button id="fireBtn">ОГОНЬ</button>
<button id="laserBtn">ЛАЗЕР<span class="cd" id="laserCd"></span></button>
<button id="jucheBtn">КНДР<span class="cd" id="jucheCd"></span></button>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="weaponBtns">
  <button data-w="pistol" class="active">1<br>Пистолет</button>
  <button data-w="shotgun">2<br>Дробовик</button>
  <button data-w="rifle">3<br>Автомат</button>
  <button data-w="rpg">4<br>РПГ</button>
</div>


<button id="devToggle">DEV</button>
<div id="devPanel">
  <div id="devLock" style="text-align:center;padding:10px 0;">
    <div style="font-size:11px;margin-bottom:8px;opacity:0.8;">Введите пароль:</div>

<script>
// ================== МЕНЮ ==================
const menuEl      = document.getElementById('menu');
const menuCanvas  = document.getElementById('menuCanvas');
const menuCtx     = menuCanvas.getContext('2d');
const playBtn     = document.getElementById('playBtn');
const menuStatsEl = document.getElementById('menuStats');


let sessionScore   = 0;
let sessionVamp    = 0;
let sessionRainbow = 0;
let sessionGeneral = 0;
let sessionKills   = 0;
let sessionBest    = 0;
let gamesPlayed    = 0;


let menuSplats = [];
let menuSplatTimer = 0;


// ================== НАСТРОЙКИ ==================
const settings = {
  blood: true,
  menuSplats: true,
  infiniteBlood: false,
  bloodLife: 1.0,
  enemies: { zombie: true, vampire: true, rainbow: true, general: true },
  rampageEnabled: true,
  hpGrowEnabled: true
};


let c4Owned = false;
let hellShotgunOwned = false;
let laserEyeOwned = false;
let jucheOwned = false;


const optBlood         = document.getElementById('optBlood');
const optMenuSplats    = document.getElementById('optMenuSplats');
const optBloodInfinite = document.getElementById('optBloodInfinite');
const optBloodLife     = document.getElementById('optBloodLife');
const bloodLifeVal     = document.getElementById('bloodLifeVal');
const enemyOpts        = document.querySelectorAll('.enemyOpt');
const enemyWarn        = document.getElementById('enemyWarn');
const optRampage       = document.getElementById('optRampage');
const optHpGrow        = document.getElementById('optHpGrow');


function applySettingsToUI(){
  optBlood.checked = settings.blood;
  optMenuSplats.checked = settings.menuSplats;
  optBloodInfinite.checked = settings.infiniteBlood;
  optBloodLife.value = settings.bloodLife;
  bloodLifeVal.textContent = settings.bloodLife.toFixed(1) + 'x';
  optBloodLife.disabled = settings.infiniteBlood;
  enemyOpts.forEach(o => o.checked = settings.enemies[o.dataset.e]);
  optRampage.checked = settings.rampageEnabled;
  optHpGrow.checked = settings.hpGrowEnabled;
  validateEnemies();
}
function validateEnemies(){
  const count = Object.values(settings.enemies).filter(Boolean).length;
  enemyWarn.style.display = count < 2 ? 'block' : 'none';
  return count >= 2;
}
optBlood.addEventListener('change', () => settings.blood = optBlood.checked);
optMenuSplats.addEventListener('change', () => settings.menuSplats = optMenuSplats.checked);
optBloodInfinite.addEventListener('change', () => {
  settings.infiniteBlood = optBloodInfinite.checked;
  optBloodLife.disabled = settings.infiniteBlood;
});
optBloodLife.addEventListener('input', () => {
  settings.bloodLife = parseFloat(optBloodLife.value);
  bloodLifeVal.textContent = settings.bloodLife.toFixed(1) + 'x';
});
optRampage.addEventListener('change', () => {
  settings.rampageEnabled = optRampage.checked;
});
optHpGrow.addEventListener('change', () => {
  settings.hpGrowEnabled = optHpGrow.checked;
});
enemyOpts.forEach(o => {
  o.addEventListener('change', () => {
    settings.enemies[o.dataset.e] = o.checked;
    const count = Object.values(settings.enemies).filter(Boolean).length;
    if(count < 2){
      o.checked = true;
      settings.enemies[o.dataset.e] = true;
      enemyWarn.style.display = 'block';
      setTimeout(() => validateEnemies(), 1500);
    } else {
      validateEnemies();
    }
  });
});
applySettingsToUI();


function bloodEnabled(){ return settings.blood; }


// ================== МЕНЮ: ФОН ==================
function menuResize(){
  menuCanvas.width  = innerWidth;
  menuCanvas.height = innerHeight;
}
addEventListener('resize', menuResize);
menuResize();


function spawnMenuSplat(){
  if(!settings.menuSplats) return;
  const x = Math.random() * menuCanvas.width;
  const y = Math.random() * menuCanvas.height;
  const size = 20 + Math.random() * 60;
  const drops = [];
  const n = 8 + Math.floor(Math.random()*10);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const d = Math.random()*size;
    drops.push({ x: Math.cos(a)*d, y: Math.sin(a)*d, r: 2 + Math.random()*size*0.35 });
  }
  const decay = settings.infiniteBlood ? 0 : (0.0006 + Math.random()*0.0012) / settings.bloodLife;
  menuSplats.push({ x, y, drops, life: 1.0, decay });
  if(menuSplats.length > 60) menuSplats.shift();
}


function drawMenuBackground(){
  menuCtx.clearRect(0,0,menuCanvas.width,menuCanvas.height);
  menuCtx.fillStyle = '#000';
  menuCtx.fillRect(0,0,menuCanvas.width,menuCanvas.height);


  const g = menuCtx.createRadialGradient(
    menuCanvas.width/2, menuCanvas.height/2, 80,
    menuCanvas.width/2, menuCanvas.height/2, Math.max(menuCanvas.width, menuCanvas.height)
  );
  g.addColorStop(0, 'rgba(60,0,0,0.35)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  menuCtx.fillStyle = g;
  menuCtx.fillRect(0,0,menuCanvas.width,menuCanvas.height);


  if(!settings.menuSplats) return;


  for(const s of menuSplats){
    for(const d of s.drops){
      menuCtx.beginPath();
      menuCtx.arc(s.x + d.x, s.y + d.y, d.r, 0, Math.PI*2);
      menuCtx.fillStyle = `rgba(180, 0, 0, ${0.55 * s.life})`;
      menuCtx.fill();
    }
    menuCtx.beginPath();
    menuCtx.arc(s.x, s.y, 6, 0, Math.PI*2);
    menuCtx.fillStyle = `rgba(120, 0, 0, ${0.75 * s.life})`;
    menuCtx.fill();
  }
}


function menuLoop(){
  if(!menuEl.classList.contains('hidden')){
    menuSplatTimer++;
    if(menuSplatTimer > 35 + Math.random()*40){
      menuSplatTimer = 0;
      spawnMenuSplat();
    }
    for(let i=menuSplats.length-1;i>=0;i--){
      if(menuSplats[i].decay > 0){
        menuSplats[i].life -= menuSplats[i].decay;
        if(menuSplats[i].life <= 0) menuSplats.splice(i,1);
      }
    }
    drawMenuBackground();
  }
  requestAnimationFrame(menuLoop);
}
menuLoop();


// ================== МАГАЗИН ==================

const shopItems = [
  {
    id: 'c4',
    name: 'Детонатор C4',
    desc: 'При смерти игрока уничтожает всех врагов на экране с ударной волной. Активируется автоматически. Тратится за забег.',
    price: C4_PRICE,

  {

  {

    price: JUCHE_PRICE,
    owned: () => jucheOwned,
    buy: () => { jucheOwned = true; }
  }
];
let shopCursor = 0;


function drawC4Sprite(canvasEl){
  const c = document.createElement('canvas');
  c.width = 130; c.height = 130;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.6)';
  x.beginPath(); x.ellipse(65, 116, 46, 8, 0, 0, Math.PI*2); x.fill();
  const bodyGrad = x.createLinearGradient(0, 30, 0, 110);
  bodyGrad.addColorStop(0, '#4a4a4a');
  bodyGrad.addColorStop(0.5, '#2a2a2a');
  bodyGrad.addColorStop(1, '#1a1a1a');
  x.fillStyle = bodyGrad;
  x.beginPath(); x.roundRect(24, 44, 82, 66, 6); x.fill();
  x.strokeStyle = '#000'; x.lineWidth = 2; x.stroke();
  x.fillStyle = 'rgba(255,255,255,0.08)';
  x.fillRect(26, 52, 78, 3);
  x.fillRect(26, 98, 78, 3);
  x.fillStyle = '#cc0000';
  x.fillRect(32, 66, 66, 6);
  x.fillStyle = '#000';
  x.fillRect(36, 74, 58, 20);
  x.fillStyle = '#ff2222';
  x.font = 'bold 15px monospace';
  x.textAlign = 'center';
  x.fillText('00:03', 65, 89);
  x.strokeStyle = '#666'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(98, 46); x.lineTo(112, 24); x.stroke();
  x.fillStyle = '#888';
  x.beginPath(); x.arc(112, 24, 4, 0, Math.PI*2); x.fill();
  x.fillStyle = '#ff0000';
  x.beginPath(); x.arc(32, 52, 4, 0, Math.PI*2); x.fill();
  x.fillStyle = 'rgba(255,100,100,0.4)';
  x.beginPath(); x.arc(32, 52, 7, 0, Math.PI*2); x.fill();
  x.strokeStyle = '#aa0000'; x.lineWidth = 2.5;
  x.beginPath(); x.moveTo(50, 110); x.quadraticCurveTo(65, 122, 82, 110); x.stroke();
  x.strokeStyle = '#0044cc';
  x.beginPath(); x.moveTo(60, 110); x.quadraticCurveTo(72, 118, 90, 108); x.stroke();
  canvasEl.innerHTML = '';
  canvasEl.appendChild(c);
}


function drawHellShotgunSprite(canvasEl){
  const c = document.createElement('canvas');
  c.width = 130; c.height = 130;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.6)';
  x.beginPath(); x.ellipse(65, 116, 46, 8, 0, 0, Math.PI*2); x.fill();


  for(let i=0;i<14;i++){
    const fx = 30 + i*5;
    const fh = 10 + Math.sin(i*0.9)*5 + Math.random()*6;
    const fg = x.createLinearGradient(0, 40 - fh, 0, 50);
    fg.addColorStop(0, 'rgba(255,255,200,0.0)');
    fg.addColorStop(0.5, `rgba(255, ${120 + Math.random()*80}, 0, 0.8)`);
    fg.addColorStop(1, `rgba(255, 60, 0, 0.9)`);
    x.fillStyle = fg;
    x.beginPath();
    x.moveTo(fx, 50);
    x.quadraticCurveTo(fx - 3, 50 - fh*0.7, fx, 50 - fh);
    x.quadraticCurveTo(fx + 3, 50 - fh*0.7, fx, 50);
    x.fill();
  }


  x.fillStyle = '#5d4037';
  x.beginPath();
  x.moveTo(14, 60); x.lineTo(38, 58); x.lineTo(38, 78); x.lineTo(14, 86);
  x.closePath(); x.fill();
  x.strokeStyle = '#3e2723'; x.lineWidth = 1.5; x.stroke();


  const barrelGrad = x.createLinearGradient(0, 60, 0, 74);
  barrelGrad.addColorStop(0, '#37474f');
  barrelGrad.addColorStop(0.5, '#1a1a1a');
  barrelGrad.addColorStop(1, '#0a0a0a');
  x.fillStyle = barrelGrad;
  x.fillRect(38, 60, 74, 14);
  x.fillStyle = 'rgba(255,60,0,0.35)';
  x.fillRect(38, 60, 74, 3);


  x.fillStyle = '#0a0a0a';
  x.fillRect(108, 58, 12, 18);
  x.fillStyle = '#ff2a00';
  x.fillRect(118, 62, 4, 10);


  x.fillStyle = '#3e2723';
  x.fillRect(52, 74, 22, 14);
  x.strokeStyle = '#1a1a1a'; x.lineWidth = 1;
  x.strokeRect(52, 74, 22, 14);
  for(let i=0;i<3;i++){
    x.beginPath();
    x.moveTo(54, 78 + i*4);
    x.lineTo(72, 78 + i*4);
    x.stroke();
  }


  x.strokeStyle = '#1a1a1a'; x.lineWidth = 2.5;
  x.beginPath(); x.arc(46, 74, 5, 0, Math.PI); x.stroke();


  x.fillStyle = '#ff2a2a';
  x.font = 'bold 12px serif';
  x.textAlign = 'center';
  x.fillText('†', 60, 71);
  x.fillText('†', 88, 71);
  x.fillText('†', 100, 71);


  const glow = x.createRadialGradient(114, 67, 2, 114, 67, 30);
  glow.addColorStop(0, 'rgba(255,200,100,0.9)');
  glow.addColorStop(0.4, 'rgba(255,80,0,0.5)');
  glow.addColorStop(1, 'rgba(255,0,0,0)');
  x.fillStyle = glow;
  x.beginPath(); x.arc(114, 67, 30, 0, Math.PI*2); x.fill();


  canvasEl.innerHTML = '';
  canvasEl.appendChild(c);
}


function drawLaserEyeSprite(canvasEl){
  const c = document.createElement('canvas');
  c.width = 130; c.height = 130;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0.6)';
  x.beginPath(); x.ellipse(65, 118, 40, 6, 0, 0, Math.PI*2); x.fill();


  // Белок правого глаза
  const eyeGrad = x.createRadialGradient(65, 65, 5, 65, 65, 30);
  eyeGrad.addColorStop(0, '#ffffff');
  eyeGrad.addColorStop(0.5, '#ff0000');
  eyeGrad.addColorStop(1, '#4a0000');
  x.fillStyle = eyeGrad;
  x.beginPath(); x.arc(65, 65, 28, 0, Math.PI*2); x.fill();
  x.strokeStyle = '#000'; x.lineWidth = 2.5; x.stroke();


  // Зрачок
  x.fillStyle = '#000';
  x.beginPath(); x.ellipse(65, 65, 8, 10, 0, 0, Math.PI*2); x.fill();


  // Красные лучи-иглы
  x.strokeStyle = '#ff0000';
  x.lineWidth = 3;
  x.lineCap = 'round';
  for(let i=0;i<20;i++){
    const a = i * (Math.PI*2/20);
    const r1 = 30 + Math.sin(i*1.3) * 2;
    const r2 = 50 + Math.sin(i*1.7) * 5;
    x.beginPath();
    x.moveTo(65 + Math.cos(a)*r1, 65 + Math.sin(a)*r1);
    x.lineTo(65 + Math.cos(a)*r2, 65 + Math.sin(a)*r2);
    x.stroke();
    x.fillStyle = '#ff2200';
    x.beginPath();
    x.arc(65 + Math.cos(a)*r2, 65 + Math.sin(a)*r2, 3, 0, Math.PI*2);
    x.fill();
  }


  const glow = x.createRadialGradient(65, 65, 10, 65, 65, 65);
  glow.addColorStop(0, 'rgba(255,0,0,0.7)');
  glow.addColorStop(0.5, 'rgba(255,0,0,0.25)');
  glow.addColorStop(1, 'rgba(255,0,0,0)');
  x.fillStyle = glow;
  x.beginPath(); x.arc(65, 65, 65, 0, Math.PI*2); x.fill();


  canvasEl.innerHTML = '';
  canvasEl.appendChild(c);
}


// СПРАЙТ: Juchewaffen Division -- по мотивам флага КНДР (без обводки и надписи)
function drawJucheSprite(canvasEl){
  const c = document.createElement('canvas');
  c.width = 130; c.height = 130;
  const x = c.getContext('2d');


  x.fillStyle = '#0a0a14';
  x.fillRect(0, 0, 130, 130);


  const fw = 116, fh = 76;
  const fx = (130 - fw) / 2;
  const fy = (130 - fh) / 2;


  // Верхняя синяя полоса
  x.fillStyle = '#024FA2';
  x.fillRect(fx, fy, fw, 10);
  // Белая тонкая
  x.fillStyle = '#ffffff';
  x.fillRect(fx, fy + 10, fw, 2);
  // Красная широкая
  x.fillStyle = '#ED1C27';
  x.fillRect(fx, fy + 12, fw, fh - 24);
  // Белая тонкая
  x.fillStyle = '#ffffff';
  x.fillRect(fx, fy + fh - 12, fw, 2);
  // Нижняя синяя
  x.fillStyle = '#024FA2';
  x.fillRect(fx, fy + fh - 10, fw, 10);


  // Белый круг с красной звездой -- слева от центра
  const ccx = fx + fw * 0.28;
  const ccy = fy + fh * 0.5;
  x.beginPath();
  x.arc(ccx, ccy, 16, 0, Math.PI * 2);
  x.fillStyle = '#ffffff';
  x.fill();


  // Красная пятиконечная звезда
  x.beginPath();
  for(let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i * 2*Math.PI/5;
    const a2 = a1 + Math.PI/5;
    const x1 = ccx + Math.cos(a1)*11;
    const y1 = ccy + Math.sin(a1)*11;
    const x2 = ccx + Math.cos(a2)*11*0.42;
    const y2 = ccy + Math.sin(a2)*11*0.42;
    if(i===0) x.moveTo(x1, y1);
    else x.lineTo(x1, y1);
    x.lineTo(x2, y2);
  }
  x.closePath();
  x.fillStyle = '#ED1C27';
  x.fill();


  canvasEl.innerHTML = '';
  canvasEl.appendChild(c);
}


function renderShopItem(){
  const item = shopItems[shopCursor];
  shopItemName.textContent = item.name;
  shopItemDesc.textContent = item.desc;
  shopIndex.textContent = (shopCursor+1) + ' / ' + shopItems.length;
  shopPrev.disabled = shopCursor === 0;
  shopNext.disabled = shopCursor === shopItems.length - 1;


  if(item.id === 'c4'){
    drawC4Sprite(shopSprite);
  } else if(item.id === 'hellshotgun'){
    drawHellShotgunSprite(shopSprite);
  } else if(item.id === 'laser'){
    drawLaserEyeSprite(shopSprite);
  } else if(item.id === 'juche'){
    drawJucheSprite(shopSprite);
  }


  if(item.owned()){
    shopItemPrice.textContent = '✓ Куплено';
    shopItemPrice.style.color = '#5fff5f';
    shopBuy.textContent = 'КУПЛЕНО';
    shopBuy.disabled = true;
  } else {
    shopItemPrice.textContent = `Цена: ${item.price} убийств`;
    shopItemPrice.style.color = sessionKills >= item.price ? '#5fff5f' : '#ff5252';
    shopBuy.textContent = 'КУПИТЬ';
    shopBuy.disabled = sessionKills < item.price;
  }
}


shopBtn.addEventListener('click', () => {
  renderShopItem();
  shopOverlay.classList.add('show');
});
shopClose.addEventListener('click', () => shopOverlay.classList.remove('show'));
shopPrev.addEventListener('click', () => { if(shopCursor > 0){ shopCursor--; renderShopItem(); }});
shopNext.addEventListener('click', () => { if(shopCursor < shopItems.length-1){ shopCursor++; renderShopItem(); }});
shopBuy.addEventListener('click', () => {
  const item = shopItems[shopCursor];
  if(item.owned()) return;
  if(sessionKills < item.price) return;
  sessionKills -= item.price;
  item.buy();
  updateMenuStats();
  renderShopItem();
});


function updateMenuStats(){
  if(gamesPlayed === 0 && !c4Owned && !hellShotgunOwned && !laserEyeOwned && !jucheOwned){
    menuStatsEl.innerHTML = '';
  } else {
    menuStatsEl.innerHTML =
      `Всего убийств: <b>${sessionKills}</b><br>` +

function checksum(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36);
}
function makeProgressCode(){
  const data = {
    v: 1,
    s: sessionScore,
    vp: sessionVamp,
    rb: sessionRainbow,
    gn: sessionGeneral,
    k: sessionKills,
    b: sessionBest,
    g: gamesPlayed,
    c4: c4Owned ? 1 : 0,
    hs: hellShotgunOwned ? 1 : 0,
    le: laserEyeOwned ? 1 : 0,
    jc: jucheOwned ? 1 : 0
  };
  const json = JSON.stringify(data);
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64 + '.' + checksum(b64);
}
function parseProgressCode(code){
  code = (code || '').trim();
  if(!code) return null;
  const parts = code.split('.');
  if(parts.length !== 2) return null;
  if(checksum(parts[0]) !== parts[1]) return null;
  try {
    const json = decodeURIComponent(escape(atob(parts[0])));
    const data = JSON.parse(json);
    if(typeof data !== 'object' || data === null) return null;
    return data;
  } catch(e){ return null; }
}
function setCodeMsg(text, ok){
  codeMsgEl.textContent = text;
  codeMsgEl.className = ok ? 'ok' : 'err';
}
genCodeBtn.addEventListener('click', () => {
  const code = makeProgressCode();
  codeOutEl.textContent = code;
  codeOutEl.classList.add('show');
  setCodeMsg('Код создан. Скопируй его.', true);
});
copyCodeBtn.addEventListener('click', () => {
  const code = codeOutEl.textContent;
  if(!code){ setCodeMsg('Сначала создай код.', false); return; }
  const ta = document.createElement('textarea');
  ta.value = code;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    setCodeMsg('Код скопирован!', true);
  } catch(e){
    setCodeMsg('Выдели вручную.', false);
  }
  document.body.removeChild(ta);
});
applyCodeBtn.addEventListener('click', () => {
  const data = parseProgressCode(codeInEl.value);
  if(!data){ setCodeMsg('Неверный код.', false); return; }
  sessionScore   += data.s  | 0;
  sessionVamp    += data.vp | 0;

  if((data.b | 0) > sessionBest) sessionBest = data.b | 0;

  if(data.c4) c4Owned = true;

  codeInEl.value = '';
});

const joyBase = document.getElementById('joyBase');
const joyKnob = document.getElementById('joyKnob');
const joy = { active:false, dx:0, dy:0, id:null };
const JOY_MAX = 40;
function joyStart(x, y, id){ joy.active = true; joy.id = id; joyMove(x, y); }
function joyMove(x, y){
  if(!joy.active) return;
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = x - cx, dy = y - cy;
  const len = Math.hypot(dx, dy);
  if(len > JOY_MAX){ dx = dx/len*JOY_MAX; dy = dy/len*JOY_MAX; }
  joy.dx = dx / JOY_MAX; joy.dy = dy / JOY_MAX;
  joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}
function joyEnd(){
  joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
  joyKnob.style.transform = 'translate(-50%,-50%)';
}
joyBase.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; joyStart(t.clientX, t.clientY, t.identifier); }, {passive:false});
joyBase.addEventListener('touchmove', e => { e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyMove(t.clientX, t.clientY); break; } } }, {passive:false});
joyBase.addEventListener('touchend', e => { e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier === joy.id){ joyEnd(); break; } } }, {passive:false});
joyBase.addEventListener('touchcancel', e => { e.preventDefault(); joyEnd(); }, {passive:false});
joyBase.addEventListener('mousedown', e => { e.preventDefault(); joyStart(e.clientX, e.clientY, 'mouse'); });
addEventListener('mousemove', e => { if(joy.id === 'mouse') joyMove(e.clientX, e.clientY); });
addEventListener('mouseup',   e => { if(joy.id === 'mouse') joyEnd(); });

    });

function updateJucheSoldiers(){
  for(let si = jucheSoldiers.length-1; si >= 0; si--){
    const s = jucheSoldiers[si];


    let best = null, bestD = Infinity;
    const allEnemies = [].concat(zombies, vampires, rainbowZombies, vampireGenerals);
    for(const e of allEnemies){
      const d = dist(e, s);
      if(d < bestD){ bestD = d; best = e; }
    }


    if(best){
      const a = Math.atan2(best.y - s.y, best.x - s.x);
      let diff = a - s.aimAngle;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      s.aimAngle += diff * 0.25;


      const stopDist = 180;
      if(bestD > stopDist){
        s.x += Math.cos(a) * s.speed;
        s.y += Math.sin(a) * s.speed;
        s.walkPhase += 0.25;
      } else if(bestD < stopDist - 60){
        s.x -= Math.cos(a) * s.speed * 0.6;
        s.y -= Math.sin(a) * s.speed * 0.6;
        s.walkPhase += 0.15;
      }


      if(s.fireCooldown > 0) s.fireCooldown--;
      if(s.fireCooldown <= 0 && bestD < 500){
        for(let k = 0; k < 3; k++){
          const spread = rand(-0.06, 0.06);
          const a2 = s.aimAngle + spread;
          jucheBullets.push({
            x: s.x + Math.cos(s.aimAngle)*18,
            y: s.y + Math.sin(s.aimAngle)*18,
            vx: Math.cos(a2) * 22,
            vy: Math.sin(a2) * 22,
            r: 2.5,
            dmg: 4,
            life: 60
          });
        }
        for(let k = 0; k < 6; k++){
          const a2 = s.aimAngle + rand(-0.4, 0.4);
          const sp = rand(3, 7);
          particles.push({
            x: s.x + Math.cos(s.aimAngle)*20,
            y: s.y + Math.sin(s.aimAngle)*20,
            vx: Math.cos(a2)*sp, vy: Math.sin(a2)*sp,
            life: 8, color: '#fff59d'
          });
        }
        s.fireCooldown = 10;
      }
    }


    s.x = Math.max(s.r, Math.min(W - s.r, s.x));
    s.y = Math.max(s.r, Math.min(H - s.r, s.y));


    if(dist(s, player) > 700){
      const a = Math.random()*Math.PI*2;
      s.x = player.x + Math.cos(a)*120;
      s.y = player.y + Math.sin(a)*120;
    }
  }


  // Взаимное отталкивание бойцов КНДР
  for(let i = 0; i < jucheSoldiers.length; i++){
    const a = jucheSoldiers[i];
    for(let j = i+1; j < jucheSoldiers.length; j++){
      const b = jucheSoldiers[j];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = a.r + b.r + 20;
      if(d > 0 && d < minDist){
        const overlap = (minDist - d) * 0.5;
        const nx = dx / d;
        const ny = dy / d;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;
      }
    }
  }
}

  const grad = ctx.createRadialGradient(s.x-4, s.y-4, 3, s.x, s.y, s.r);
  grad.addColorStop(0, '#4a7bc8');
  grad.addColorStop(1, '#024FA2');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#001a3d';
  ctx.lineWidth = 2.5;
  ctx.stroke();


  const lookX = cosA * 3;
  const lookY = sinA * 3;
  const eyeY = s.y + 2;
  const eyeR = 5.5;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(s.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(s.x - 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(s.x + 6 + lookX, eyeY + lookY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(s.x - 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x + 6 + lookX*1.7, eyeY + lookY*1.7, 2.6, 0, Math.PI*2); ctx.fill();


  ctx.beginPath();
  ctx.arc(s.x, s.y - 5, s.r - 1, Math.PI, 0);
  ctx.closePath();
  const helmGrad = ctx.createLinearGradient(s.x, s.y - s.r - 5, s.x, s.y - 5);
  helmGrad.addColorStop(0, '#2c5aa0');
  helmGrad.addColorStop(1, '#001a3d');
  ctx.fillStyle = helmGrad;
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();


  ctx.fillStyle = '#ED1C27';
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1 = -Math.PI/2 + i * 2*Math.PI/5;
    const a2 = a1 + Math.PI/5;
    const x1 = s.x + Math.cos(a1)*4;
    const y1 = s.y - 9 + Math.sin(a1)*4;
    const x2 = s.x + Math.cos(a2)*1.8;
    const y2 = s.y - 9 + Math.sin(a2)*1.8;
    if(i===0) ctx.moveTo(x1, y1);
    else ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 0.8;
  ctx.stroke();


  drawMachineGunAt(s.x, s.y, cosA, sinA);
}


function drawMachineGunAt(cx, cy, cosA, sinA){
  const r = 16;
  const sideOffset = -r * 0.5 - 4;
  const forwardOffset = r * 0.9;
  const anchorX = cx + Math.cos(Math.atan2(sinA,cosA) + Math.PI/2) * sideOffset + cosA * forwardOffset;
  const anchorY = cy + Math.sin(Math.atan2(sinA,cosA) + Math.PI/2) * sideOffset + sinA * forwardOffset;


  ctx.save();
  ctx.translate(anchorX, anchorY);
  ctx.rotate(Math.atan2(sinA, cosA));


  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(-18, -2);
  ctx.lineTo(-4, -3);
  ctx.lineTo(-4, 4);
  ctx.lineTo(-18, 6);
  ctx.closePath();
  ctx.fill();


  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-4, -6, 40, 7);
  ctx.fillStyle = '#4a4a4a';
  ctx.fillRect(-4, -6, 40, 2);
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(-4, 0, 40, 1);


  ctx.fillStyle = '#111';
  ctx.fillRect(36, -4, 10, 3);
  ctx.fillStyle = '#000';
  ctx.fillRect(45, -3, 2, 2);


  ctx.fillStyle = '#3a3a3a';
  ctx.beginPath();
  ctx.arc(10, 8, 7, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = '#555';
  ctx.beginPath();
  ctx.arc(10, 8, 3, 0, Math.PI*2);
  ctx.fill();


  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(-2, 0);
  ctx.lineTo(-6, 12);
  ctx.lineTo(1, 12);
  ctx.lineTo(3, 0);
  ctx.closePath();
  ctx.fill();


  ctx.restore();
}

function drawHandsAndGun(cx, cy, r, angle, weaponName, opts){
  opts = opts || {};
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);


  const handR = 6;
  const skin = '#ffccbc';
  const skinEdge = '#a15a44';


  const sideOffset = -r * 0.5 - 4;
  const forwardOffset = r * 0.9;
  const anchorX = cx + perpX * sideOffset + cosA * forwardOffset;
  const anchorY = cy + perpY * sideOffset + sinA * forwardOffset;


  const gunBackShift = -6;
  const gunX = anchorX + cosA * gunBackShift;
  const gunY = anchorY + sinA * gunBackShift;


  if(opts.rampageActive){
    drawChainsawAt(gunX, gunY, cosA, sinA, true, opts.stalin);
  } else if(weaponName === 'pistol'){
    drawPistolAt(gunX, gunY, cosA, sinA);
  } else if(weaponName === 'shotgun'){
    drawShotgunAt(gunX, gunY, cosA, sinA);
  } else if(weaponName === 'rifle'){
    drawRifleAt(gunX, gunY, cosA, sinA);
  } else if(weaponName === 'rpg'){
    drawRPGAt(gunX, gunY, cosA, sinA, rpgLoaded, rpgReloadTimer, WEAPONS.rpg.reloadTime);
  } else if(weaponName === 'hellshotgun'){
    drawHellShotgunAt(gunX, gunY, cosA, sinA);
  }


  const backGripX = anchorX + cosA * 2;
  const backGripY = anchorY + sinA * 2;


  const frontGripDist = (weaponName === 'rpg') ? 18 :
                        (weaponName === 'hellshotgun') ? 20 :
                        (weaponName === 'shotgun') ? 14 :
                        (weaponName === 'rifle') ? 16 : 11;
  const frontGripX = anchorX + cosA * frontGripDist;
  const frontGripY = anchorY + sinA * frontGripDist;


  ctx.fillStyle = skin;
  ctx.strokeStyle = skinEdge;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(backGripX, backGripY, handR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(frontGripX, frontGripY, handR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
}

function drawHellShotgunAt(x, y, cosA, sinA){
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(sinA, cosA));


  const t = Date.now() / 90;
  for(let i=0;i<12;i++){
    const fx = 8 + i*3;
    const fh = 6 + Math.sin(i*0.9 + t)*4 + Math.random()*5;
    const fg = ctx.createLinearGradient(0, -6 - fh, 0, 4);
    fg.addColorStop(0, 'rgba(255,255,200,0)');
    fg.addColorStop(0.5, `rgba(255, ${100 + Math.random()*100}, 0, 0.8)`);
    fg.addColorStop(1, 'rgba(255, 60, 0, 0.9)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(fx, 4);
    ctx.quadraticCurveTo(fx - 2, 4 - fh*0.7, fx, 4 - fh);
    ctx.quadraticCurveTo(fx + 2, 4 - fh*0.7, fx, 4);
    ctx.fill();
  }


  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  ctx.moveTo(-16, -2); ctx.lineTo(-4, -3); ctx.lineTo(-4, 6); ctx.lineTo(-16, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-6, 0); ctx.moveTo(-14, 4); ctx.lineTo(-6, 4); ctx.stroke();


  const bg = ctx.createLinearGradient(0, -6, 0, 6);
  bg.addColorStop(0, '#37474f');
  bg.addColorStop(0.5, '#1a1a1a');
  bg.addColorStop(1, '#0a0a0a');
  ctx.fillStyle = bg;
  ctx.fillRect(-4, -6, 44, 10);
  ctx.fillStyle = 'rgba(255,60,0,0.35)';
  ctx.fillRect(-4, -6, 44, 2);


  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(40, -7, 8, 12);
  ctx.fillStyle = '#ff2a00';
  ctx.fillRect(46, -5, 3, 8);


  ctx.fillStyle = '#3e2723';
  ctx.fillRect(8, 4, 16, 8);
  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 1;
  ctx.strokeRect(8, 4, 16, 8);
  for(let i=0;i<2;i++){
    ctx.beginPath();
    ctx.moveTo(10, 7 + i*3);
    ctx.lineTo(22, 7 + i*3);
    ctx.stroke();
  }


  ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(2, 4, 4, 0, Math.PI); ctx.stroke();


  ctx.fillStyle = '#ff2a2a';
  ctx.font = 'bold 9px serif';
  ctx.textAlign = 'center';
  ctx.fillText('†', 14, -1);
  ctx.fillText('†', 26, -1);
  ctx.fillText('†', 36, -1);


  const glow = ctx.createRadialGradient(48, 0, 2, 48, 0, 22);
  glow.addColorStop(0, 'rgba(255,200,100,0.8)');
  glow.addColorStop(0.5, 'rgba(255,80,0,0.4)');
  glow.addColorStop(1, 'rgba(255,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(48, 0, 22, 0, Math.PI*2); ctx.fill();


  ctx.restore();
}


function drawChainsawAt(x, y, cosA, sinA, active, stalin){
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(sinA, cosA));
  ctx.fillStyle = stalin ? '#1565c0' : '#c62828'; ctx.fillRect(-8, -10, 20, 20);
  ctx.fillStyle = stalin ? '#0d47a1' : '#8e0000'; ctx.fillRect(-8, -10, 20, 4);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(-6, 12); ctx.stroke();
  const barLen = stalin ? 50 : 34;
  ctx.fillStyle = '#424242'; ctx.fillRect(12, -4, barLen, 8);
  ctx.fillStyle = '#616161'; ctx.fillRect(12, -4, barLen, 2);
  const t = active ? (Date.now() / 30) % 2 : 0;
  ctx.fillStyle = '#bdbdbd';
  const teeth = stalin ? 15 : 10;
  for(let i=0;i<teeth;i++){
    const px = 12 + i*3.4 + (active ? (t*1.7) : 0);
    if(px > 12 + barLen) continue;
    ctx.beginPath(); ctx.moveTo(px, -4); ctx.lineTo(px + 2, -7); ctx.lineTo(px + 3.4, -4); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function spawnRainbowWallReal(){
  const side = Math.floor(Math.random()*4);
  const count = 5, cols = 2, gap = 42, colGap = 50;
  const hp = 2 + Math.floor(score/8);
  for(let c=0;c<cols;c++){
    for(let i=0;i<count;i++){
      let x, y;
      const offset = (i - (count-1)/2) * gap;
      if(side===0){ x = W/2 + offset; y = -40 - c*colGap; }
      else if(side===1){ x = W+40 + c*colGap; y = H/2 + offset; }
      else if(side===2){ x = W/2 + offset; y = H+40 + c*colGap; }
      else { x = -40 - c*colGap; y = H/2 + offset; }
      const hue = (c*count + i) * (360/(cols*count));
      rainbowZombies.push({
        x, y, r: 14,
        speed: rand(0.9, 1.2) + score*0.004,
        hp, maxHp: hp, hue,
        bodyColor: `hsl(${hue},90%,65%)`,
        earColor:  `hsl(${hue},90%,55%)`,
        rainbowPhase: Math.random()*Math.PI*2
      });
    }
  }
}

function addBloodStain(x, y, size){
  if(!bloodEnabled()) return;
  const drops = [];
  const n = 6 + Math.floor(Math.random()*6);
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const d = Math.random()*size*1.9;
    drops.push({ x: Math.cos(a)*d, y: Math.sin(a)*d, r: 3 + Math.random()*size*0.7 });
  }
  bloodStains.push({ x, y, drops, age: 0, life: settings.infiniteBlood ? Infinity : 60*30*settings.bloodLife });
  if(bloodStains.length > 500) bloodStains.shift();
}
function addBloodPool(x, y, size){
  if(!bloodEnabled()) return;
  const drops = [];
  const n = 20 + Math.floor(Math.random()*15);

function addRainbowCorpse(z){

function explode(x, y, radius, dmg){
  explosions.push({ x, y, r: 0, maxR: radius, life: 30 });
  shockwaves.push({ x, y, r: 0, maxR: radius * 1.4, life: 20 });
  screenShake = Math.max(screenShake, 26);
  currentShakeDecay = 0.88;


  for(let i=zombies.length-1;i>=0;i--){
    const z = zombies[i];
    if(dist(z, {x,y}) < radius + z.r){
      spawnGore(z.x, z.y, z); zombies.splice(i,1);
      score++; totalKills++;
      document.getElementById('score').textContent = score;
      registerKill();
    }
  }
  for(let i=vampires.length-1;i>=0;i--){
    const v = vampires[i];
    if(dist(v, {x,y}) < radius + v.r){
      v.hp -= dmg;
      if(v.hp <= 0){
        spawnGore(v.x, v.y, {hue: 0}); addBloodPool(v.x, v.y, 60);
        vampires.splice(i,1);
        vampScore++; totalKills++;
        document.getElementById('vampScore').textContent = vampScore;
        registerKill();
      }
    }
  }
  for(let i=rainbowZombies.length-1;i>=0;i--){

    if(dist(z, {x,y}) < radius + z.r){
      spawnGore(z.x, z.y, z); addRainbowCorpse(z);
      rainbowZombies.splice(i,1);
      rainbowScore++; totalKills++;
      document.getElementById('rainbowScore').textContent = rainbowScore;
      registerKill();
    }
  }
  for(let i=vampireGenerals.length-1;i>=0;i--){
    const v = vampireGenerals[i];
    if(dist(v, {x,y}) < radius + v.r){
      v.hp -= dmg;
      if(v.hp <= 0){
        spawnGore(v.x, v.y, {hue: 0}); addBloodPool(v.x, v.y, 80); addGeneralCorpse(v);
        vampireGenerals.splice(i,1);
        generalScore++; totalKills++;
        document.getElementById('generalScore').textContent = generalScore;
        registerKill();
      }
    }
  }
  for(let i=0;i<50;i++){
    const a = Math.random()*Math.PI*2;
    const s = rand(3,14);
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:30, color: `hsl(0, 100%, ${rand(35, 65)}%)` });
  }
  for(let i=0;i<15;i++){
    const a = Math.random()*Math.PI*2;
    const s = rand(1,3);
    smoke.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r: rand(8,16), life: 60, maxLife: 60 });
  }
}


function registerKill(){
  killStreak++;
  killStreakTimer = KILL_STREAK_TIMEOUT;
  for(const m of KILL_MILESTONES){
    if(killStreak === m.kills){
      showKillMessage(m.text, m.cls, m.color, m.dur);
      break;
    }
  }
  if(!settings.rampageEnabled){
    if(settings.hpGrowEnabled && totalKills >= nextRageAt){
      player.maxHp += 100;
      player.hp = player.maxHp;
      document.getElementById('hp').textContent = player.hp;
      nextRageAt = totalKills + 100;
    }
    return;
  }
  if(!rageIntroActive && !rampageActive && totalKills >= nextRageAt){
    startRage();
  }
}


function showKillMessage(text, cls, intensity, dur){
  killMsgEl.textContent = text;
  killMsgEl.className = '';
  if(cls) killMsgEl.classList.add(cls);
  void killMsgEl.offsetWidth;
  killMsgEl.classList.add('show');
  killScreenIntensity = Math.max(killScreenIntensity, intensity);
  killScreenTimer = dur;
  setTimeout(() => { killMsgEl.classList.remove('show'); }, 1400);
}

function shoot(){
  const w = WEAPONS[player.weapon];
  const angle = player.aimAngle;


  if(w.explosive){
    if(!rpgLoaded) return;
    rpgLoaded = false;
    rpgReloadTimer = w.reloadTime;
    const muzzleDist = 60;
    bullets.push({
      x: player.x + Math.cos(angle)*muzzleDist,
      y: player.y + Math.sin(angle)*muzzleDist,
      vx: Math.cos(angle)*w.speed, vy: Math.sin(angle)*w.speed,
      r: 5, dmg: w.dmg, color: w.color, life: 120,
      explosive: true, blastR: 150, rocket: true
    });
    for(let i=0;i<10;i++){
      const a = angle + rand(-0.5,0.5);
      smoke.push({
        x: player.x + Math.cos(angle)*50, y: player.y + Math.sin(angle)*50,
        vx: Math.cos(a)*rand(2,5), vy: Math.sin(a)*rand(2,5),
        r: rand(6,12), life: 45, maxLife: 45
      });
    }
  } else if(w.hell){
    const ballCount = 4;
    const spread = 0.22;
    const baseAngle = angle;
    const muzzleDist = 40;
    for(let i=0;i<ballCount;i++){
      const offset = (i - (ballCount-1)/2) * (spread / (ballCount-1)) * 2;
      const a = baseAngle + offset + rand(-0.02, 0.02);
      hellBalls.push({
        x: player.x + Math.cos(baseAngle)*muzzleDist,
        y: player.y + Math.sin(baseAngle)*muzzleDist,
        vx: Math.cos(a) * w.speed,
        vy: Math.sin(a) * w.speed,
        r: w.ballSize,
        dmg: w.dmg,
        life: 80,
        maxLife: 80,
        hitSet: new Set()
      });
    }
    for(let i=0;i<40;i++){
      const a = angle + rand(-0.5,0.5);
      const s = rand(4,14);
      particles.push({
        x: player.x + Math.cos(angle)*30,
        y: player.y + Math.sin(angle)*30,
        vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        life: 15 + Math.random()*25,
        color: `hsl(${rand(0,45)}, 100%, ${rand(55,85)}%)`
      });
    }
    for(let i=0;i<20;i++){
      const a = angle + rand(-0.5,0.5);
      smoke.push({
        x: player.x + Math.cos(angle)*30,
        y: player.y + Math.sin(angle)*30,
        vx: Math.cos(a)*rand(2,6), vy: Math.sin(a)*rand(2,6),
        r: rand(8,14), life: 55, maxLife: 55, fire:true
      });
    }
  } else {
    const offsetX = Math.cos(angle)*w.len;
    const offsetY = Math.sin(angle)*w.len;
    for(let i=0;i<w.pellets;i++){
      const a = angle + rand(-w.spread, w.spread);
      bullets.push({
        x: player.x + offsetX, y: player.y + offsetY,
        vx: Math.cos(a)*w.speed, vy: Math.sin(a)*w.speed,
        r: 2.5, dmg: w.dmg, color: w.color, life: 60
      });
    }
  }
  if(!w.hell){
    for(let i=0;i<5;i++){
      const a = angle + rand(-0.3,0.3);
      smoke.push({
        x: player.x + Math.cos(angle)*w.len, y: player.y + Math.sin(angle)*w.len,
        vx: Math.cos(a)*rand(1,3) + rand(-0.5,0.5), vy: Math.sin(a)*rand(1,3) + rand(-0.5,0.5),
        r: rand(5,10), life: 30, maxLife: 30
      });
    }
    for(let i=0;i<w.flash;i++){
      const a = angle + rand(-0.6,0.6);
      particles.push({
        x: player.x + Math.cos(angle)*w.len, y: player.y + Math.sin(angle)*w.len,
        vx: Math.cos(a)*rand(4,9), vy: Math.sin(a)*rand(4,9),
        life: 8, color: w.sound
      });
    }
  }
  const perpA = angle + Math.PI/2;
  casings.push({
    x: player.x + Math.cos(angle)*6 + Math.cos(perpA)*8,
    y: player.y + Math.sin(angle)*6 + Math.sin(perpA)*8,
    vx: Math.cos(perpA)*rand(3,5) + rand(-1,1),
    vy: Math.sin(perpA)*rand(3,5) + rand(-1,1),
    rot: Math.random()*Math.PI*2, rotSpeed: rand(-0.3,0.3), life: 200
  });
  player.recoil = w.kick;
  if(screenShake < w.shake) screenShake = w.shake;
  currentShakeDecay = w.shakeDecay;
}


function startLaser(){
  if(!laserEyeOwned) return;
  if(laserActive) return;
  if(laserCooldown > 0) return;
  if(gameOver) return;
  laserActive = true;
  laserTimer = 5 * 60;
  laserCooldown = 60 * 60;
  showKillMessage('ЛАЗЕР!', 'small', 0.4, 60);
}


function updateLaser(){
  if(laserCooldown > 0) laserCooldown--;
  if(!laserActive) return;


  laserTimer--;
  if(laserTimer <= 0){
    laserActive = false;
    laserTarget = null;
    return;
  }


  const angle = player.aimAngle;
  const dirX = Math.cos(angle);
  const dirY = Math.sin(angle);
  let bestT = Infinity;
  let bestEnemy = null;
  let bestType = null;


  const allEnemies = [
    ...zombies.map(e => ({e, t:'zombie'})),
    ...vampires.map(e => ({e, t:'vampire'})),
    ...rainbowZombies.map(e => ({e, t:'rainbow'})),
    ...vampireGenerals.map(e => ({e, t:'general'}))
  ];


  for(const item of allEnemies){
    const e = item.e;
    const ex = e.x - player.x;
    const ey = e.y - player.y;
    const t = ex * dirX + ey * dirY;
    if(t < 20) continue;
    const perpDist = Math.abs(ex * dirY - ey * dirX);
    if(perpDist < e.r + 10){
      if(t < bestT){
        bestT = t;
        bestEnemy = e;
        bestType = item.t;
      }
    }
  }


  laserTarget = bestEnemy;


  if(bestEnemy){
    const dmg = 2;
    if(bestType === 'zombie'){
      bestEnemy.hp -= dmg;
      if(bestEnemy.hp <= 0){
        addCorpse(bestEnemy); spawnGore(bestEnemy.x, bestEnemy.y, bestEnemy);
        const idx = zombies.indexOf(bestEnemy);
        if(idx >= 0) zombies.splice(idx, 1);
        score++; totalKills++;
        document.getElementById('score').textContent = score;
        registerKill();
      }
    } else if(bestType === 'vampire'){
      bestEnemy.hp -= dmg;
      if(bestEnemy.hp <= 0){
        bloodExplosion(bestEnemy.x, bestEnemy.y); addBloodPool(bestEnemy.x, bestEnemy.y, 50);
        addVampireCorpse(bestEnemy);
        const idx = vampires.indexOf(bestEnemy);
        if(idx >= 0) vampires.splice(idx, 1);
        vampScore++; totalKills++;
        document.getElementById('vampScore').textContent = vampScore;
        registerKill();
      }
    } else if(bestType === 'rainbow'){
      bestEnemy.hp -= dmg;
      if(bestEnemy.hp <= 0){
        spawnGore(bestEnemy.x, bestEnemy.y, bestEnemy); addRainbowCorpse(bestEnemy);
        const idx = rainbowZombies.indexOf(bestEnemy);
        if(idx >= 0) rainbowZombies.splice(idx, 1);
        rainbowScore++; totalKills++;
        document.getElementById('rainbowScore').textContent = rainbowScore;
        registerKill();
      }
    } else if(bestType === 'general'){
      bestEnemy.hp -= dmg;
      if(bestEnemy.hp <= 0){
        spawnGore(bestEnemy.x, bestEnemy.y, {hue:0}); addBloodPool(bestEnemy.x, bestEnemy.y, 80);
        addGeneralCorpse(bestEnemy);
        const idx = vampireGenerals.indexOf(bestEnemy);
        if(idx >= 0) vampireGenerals.splice(idx, 1);
        generalScore++; totalKills++;
        document.getElementById('generalScore').textContent = generalScore;
        registerKill();
      }
    }
    for(let i=0;i<4;i++){
      const a = Math.random()*Math.PI*2;
      const s = rand(1, 4);
      particles.push({
        x: bestEnemy.x, y: bestEnemy.y,
        vx: Math.cos(a)*s, vy: Math.sin(a)*s,
        life: 10 + Math.random()*10,
        color: `hsl(${rand(0,30)}, 100%, ${rand(60,90)}%)`
      });
    }
  }


  for(let i=0;i<3;i++){
    const d = Math.random() * 2000;
    particles.push({
      x: player.x + dirX * d,
      y: player.y + dirY * d,
      vx: rand(-1,1), vy: rand(-1,1),
      life: 6 + Math.random()*6,
      color: `hsl(${rand(0,20)}, 100%, ${rand(70,100)}%)`
    });
  }
}


function findNearestTarget(){
  let best = null, bestD = Infinity;
  const all = [].concat(zombies, vampires, rainbowZombies, vampireGenerals);
  for(const z of all){
    const d = dist(z, player);
    if(d < bestD){ bestD = d; best = z; }
  }
  return best;
}

    if(c4Detonated && c4ExplosionTimer > 0){
      c4ExplosionTimer--;
    }
    return;
  }


  if(rpgReloadTimer > 0){
    rpgReloadTimer--;
    if(rpgReloadTimer <= 0){ rpgLoaded = true; }
  }


  updateLaser();
  updateJucheSoldiers();
  updateJucheBullets();


  if(laserEyeOwned){
    laserBtn.classList.add('show');
    if(laserActive){
      laserBtn.classList.add('active');
      laserBtn.classList.remove('cooling');
      laserCdEl.textContent = Math.ceil(laserTimer/60) + 'с';
    } else if(laserCooldown > 0){
      laserBtn.classList.remove('active');
      laserBtn.classList.add('cooling');

    } else {
      laserBtn.classList.remove('active', 'cooling');
      laserCdEl.textContent = '';
    }
  } else {
    laserBtn.classList.remove('show');
  }


  if(jucheOwned){
    jucheBtn.classList.add('show');

      jucheBtn.classList.add('used');
      jucheCdEl.textContent = 'исп.';
    } else {
      jucheBtn.classList.remove('used');
      jucheCdEl.textContent = '';

  for(const z of rainbowZombies){

  for(let i=0;i<rainbowZombies.length;i++){

      const dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minDist = a.r + b.r;
      if(d > 0 && d < minDist){
        const overlap = (minDist - d) * 0.5;
        const nx = dx / d;
        const ny = dy / d;
        a.x -= nx * overlap;
        a.y -= ny * overlap;
        b.x += nx * overlap;
        b.y += ny * overlap;
      }
    }

  pickupSpawnTimer++;

  if(totalKills > 0 && totalKills % 25 === 0 && Math.random() < 0.02){
    spawnInterval = Math.max(15, spawnInterval - 2);
    vampSpawnInterval = Math.max(50, vampSpawnInterval - 5);

  }

function drawCorpse(c){
  const angle = c.angle;
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const backX = Math.cos(angle + Math.PI);
  const backY = Math.sin(angle + Math.PI);
  ctx.strokeStyle = c.tailColor;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(c.x - Math.cos(angle)*c.r, c.y - Math.sin(angle)*c.r);
  ctx.quadraticCurveTo(
    c.x - Math.cos(angle)*c.r - backX*10 + perpX*8,
    c.y - Math.sin(angle)*c.r - backY*10 + perpY*8,
    c.x - Math.cos(angle)*c.r - backX*20 + perpX*14,
    c.y - Math.sin(angle)*c.r - backY*20 + perpY*14
  );
  ctx.stroke();
  ctx.fillStyle = c.earColor;
  ctx.beginPath();
  ctx.moveTo(c.x + perpX*7, c.y + perpY*7);
  ctx.lineTo(c.x + perpX*15 + backX*6, c.y + perpY*15 + backY*6);
  ctx.lineTo(c.x + perpX*4 + backX*8, c.y + perpY*4 + backY*8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x - perpX*7, c.y - perpY*7);
  ctx.lineTo(c.x - perpX*15 + backX*6, c.y - perpY*15 + backY*6);
  ctx.lineTo(c.x - perpX*4 + backX*8, c.y - perpY*4 + backY*8);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.r*1.1, c.r*0.85, angle, 0, Math.PI*2);
  ctx.fillStyle = c.bodyColor; ctx.fill();
  ctx.strokeStyle = '#8e1145'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#3e0a25'; ctx.lineWidth = 1.5;
  const ex1 = c.x - 5, ey1 = c.y - 3;
  const ex2 = c.x + 5, ey2 = c.y - 3;
  ctx.beginPath();
  ctx.moveTo(ex1-2, ey1-2); ctx.lineTo(ex1+2, ey1+2);
  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
}


function drawVampireCorpse(vc){
  const angle = vc.angle;
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  ctx.strokeStyle = '#37474f';
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(vc.x + perpX*8 + cosA*4, vc.y + perpY*8 + sinA*4);
  ctx.lineTo(vc.x + perpX*8 + cosA*24, vc.y + perpY*8 + sinA*24);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(vc.x, vc.y, vc.r*1.1, vc.r*0.85, angle, 0, Math.PI*2);
  ctx.fillStyle = '#e8a48a'; ctx.fill();
  ctx.strokeStyle = '#a15a44'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#3e0a25'; ctx.lineWidth = 1.5;
  const ex1 = vc.x - 6, ey1 = vc.y - 3;
  const ex2 = vc.x + 6, ey2 = vc.y - 3;
  ctx.beginPath();
  ctx.moveTo(ex1-2, ey1-2); ctx.lineTo(ex1+2, ey1+2);
  ctx.moveTo(ex1+2, ey1-2); ctx.lineTo(ex1-2, ey1+2);
  ctx.moveTo(ex2-2, ey2-2); ctx.lineTo(ex2+2, ey2+2);
  ctx.moveTo(ex2+2, ey2-2); ctx.lineTo(ex2-2, ey2+2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(vc.x, vc.y - 4, vc.r - 2, Math.PI, 0);
  ctx.closePath();
  const g = ctx.createLinearGradient(vc.x, vc.y - vc.r - 4, vc.x, vc.y - 4);
  g.addColorStop(0, '#cfd8dc');
  g.addColorStop(1, '#607d8b');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.stroke();
  drawCross(vc.x, vc.y - 8, 5);
}

function drawZombie(z){
  const angle = Math.atan2(player.y - z.y, player.x - z.x);
  const tailWave = Math.sin(z.tailPhase) * 10;
  const tailBaseX = z.x - Math.cos(angle) * z.r;
  const tailBaseY = z.y - Math.sin(angle) * z.r;
  const tailMidX  = tailBaseX - Math.cos(angle) * 14 + Math.cos(angle + Math.PI/2) * tailWave * 0.5;
  const tailMidY  = tailBaseY - Math.sin(angle) * 14 + Math.sin(angle + Math.PI/2) * tailWave * 0.5;
  const tailTipX  = tailBaseX - Math.cos(angle) * 26 + Math.cos(angle + Math.PI/2) * tailWave;
  const tailTipY  = tailBaseY - Math.sin(angle) * 26 + Math.sin(angle + Math.PI/2) * tailWave;
  ctx.strokeStyle = z.tailColor;
  ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(tailBaseX, tailBaseY);
  ctx.quadraticCurveTo(tailMidX, tailMidY, tailTipX, tailTipY);
  ctx.stroke();
  ctx.fillStyle = z.tailColor;
  ctx.beginPath(); ctx.arc(tailTipX, tailTipY, 5, 0, Math.PI*2); ctx.fill();


  const earWave = Math.sin(z.earPhase) * 3;
  const perpX = Math.cos(angle + Math.PI/2);
  const perpY = Math.sin(angle + Math.PI/2);
  const backX = Math.cos(angle + Math.PI);
  const backY = Math.sin(angle + Math.PI);
  const e1baseX = z.x + perpX*8 + backX*6;
  const e1baseY = z.y + perpY*8 + backY*6;
  const e1tipX  = e1baseX + perpX*10 + backX*14 + perpX*earWave*0.3;
  const e1tipY  = e1baseY + perpY*10 + backY*14 + perpY*earWave*0.3;
  const e2baseX = z.x - perpX*8 + backX*6;
  const e2baseY = z.y - perpY*8 + backY*6;
  const e2tipX  = e2baseX - perpX*10 + backX*14 - perpX*earWave*0.3;
  const e2tipY  = e2baseY - perpY*10 + backY*14 - perpY*earWave*0.3;
  ctx.fillStyle = z.earColor;
  ctx.beginPath();
  ctx.moveTo(e1baseX + perpX*3, e1baseY + perpY*3);
  ctx.lineTo(e1tipX - perpX*2,  e1tipY - perpY*2);
  ctx.lineTo(e1baseX - perpX*3, e1baseY - perpY*3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(e2baseX - perpX*3, e2baseY - perpY*3);
  ctx.lineTo(e2tipX + perpX*2,  e2tipY + perpY*2);
  ctx.lineTo(e2baseX + perpX*3, e2baseY + perpY*3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(e1baseX, e1baseY); ctx.lineTo(e1tipX, e1tipY);
  ctx.lineTo(e1baseX - perpX*6, e1baseY - perpY*6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e2baseX, e2baseY); ctx.lineTo(e2tipX, e2tipY);
  ctx.lineTo(e2baseX + perpX*6, e2baseY + perpY*6); ctx.stroke();


  ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
  ctx.fillStyle = z.bodyColor; ctx.fill();
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth = 2.5; ctx.stroke();


  const eyeOffsetX = Math.cos(angle) * 4;
  const eyeOffsetY = Math.sin(angle) * 4;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(z.x - 5 + eyeOffsetX*0.3, z.y - 3 + eyeOffsetY*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + eyeOffsetX*0.3, z.y - 3 + eyeOffsetY*0.3, 3.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(z.x - 5 + eyeOffsetX, z.y - 3 + eyeOffsetY, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(z.x + 5 + eyeOffsetX, z.y - 3 + eyeOffsetY, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#880e4f'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(z.x, z.y + 5, 4, 0, Math.PI); ctx.stroke();


  if(z.hp < z.maxHp){
    const w = z.r*2;
    ctx.fillStyle = '#000';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w, 4);
    ctx.fillStyle = '#f44336';
    ctx.fillRect(z.x-w/2, z.y-z.r-14, w*(z.hp/z.maxHp), 4);
  }
}


function drawRainbowZombie(z){

function drawCross(cx, cy, size){
  ctx.fillStyle = '#000';
  const w = size * 0.5;
  const h = size * 1.6;
  ctx.fillRect(cx - w/2, cy - h/2, w, h);
  const barY = cy - h*0.15;
  ctx.fillRect(cx - h*0.45, barY - w/2, h*0.9, w);
}


function drawVampire(v){

  const sinA = Math.sin(a);

  const lookY = sinA * 3;
  const eyeY = v.y + 2;

  ctx.beginPath(); ctx.arc(v.x, v.y - 5, v.r - 1, Math.PI, 0); ctx.closePath();

  helmGrad.addColorStop(1, '#607d8b');

    ctx.fillStyle = '#d32f2f';
    ctx.fillRect(v.x-w/2, v.y - v.r - 16, w*(v.hp/v.maxHp), 5);
  }
}
